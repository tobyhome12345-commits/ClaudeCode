<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emberdeep — Dungeon Crawler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #05040a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; cursor: crosshair; touch-action: none; }
    #back-btn {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 999;
      padding: 0.3rem 0.8rem;
      background: rgba(13,13,26,0.82);
      color: #a8dadc;
      border: 1px solid #1a3a6a;
      border-radius: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #back-btn:hover { background: rgba(168,218,220,0.12); border-color: #a8dadc; color: #fff; }

    /* ── Touch controls (touch devices only) ─────────────────── */
    #touch-ui { display: none; }
    .joy {
      position: fixed; bottom: 24px; z-index: 200;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      touch-action: none;
    }
    #joyL { left: 24px; }
    #joyR { right: 24px; border-color: rgba(255,150,80,0.4); }
    .joy .dot {
      position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.35);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .tbtn {
      position: fixed; right: 24px; z-index: 200;
      width: 64px; height: 40px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      font: bold 11px 'Courier New', monospace;
      touch-action: none;
    }
    #btnDash   { bottom: 156px; }
    #btnPotion { bottom: 204px; }
    #btnUse    { bottom: 252px; }
    @media (pointer: coarse) {
      #touch-ui { display: block; }
      canvas { cursor: default; }
    }
  </style>
</head>
<body>
<a id="back-btn" href="index.html">&#8592; Hub</a>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="touch-ui">
  <div id="joyL" class="joy"><div class="dot"></div></div>
  <div id="joyR" class="joy"><div class="dot"></div></div>
  <button id="btnDash" class="tbtn">DASH</button>
  <button id="btnPotion" class="tbtn">POTION</button>
  <button id="btnUse" class="tbtn">USE</button>
</div>
<script>
'use strict';
// ============================================================
// CONSTANTS  (all gameplay tuning lives here)
// ============================================================

const TILE = 32;
const MAP_W = 56, MAP_H = 42;
const TAU = Math.PI * 2;
const FINAL_FLOOR = 3;

const T_WALL = 0, T_FLOOR = 1, T_PILLAR = 2, T_STAIRS = 3, T_GATE = 4;

const PLAYER_SPEED = 175;             // px / second

const FOV_RADIUS = 7;                 // tiles

const DIFFICULTIES = [               // hp / dmg multiply every enemy's health and the damage you take
  { name: 'Easy',   hp: 0.8, dmg: 0.7,  color: '#63c74d', blurb: 'Gentler monsters — great for a first run' },
  { name: 'Normal', hp: 1.0, dmg: 1.0,  color: '#fee761', blurb: 'The intended challenge' },
  { name: 'Hard',   hp: 1.3, dmg: 1.35, color: '#e43b44', blurb: 'Tougher, harder-hitting monsters' },
];
const FLOOR_HP_SCALE = 0.6, FLOOR_DMG_SCALE = 0.45, FLOOR_SPEED_SCALE = 0.05;
const ENEMY_STATS = {
  slime:    { hp: 36,   speed: 78,  r: 12, dmg: 14, gold: [1, 3] },
  mini:     { hp: 12,   speed: 105, r: 8,  dmg: 7,  gold: [0, 1] },   // spawned when a slime splits
  bat:      { hp: 16,   speed: 160, r: 9,  dmg: 12, gold: [1, 2] },
  skeleton: { hp: 30,   speed: 85,  r: 11, dmg: 16, gold: [2, 4] },
  boss:     { hp: 1300, speed: 72,  r: 32, dmg: 22, gold: [40, 40] },
};
const SPAWN_WEIGHTS = [               // per floor
  { slime: 55, bat: 30, skeleton: 15 },
  { slime: 38, bat: 30, skeleton: 32 },
  { slime: 30, bat: 30, skeleton: 40 },
];
const SLIME_HOP_TIME = 0.32, SLIME_HOP_BOOST = 2.6;
const BAT_FLEE_TIME = 0.7;
const SKELETON_NEAR = 140, SKELETON_FAR = 270, SKELETON_SIGHT = 400;
const SKELETON_AIM_TIME = 0.45, SKELETON_ARROW_SPEED = 300;
const POTION_DROP_CHANCE = 0.035, CHEST_POTION_CHANCE = 0.35;
const POTS_PER_ROOM = [2, 4], POT_GOLD = [0, 2], POT_POTION_CHANCE = 0.03, POT_RADIUS = 10;
const POT_TOUCH = POT_RADIUS + PLAYER_RADIUS + 6;   // any attack breaks a pot this close, whatever the aim
const ELITE_HP_MUL = 2.6, ELITE_DMG_MUL = 1.3, ELITE_SCALE = 1.3, ELITE_GOLD = 8;   // one champion per floor
const SHOP_PRICES = { potion: 40, relic: 90, weapon: [0, 110, 170] };   // weapon price by rarity
const SHOP_EPIC_ODDS = [0, 0.35, 0.6];                                // per floor; otherwise the shop weapon is Rare

const BOSS_NAME = 'THE EMBER KING';
const BOSS_COLLIDE_R = 24;
const BOSS_SIDESTEP_TIME = 0.7;        // how long the boss walks sideways after bumping into a pillar
const BOSS_CHARGE_SPEED = 540;
const BOSS_BULLET_DMG = 16, BOSS_CHARGE_DMG = 30;
const BOSS_SLAM_RADIUS = 125, BOSS_SLAM_DMG = 24, BOSS_SLAM_TELL = 0.6;
const BOSS_RING_COUNT = 14, BOSS_RING_SPEED = 170;
const BOSS_FAN_COUNT = 5, BOSS_FAN_SPREAD = 0.22, BOSS_FAN_SPEED = 230;
const BOSS_SPIRAL_SPEED = 185;

const WEAPONS = {
  sword: { name: 'Sword',      icon: 'sword', kind: 'melee', dmg: 16, cd: 0.36, range: 56, arc: 1.9, knock: 190 },
  bow:   { name: 'Bow',        icon: 'bow',   kind: 'arrow', dmg: 11, cd: 0.36, speed: 560, pierce: 1, knock: 120 },
  staff: { name: 'Fire Staff', icon: 'staff', kind: 'orb',   dmg: 12, cd: 0.52, speed: 380, aoe: 50, knock: 160 },
};
const WEAPON_KEYS = Object.keys(WEAPONS);
const RARITIES = [
  { name: 'Common', mult: 1.0,  color: '#c8ccd4', rgb: '200,204,212' },
  { name: 'Rare',   mult: 1.35, color: '#4da6ff', rgb: '77,166,255' },
  { name: 'Epic',   mult: 1.75, color: '#c77dff', rgb: '199,125,255' },
];
const RARITY_ODDS = [[0.70, 0.26, 0.04], [0.45, 0.43, 0.12], [0.25, 0.50, 0.25]];   // per floor

const RELICS = {
  boots:  { name: 'Swift Boots',  desc: '+12% speed' },
  shard:  { name: 'Power Shard',  desc: '+18% damage' },
  charm:  { name: 'Storm Charm',  desc: 'Attack 12% faster' },
  fang:   { name: 'Vampire Fang', desc: 'Heal 2 HP per kill' },
  shield: { name: 'Iron Crest',   desc: 'Take 15% less damage' },
  heart:  { name: 'Heart Vessel', desc: '+25 max HP' },
};
const RELIC_KEYS = Object.keys(RELICS);

const THEMES = [
  { name: 'The Forgotten Crypt', floor: '#2c2f45', line: '#1b1d2f', wallTop: '#1f2135', rim: '#4d5378',
    brick: '#4d5275', brickDark: '#3a3e5c', brickLight: '#6a709c', mortar: '#222439',
    banner: '#3a86ff', emblem: '#c0cbdc', dark: '5,5,14', mote: '190,205,255', moteVy: 5 },
  { name: 'The Mossy Halls',     floor: '#2a3830', line: '#18231d', wallTop: '#18231c', rim: '#44624e',
    brick: '#4a6350', brickDark: '#394d3e', brickLight: '#699071', mortar: '#1c2921',
    banner: '#3e8948', emblem: '#fee761', dark: '3,9,6', mote: '170,255,160', moteVy: -3 },
  { name: 'The Ember Throne',    floor: '#3c2828', line: '#261718', wallTop: '#261617', rim: '#74403a',
    brick: '#6e3d38', brickDark: '#562e2b', brickLight: '#9a5b4e', mortar: '#291516',
    banner: '#a22633', emblem: '#feae34', dark: '12,3,3', mote: '255,160,60', moteVy: -26 },
];

const STAIN_COLORS = {                 // what each monster leaves on the floor
  slime: ['#3e8948', '#265c42', '#63c74d'], mini: ['#3e8948', '#265c42'], bat: ['#68386c', '#3e2148'],
  skeleton: ['#ead4aa', '#b9a47c', '#8b9bb4'], boss: ['#181425', '#3e2731', '#be4a2f'],
};
const DEATH_COLORS = {
  slime: ['#63c74d', '#3e8948', '#f4f4f4'], mini: ['#63c74d', '#3e8948'],
  bat: ['#b55088', '#68386c', '#e43b44'], skeleton: ['#ead4aa', '#f4f4f4', '#9aa5b1'],
  boss: ['#e43b44', '#f77622', '#fee761', '#a22633'],
};

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ============================================================
// SPRITES  (smooth shaded shapes, drawn once into offscreen canvases at 3x for sharpness)
// ============================================================
const SS = 3;                                         // sprite pixels per world unit
const INK = '#15101f';                                // outline colour
const SPR = {}, SPR_FLASH = {};

function lin(g, x0, y0, x1, y1, ...stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function radial(g, x, y, r, ...stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c));
  return gr;
}
function paint(g, fill, outline = 1.4) {              // fills the current path and inks its edge
  g.fillStyle = fill; g.fill();
  if (outline) { g.strokeStyle = INK; g.lineWidth = outline; g.stroke(); }
}
function oval(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.closePath(); }
function glowDot(g, x, y, r, core, glow) {
  g.save(); g.shadowColor = glow; g.shadowBlur = r * 3 * SS; g.fillStyle = core; oval(g, x, y, r, r); g.fill(); g.restore();
}
function bone(g, x0, y0, x1, y1, w) {
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1);
  g.strokeStyle = INK; g.lineWidth = w + 1.6; g.stroke();
  g.strokeStyle = '#eadfc0'; g.lineWidth = w; g.stroke();
}
function tinted(src, color) {                         // a flat silhouette of a sprite
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  c.lw = src.lw; c.lh = src.lh;
  return c;
}
function defSprite(name, w, h, draw) {
  const c = makeCanvas(w * SS, h * SS), g = c.getContext('2d');
  g.scale(SS, SS); g.lineJoin = 'round'; g.lineCap = 'round';
  draw(g);
  c.lw = w; c.lh = h;                                 // size in world units
  SPR[name] = c;
  SPR_FLASH[name] = tinted(c, '#ffffff');
}

function drawKnight(g, step) {
  for (const [x, dx] of [[10.4, -1.6], [16.6, 1.6]]) {                 // boots
    rrect(g, x + dx * step, 23.5, 5, 7, 1.6); paint(g, lin(g, 0, 23, 0, 31, '#7c88a6', '#353c52'));
  }
  rrect(g, 9, 14, 14, 12, 3.6); paint(g, lin(g, 9, 0, 23, 0, '#7db4ff', '#3a7bf0', '#1b46b0'));   // tunic
  g.fillStyle = 'rgba(255,255,255,0.18)'; rrect(g, 10.4, 15.2, 3.4, 8.5, 1.6); g.fill();
  g.fillStyle = lin(g, 0, 21.6, 0, 24, '#ffe07a', '#c98a1e'); g.fillRect(9.7, 21.6, 12.6, 2.3);   // belt
  g.fillStyle = '#fff6c4'; rrect(g, 14.8, 21.3, 2.6, 2.9, 0.6); g.fill();
  poly(g, [[16, 15.6], [18, 17.8], [16, 20], [14, 17.8]]); g.fillStyle = '#ffe07a'; g.fill();     // crest
  for (const x of [8.4, 23.6]) {                                      // pauldrons and gauntlets
    oval(g, x, 21.4, 2.3, 2.5); paint(g, lin(g, 0, 19, 0, 24, '#aab4c8', '#59637d'), 1.2);
    oval(g, x, 16.6, 3.3, 3.2); paint(g, radial(g, x - 1, 15.4, 4.4, '#f3f6fb', '#a3aec6', '#5d6884'));
  }
  g.beginPath(); g.moveTo(15.5, 4.2); g.bezierCurveTo(11, -1.5, 3.5, 0.5, 4.6, 8); g.bezierCurveTo(7.5, 4.6, 11, 5.4, 13.6, 7.6); g.closePath();
  paint(g, lin(g, 4, 0, 15, 8, '#ff7b74', '#d0303c', '#8c1826'), 1.2);                            // plume
  rrect(g, 9.4, 2.8, 13.4, 13, 5.6); paint(g, radial(g, 13.5, 6, 13, '#f6f8fc', '#a9b4cb', '#566079'));   // helmet
  rrect(g, 11.2, 8.2, 11.8, 3.9, 1.7); g.fillStyle = '#121728'; g.fill();                         // visor
  glowDot(g, 15.4, 10.1, 1.05, '#aefaff', '#2ce8f5'); glowDot(g, 20.1, 10.1, 1.05, '#aefaff', '#2ce8f5');
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1; g.beginPath(); g.arc(16, 9.6, 5.4, Math.PI * 1.12, Math.PI * 1.45); g.stroke();
  g.strokeStyle = INK; g.lineWidth = 0.8; g.beginPath(); g.moveTo(16.1, 12.2); g.lineTo(16.1, 15.4); g.stroke();
}

function drawSlime(g) {
  g.beginPath(); g.moveTo(2.6, 21.5); g.bezierCurveTo(0.2, 11, 7, 1.6, 16, 1.6); g.bezierCurveTo(25, 1.6, 31.8, 11, 29.4, 21.5);
  g.bezierCurveTo(27.5, 25.4, 4.5, 25.4, 2.6, 21.5); g.closePath();
  paint(g, radial(g, 11.5, 8.5, 21, '#d4ff9a', '#6fd052', '#3d9a45', '#256b3a'), 1.6);
  g.save(); g.clip();
  g.fillStyle = lin(g, 0, 17, 0, 26, 'rgba(10,60,30,0)', 'rgba(10,60,30,0.55)'); g.fillRect(0, 17, 32, 9);   // darker belly
  g.restore();
  oval(g, 10.2, 7.6, 4.2, 2.2, -0.5); g.fillStyle = 'rgba(255,255,255,0.8)'; g.fill();          // gloss
  oval(g, 15.6, 5, 1.1, 0.8); g.fill();
  for (const x of [11.2, 20.8]) {
    oval(g, x, 14.2, 2.1, 2.8); g.fillStyle = INK; g.fill();
    oval(g, x - 0.6, 13.1, 0.8, 0.9); g.fillStyle = '#fff'; g.fill();
  }
  g.strokeStyle = INK; g.lineWidth = 1.3; g.beginPath(); g.arc(16, 17, 3.2, Math.PI * 0.18, Math.PI * 0.82); g.stroke();
}

function drawSkeleton(g, step) {
  bone(g, 14.2, 23.5, 13.2 - step * 2.2, 29.5, 2.2); bone(g, 17.8, 23.5, 18.8 + step * 2.2, 29.5, 2.2);     // legs
  bone(g, 11, 30.2 - 0, 13.4 - step * 2.2, 30.2, 1.8); bone(g, 18.6 + step * 2.2, 30.2, 21, 30.2, 1.8);     // feet
  bone(g, 11, 15.6, 7.6, 21.5, 2); bone(g, 21, 15.6, 24.4, 21.5, 2);                                         // arms
  bone(g, 16, 13.5, 16, 23, 2.2);                                                                           // spine
  for (const y of [16, 18.6, 21.2]) {                                                                       // ribs
    g.beginPath(); g.moveTo(11.4, y); g.quadraticCurveTo(16, y + 1.6, 20.6, y);
    g.strokeStyle = INK; g.lineWidth = 3; g.stroke(); g.strokeStyle = '#eadfc0'; g.lineWidth = 1.5; g.stroke();
  }
  rrect(g, 12.6, 22.2, 6.8, 3, 1.3); paint(g, '#d9cba6', 1.2);                                              // pelvis
  rrect(g, 12.2, 10.6, 7.6, 4.2, 1.3); paint(g, lin(g, 0, 10.6, 0, 15, '#eadfc0', '#b9a882'), 1.2);        // jaw
  rrect(g, 9.4, 1.4, 13.2, 11.6, 5.4); paint(g, radial(g, 13.5, 5, 12, '#fffaf0', '#eadfc0', '#b3a17c'));  // skull
  for (const x of [13.2, 18.8]) {
    oval(g, x, 7.6, 2, 2.3); g.fillStyle = '#1a1220'; g.fill();
    glowDot(g, x, 7.9, 0.8, '#ff9d94', '#ff2f3e');
  }
  poly(g, [[16, 9.6], [15.1, 11.4], [16.9, 11.4]]); g.fillStyle = '#1a1220'; g.fill();
  g.strokeStyle = '#1a1220'; g.lineWidth = 0.6; g.beginPath();
  for (const x of [14, 15.35, 16.65, 18]) { g.moveTo(x, 12.4); g.lineTo(x, 14.4); }
  g.stroke();
}

function drawBat(g, up) {
  for (const s of [-1, 1]) {
    g.beginPath(); g.moveTo(16 + s * 3, 8.5);
    g.quadraticCurveTo(16 + s * 9, up ? 0.5 : 7.5, 16 + s * 15.2, up ? 2.5 : 13.5);
    g.quadraticCurveTo(16 + s * 12.6, up ? 8.5 : 14, 16 + s * 10.6, up ? 11.5 : 16.2);
    g.quadraticCurveTo(16 + s * 9, up ? 9 : 12.5, 16 + s * 6.6, up ? 13.2 : 15.6);
    g.quadraticCurveTo(16 + s * 5, 11, 16 + s * 3, 13);
    g.closePath();
    paint(g, lin(g, 16, 0, 16 + s * 15, 0, '#c45c98', '#7b3676', '#4a2052'), 1.3);
    g.strokeStyle = 'rgba(20,10,30,0.45)'; g.lineWidth = 0.7;         // wing fingers
    g.beginPath(); g.moveTo(16 + s * 4, 9.5); g.lineTo(16 + s * 10.6, up ? 11 : 15.6); g.moveTo(16 + s * 4, 9.5); g.lineTo(16 + s * 6.6, up ? 12.8 : 15.2); g.stroke();
  }
  for (const s of [-1, 1]) { poly(g, [[16 + s * 1, 6.6], [16 + s * 3.9, 1.8], [16 + s * 4.4, 7.6]]); paint(g, '#8e3f7d', 1.1); }   // ears
  oval(g, 16, 10.4, 4.7, 5.4); paint(g, radial(g, 14.6, 8.4, 7, '#e07cb2', '#a8468a', '#5b2a5e'));
  glowDot(g, 14.1, 9.6, 0.95, '#ffb3a8', '#ff2f3e'); glowDot(g, 17.9, 9.6, 0.95, '#ffb3a8', '#ff2f3e');
  g.fillStyle = '#fff'; poly(g, [[14.6, 12.4], [15.7, 12.4], [15.1, 14.6]]); g.fill(); poly(g, [[16.3, 12.4], [17.4, 12.4], [16.9, 14.6]]); g.fill();
}

function drawMerchant(g) {
  g.strokeStyle = INK; g.lineWidth = 2.6; g.beginPath(); g.moveTo(24.5, 20.5); g.lineTo(27, 7.5); g.stroke();             // lantern pole
  g.strokeStyle = '#8a5a3c'; g.lineWidth = 1.3; g.stroke();
  g.beginPath(); g.moveTo(7.6, 28.8); g.quadraticCurveTo(6.6, 16, 11, 11); g.lineTo(21, 11); g.quadraticCurveTo(25.4, 16, 24.4, 28.8); g.closePath();
  paint(g, lin(g, 7, 0, 25, 0, '#d880b6', '#9a4689', '#5a2960'));                                                      // robe
  g.strokeStyle = 'rgba(40,10,50,0.45)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(13, 16); g.quadraticCurveTo(12, 23, 12.6, 28); g.moveTo(19.4, 16); g.quadraticCurveTo(20.4, 23, 19.6, 28); g.stroke();
  g.fillStyle = lin(g, 0, 26, 0, 28.6, '#ffe07a', '#c98a1e'); g.fillRect(8.2, 26.2, 15.6, 1.5);

  g.fillStyle = '#ffe07a'; oval(g, 16, 20.6, 0.9, 0.9); g.fill();

// Draws a sprite centred on (x, y) in world units.
function drawSprite(g, name, x, y, flip = 1, flash = false, sx = 1, sy = 1) {
  const img = (flash ? SPR_FLASH : SPR)[name];
  g.save();

}

// UTILITIES

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;                // seeded per floor; cosmetic effects use Math.random
const rand = (a, b) => a + rng() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => rng() < p;
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function weightedPick(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let roll = rng() * total;
  for (const k in weights) { roll -= weights[k]; if (roll <= 0) return k; }
  return Object.keys(weights)[0];
}
function formatTime(sec) {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ============================================================
const audio = { ctx: null, master: null, noiseBuf: null, muted: false };
function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.3;
    audio.master.connect(audio.ctx.destination);
    const len = Math.floor(audio.ctx.sampleRate * 0.5);
    audio.noiseBuf = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
    const data = audio.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  } catch (err) { audio.ctx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.2, slideTo = 0, delay = 0) {
