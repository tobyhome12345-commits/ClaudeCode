  g.fillStyle = tone > 0 ? `rgba(255,255,255,${tone})` : `rgba(0,0,0,${-tone * 1.6})`; g.fill();
  const gr = g.createLinearGradient(x, y, x + w, y + h);              // lit from the top-left
  gr.addColorStop(0, 'rgba(255,255,255,0.1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.22)');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 0.8; g.stroke();
}

function paintFloor(tx, ty) {
  const th = theme(), x = tx * TILE, y = ty * TILE, r = artRng, g = actx;
  g.fillStyle = th.line; g.fillRect(x, y, TILE, TILE);                // grout
  const roll = r();
  if (roll < 0.58) paintSlab(x, y, 32, 32);
  else if (roll < 0.72) { paintSlab(x, y, 16, 32); paintSlab(x + 16, y, 16, 32); }
  else if (roll < 0.86) { paintSlab(x, y, 32, 16); paintSlab(x, y + 16, 32, 16); }
  else for (const [ox, oy] of [[0, 0], [16, 0], [0, 16], [16, 16]]) paintSlab(x + ox, y + oy, 16, 16);
  if (r() < 0.1) paintCrack(x + 6 + r() * 20, y + 3, 24, x + 3, x + 29, 'rgba(0,0,0,0.55)', 1.1);
  if (r() < 0.12) for (let i = 0; i < 3; i++) {                        // loose pebbles
    const px = x + 4 + r() * 24, py = y + 4 + r() * 24, pr = 0.8 + r() * 1.1;
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(px + 0.5, py + 0.8, pr, pr * 0.7, 0, 0, TAU); g.fill();
    g.fillStyle = shade(th.floor, 0.3); g.beginPath(); g.ellipse(px, py, pr, pr * 0.75, 0, 0, TAU); g.fill();
  }
  const extra = r();
  if (game.floor === 1 && extra < 0.015) {            // an old bone
    const bx = x + 9 + r() * 12, by = y + 9 + r() * 14, a = r() * Math.PI, dx = Math.cos(a) * 5, dy = Math.sin(a) * 5;
    g.lineCap = 'round';
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 2.6; g.beginPath(); g.moveTo(bx - dx + 0.6, by - dy + 1); g.lineTo(bx + dx + 0.6, by + dy + 1); g.stroke();
    g.strokeStyle = '#e6d6b4'; g.lineWidth = 2; g.beginPath(); g.moveTo(bx - dx, by - dy); g.lineTo(bx + dx, by + dy); g.stroke();
    g.fillStyle = '#f2e6c8';
    for (const s of [-1, 1]) for (const t of [-1, 1]) { g.beginPath(); g.arc(bx + s * dx - t * dy * 0.22, by + s * dy + t * dx * 0.22, 1.5, 0, TAU); g.fill(); }
  } else if (game.floor === 2 && extra < 0.2) {       // moss
    const mx = x + 5 + r() * 22, my = y + 5 + r() * 22;
    for (let i = 0; i < 13; i++) {
      const a = r() * TAU, d = r() * 7.5;
      g.fillStyle = r() < 0.2 ? 'rgba(120,205,90,0.9)' : r() < 0.55 ? 'rgba(62,137,72,0.92)' : 'rgba(38,92,66,0.92)';
      g.beginPath(); g.arc(mx + Math.cos(a) * d, my + Math.sin(a) * d * 0.7, 1 + r() * 2.5, 0, TAU); g.fill();
    }
  } else if (game.floor === 2 && extra < 0.24) {      // puddle
    const px = x + 16 + (r() - 0.5) * 8, py = y + 18 + (r() - 0.5) * 8;
    const gr = g.createRadialGradient(px, py, 1, px, py, 10);
    gr.addColorStop(0, 'rgba(16,52,58,0.9)'); gr.addColorStop(0.8, 'rgba(18,58,60,0.75)'); gr.addColorStop(1, 'rgba(18,58,60,0)');
    g.save(); g.translate(px, py); g.scale(1, 0.5); g.translate(-px, -py);
    g.fillStyle = gr; g.beginPath(); g.arc(px, py, 10, 0, TAU); g.fill(); g.restore();
    g.strokeStyle = 'rgba(190,240,220,0.35)'; g.lineWidth = 0.8; g.beginPath(); g.ellipse(px - 2, py - 1, 4, 1.3, 0, Math.PI, TAU); g.stroke();
  } else if (game.floor === 3 && extra < 0.08) {      // glowing crack
    let cx = x + 3, cy = y + 8 + r() * 16;
    g.beginPath(); g.moveTo(cx, cy);
    while (cx < x + 28) { cx += 3 + r() * 4; cy = clamp(cy + (r() - 0.5) * 8, y + 4, y + 28); g.lineTo(cx, cy); }
    g.lineJoin = 'round'; g.lineCap = 'round';
    glowLine('#f76a1c', '#ffd98a', 1.7);
  } else if (game.floor === 3 && extra < 0.12) {      // ash
    for (let i = 0; i < 12; i++) { g.fillStyle = r() < 0.5 ? 'rgba(120,125,140,0.5)' : 'rgba(20,18,24,0.5)'; g.beginPath(); g.arc(x + 8 + r() * 16, y + 12 + r() * 12, 0.6 + r() * 1.2, 0, TAU); g.fill(); }
  }
}

function paintStairs(tx, ty) {
  const th = theme(), x = tx * TILE, y = ty * TILE, g = actx;
  rrect(g, x + 1.5, y + 1.5, 29, 29, 3); g.fillStyle = shade(th.floor, 0.3); g.fill();
  g.fillStyle = '#05040a'; g.fillRect(x + 4, y + 4, 24, 24);
  for (let i = 0; i < 6; i++) {
    const sy = y + 4 + i * 4, lum = 0.16 - i * 0.2;
    g.fillStyle = shade(th.floor, lum); g.fillRect(x + 4, sy, 24, 4);
    g.fillStyle = fade(g, 0, sy, 0, sy + 4, 'rgba(255,255,255,0.18)', 'rgba(0,0,0,0.35)'); g.fillRect(x + 4, sy, 24, 4);
  }
  g.fillStyle = fade(g, x + 4, 0, x + 9, 0, 'rgba(0,0,0,0.55)', 'rgba(0,0,0,0)'); g.fillRect(x + 4, y + 4, 5, 24);
  g.fillStyle = fade(g, x + 28, 0, x + 23, 0, 'rgba(0,0,0,0.55)', 'rgba(0,0,0,0)'); g.fillRect(x + 23, y + 4, 5, 24);
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1; g.strokeRect(x + 4, y + 4, 24, 24);
}

function paintGate(tx, ty) {
  const x = tx * TILE, y = ty * TILE, g = actx;
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x, y, TILE, TILE);
  for (let bx = x + 3; bx < x + TILE; bx += 6.5) {
    const gr = g.createLinearGradient(bx, 0, bx + 3.4, 0);
    gr.addColorStop(0, '#2a2e3c'); gr.addColorStop(0.35, '#c7d0e0'); gr.addColorStop(1, '#3d4459');
    g.fillStyle = '#0c0a14'; g.fillRect(bx - 0.6, y, 4.6, TILE);
    g.fillStyle = gr; g.fillRect(bx, y, 3.4, TILE);
  }
  for (const by of [6, 20]) {
    g.fillStyle = '#0c0a14'; g.fillRect(x, y + by - 0.6, TILE, 5.2);
    g.fillStyle = fade(g, 0, y + by, 0, y + by + 4, '#aab4c8', '#3d4459'); g.fillRect(x, y + by, TILE, 4);
  }
}

// Soft shadows where the floor meets a wall.
function paintShadows(tx, ty) {
  const x = tx * TILE, y = ty * TILE, g = actx;
  if (!openAt(tx, ty - 1)) { g.fillStyle = fade(g, 0, y, 0, y + 13, 'rgba(0,0,0,0.55)', 'rgba(0,0,0,0)'); g.fillRect(x, y, TILE, 13); }
  if (!openAt(tx - 1, ty)) { g.fillStyle = fade(g, x, 0, x + 7, 0, 'rgba(0,0,0,0.38)', 'rgba(0,0,0,0)'); g.fillRect(x, y, 7, TILE); }
  if (!openAt(tx + 1, ty)) { g.fillStyle = fade(g, x + TILE, 0, x + TILE - 7, 0, 'rgba(0,0,0,0.38)', 'rgba(0,0,0,0)'); g.fillRect(x + TILE - 7, y, 7, TILE); }
  if (!openAt(tx, ty + 1)) { g.fillStyle = fade(g, 0, y + TILE, 0, y + TILE - 5, 'rgba(0,0,0,0.32)', 'rgba(0,0,0,0)'); g.fillRect(x, y + TILE - 5, TILE, 5); }
}

function paintWall(tx, ty) {
  const th = theme(), x = tx * TILE, y = ty * TILE, r = artRng, g = actx;
  const L = openAt(tx - 1, ty), R = openAt(tx + 1, ty), U = openAt(tx, ty - 1);
  g.save();
  g.beginPath(); g.rect(x, y, TILE, TILE); g.clip();
  if (isFaceTile(tx, ty)) {
    g.fillStyle = th.mortar; g.fillRect(x, y + 10, TILE, 22);          // brick front
    for (let row = 0; row < 3; row++) {
      const by = y + 10.6 + row * 7.15, off = row % 2 ? 8 : 0;
      for (let k = Math.floor((x - off) / 16); k * 16 + off < x + TILE; k++) {      // bricks line up across tiles
        const bx = k * 16 + off, tone = (hash2(k * 3 + row, ty * 7 + row) - 0.5) * 0.24;
        rrect(g, bx + 0.6, by, 14.8, 6.3, 1.3);
        g.fillStyle = tex.brick; g.fill();
        g.fillStyle = tone > 0 ? `rgba(255,255,255,${tone})` : `rgba(0,0,0,${-tone * 1.5})`; g.fill();
        const gr = g.createLinearGradient(0, by, 0, by + 6.3);
        gr.addColorStop(0, 'rgba(255,255,255,0.2)'); gr.addColorStop(0.3, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.32)');
        g.fillStyle = gr; g.fill();
      }
    }
    g.fillStyle = fade(g, 0, y + 10, 0, y + 16, 'rgba(0,0,0,0.5)', 'rgba(0,0,0,0)'); g.fillRect(x, y + 10, TILE, 6);
    g.fillStyle = fade(g, 0, y + 32, 0, y + 25, 'rgba(0,0,0,0.5)', 'rgba(0,0,0,0)'); g.fillRect(x, y + 25, TILE, 7);
    g.fillStyle = tex.top; g.fillRect(x, y, TILE, 10);                 // top of the wall, with a lit lip
    g.fillStyle = fade(g, 0, y, 0, y + 10, 'rgba(0,0,0,0.25)', 'rgba(255,255,255,0.06)'); g.fillRect(x, y, TILE, 10);
    g.fillStyle = th.rim; g.fillRect(x, y + 7.4, TILE, 1.7);
    g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(x, y + 7.4, TILE, 0.6);
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(x, y + 9.1, TILE, 0.9);
    if (U) { g.fillStyle = th.rim; g.fillRect(x, y, TILE, 1.4); }
    if (L) { g.fillStyle = th.rim; g.fillRect(x, y, 1.4, 8); g.fillStyle = fade(g, x, 0, x + 5, 0, 'rgba(0,0,0,0.45)', 'rgba(0,0,0,0)'); g.fillRect(x, y + 10, 5, 22); }
    if (R) { g.fillStyle = th.rim; g.fillRect(x + TILE - 1.4, y, 1.4, 8); g.fillStyle = fade(g, x + TILE, 0, x + TILE - 5, 0, 'rgba(0,0,0,0.45)', 'rgba(0,0,0,0)'); g.fillRect(x + TILE - 5, y + 10, 5, 22); }
    const roll = r();
    if (roll < 0.09) paintCrack(x + 5 + r() * 22, y + 11, 18, x + 2, x + 30, 'rgba(0,0,0,0.6)', 1.1);
    else if (game.floor === 2 && roll < 0.4) {        // hanging vines
      for (let v = 1 + Math.floor(r() * 3); v > 0; v--) {
        const vx = x + 3 + r() * 26, len = 7 + r() * 17, sway = (r() - 0.5) * 7;
        g.strokeStyle = '#2c6240'; g.lineWidth = 1.3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(vx, y + 6); g.quadraticCurveTo(vx + sway, y + 6 + len * 0.5, vx + sway * 0.4, y + 6 + len); g.stroke();
        for (let t = 0.2; t <= 1; t += 0.2 + r() * 0.1) {
          const lx = vx + sway * (2 * t * (1 - t) + 0.4 * t * t), ly = y + 6 + len * t, side = r() < 0.5 ? -1 : 1;
          g.fillStyle = t > 0.85 ? '#7fd45f' : r() < 0.5 ? '#3e8948' : '#4fa35a';
          g.beginPath(); g.ellipse(lx + side * 1.8, ly, 2.1, 1.1, side * 0.6, 0, TAU); g.fill();
        }
      }
    } else if (game.floor === 3 && roll < 0.22) {     // ember seams
      let cx = x + 5 + r() * 22, cy = y + 11;
      g.beginPath(); g.moveTo(cx, cy);
      while (cy < y + 28) { cy += 3 + r() * 3; cx = clamp(cx + (r() - 0.5) * 7, x + 2, x + 30); g.lineTo(cx, cy); }
      g.lineJoin = 'round'; g.lineCap = 'round';
      glowLine('#f76a1c', '#ffd98a', 1.5);
    } else if (game.floor !== 2 && roll < 0.16) {     // rusty chain
      const cx = x + 6 + r() * 20;
      for (let i = 0; i < 5; i++) {
        g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 1.9; g.beginPath(); g.ellipse(cx + 0.5, y + 12.5 + i * 3.4, i % 2 ? 0.9 : 1.6, 2.3, 0, 0, TAU); g.stroke();
        g.strokeStyle = i % 2 ? '#7c8aa3' : '#aab4c8'; g.lineWidth = 1.1; g.beginPath(); g.ellipse(cx, y + 12 + i * 3.4, i % 2 ? 0.9 : 1.6, 2.3, 0, 0, TAU); g.stroke();
      }
    }
    g.restore();
    return;
  }
  g.fillStyle = tex.top; g.fillRect(x, y, TILE, TILE);
  g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(x, y, TILE, TILE);
  const edge = (x0, y0, w, h, gx0, gy0, gx1, gy1) => {                // a lit rim fading into the stone
    g.fillStyle = fade(g, gx0, gy0, gx1, gy1, 'rgba(255,255,255,0.16)', 'rgba(255,255,255,0)'); g.fillRect(x0, y0, w, h);
  };
  if (U) { edge(x, y, TILE, 6, 0, y, 0, y + 6); g.fillStyle = th.rim; g.fillRect(x, y, TILE, 1.5); }
  for (const side of [-1, 1]) {
    const face = isFaceTile(tx + side, ty);
    if (!(side < 0 ? L : R) && !face) continue;
    const top = face ? 8 : 0, ex = side < 0 ? x : x + TILE;            // beside a brick front the edge starts under the lip
    edge(side < 0 ? x : x + TILE - 6, y + top, 6, TILE - top, ex, 0, ex - side * 6, 0);
    g.fillStyle = th.rim; g.fillRect(side < 0 ? x : x + TILE - 1.5, y + top, 1.5, TILE - top);
  }
  g.fillStyle = th.rim;
  if (!U && !R && openAt(tx + 1, ty - 1)) g.fillRect(x + TILE - 1.5, y, 1.5, 1.5);
  if (!U && !L && openAt(tx - 1, ty - 1)) g.fillRect(x, y, 1.5, 1.5);
  g.restore();
}

function paintRoomDecor(room) {
  const th = theme(), r = artRng, g = actx, wx = room.cx * TILE + TILE / 2, wy = room.cy * TILE + TILE / 2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (room === dungeon.shopRoom) {                    // the merchant's rug
    const hw = Math.min(3, (room.w - 3) >> 1), x0 = (room.cx - hw) * TILE + 4, x1 = (room.cx + hw + 1) * TILE - 4;
    const y0 = Math.max(room.y, room.cy - 2) * TILE + 24, y1 = Math.min(room.y + room.h, room.cy + 3) * TILE - 6, w = x1 - x0, h = y1 - y0;
    g.strokeStyle = '#e8d6a8'; g.lineWidth = 1;
    for (let fx = x0 + 2; fx < x1; fx += 3) { g.beginPath(); g.moveTo(fx, y0 - 3); g.lineTo(fx, y0); g.moveTo(fx, y1); g.lineTo(fx, y1 + 3); g.stroke(); }   // fringe
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x0 + 1.5, y0 + 2, w, h);
    const base = g.createLinearGradient(x0, y0, x1, y1);
    base.addColorStop(0, '#a82a36'); base.addColorStop(0.5, '#8a1f2c'); base.addColorStop(1, '#6e1824');
    g.fillStyle = base; g.fillRect(x0, y0, w, h);
    g.strokeStyle = '#e0a53a'; g.lineWidth = 1.6; g.strokeRect(x0 + 4, y0 + 4, w - 8, h - 8);
    g.strokeStyle = '#5a121c'; g.lineWidth = 1; g.strokeRect(x0 + 7.5, y0 + 7.5, w - 15, h - 15);
    for (let py = y0 + 14; py < y1 - 10; py += 12) for (let px = x0 + 14 + (Math.round((py - y0) / 12) % 2) * 8; px < x1 - 10; px += 16) {
      g.fillStyle = '#c9772e'; g.beginPath(); g.moveTo(px, py - 3.5); g.lineTo(px + 3.5, py); g.lineTo(px, py + 3.5); g.lineTo(px - 3.5, py); g.closePath(); g.fill();
      g.fillStyle = '#f1c35a'; g.beginPath(); g.arc(px, py, 1, 0, TAU); g.fill();
    }
    g.fillStyle = tex.weave; g.globalAlpha = 0.22; g.fillRect(x0, y0, w, h); g.globalAlpha = 1;       // woven texture
  }
  if (room.kind === 'boss') {                         // summoning circle under the throne
    g.save();
    g.shadowColor = '#ff5a1c'; g.shadowBlur = 8 * mapRes;
    for (const [rad, col, lw, dash] of [[116, '#b3262f', 2.2, []], [106, '#e0562a', 1.2, [10, 7]], [66, '#b3262f', 1.8, []], [28, '#f77622', 1.4, [5, 5]]]) {
      g.strokeStyle = col; g.lineWidth = lw; g.setLineDash(dash); g.beginPath(); g.arc(wx, wy, rad, 0, TAU); g.stroke();
    }
    g.setLineDash([]);
    g.strokeStyle = '#e0562a'; g.lineWidth = 1.3;
    g.beginPath();
    for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * TAU * 2 / 5; g[k ? 'lineTo' : 'moveTo'](wx + Math.cos(a) * 66, wy + Math.sin(a) * 66); }
    g.closePath(); g.stroke();
    for (let k = 0; k < 10; k++) {                    // runes between the rings
      const a = k * TAU / 10 + 0.3, px = wx + Math.cos(a) * 91, py = wy + Math.sin(a) * 91;
      g.strokeStyle = '#ff9a3c'; g.lineWidth = 1.4;
      g.save(); g.translate(px, py); g.rotate(a + Math.PI / 2);
      g.beginPath(); g.moveTo(-3, 4); g.lineTo(0, -4); g.lineTo(3, 4); if (k % 2) { g.moveTo(-2, 1); g.lineTo(2, 1); } else { g.moveTo(0, -4); g.lineTo(0, 4); } g.stroke();
      g.restore();
    }
    g.restore();
  } else if (room.kind === 'start' && room !== dungeon.shopRoom) {
    g.strokeStyle = shade(th.rim, 0.2); g.globalAlpha = 0.55;
    g.lineWidth = 1.6; g.beginPath(); g.arc(wx, wy, 40, 0, TAU); g.stroke();
    g.lineWidth = 1; g.setLineDash([6, 5]); g.beginPath(); g.arc(wx, wy, 33, 0, TAU); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 1;
  }
  if (room.kind === 'boss') return;
  if (game.floor !== 3) for (const side of [0, 1]) {  // cobwebs in the top corners
    if (r() < 0.45) continue;
    const tx = side ? room.x + room.w - 1 : room.x, ty = room.y;
    if (tileAt(tx, ty) !== T_FLOOR || openAt(tx + (side ? 1 : -1), ty) || openAt(tx, ty - 1)) continue;
    const ox = side ? (tx + 1) * TILE : tx * TILE, d = side ? -1 : 1, oy = ty * TILE;
    g.strokeStyle = 'rgba(230,235,250,0.4)'; g.lineWidth = 0.6;
    g.beginPath();
    for (const a of [0, 0.4, 0.8, 1.2, Math.PI / 2]) { g.moveTo(ox, oy); g.lineTo(ox + d * Math.cos(a) * 20, oy + Math.sin(a) * 20); }
    for (const rad of [6, 11, 16]) for (let k = 0; k < 4; k++) {
      const a0 = [0, 0.4, 0.8, 1.2, Math.PI / 2][k], a1 = [0, 0.4, 0.8, 1.2, Math.PI / 2][k + 1], am = (a0 + a1) / 2;
      g.moveTo(ox + d * Math.cos(a0) * rad, oy + Math.sin(a0) * rad);
      g.quadraticCurveTo(ox + d * Math.cos(am) * rad * 0.82, oy + Math.sin(am) * rad * 0.82, ox + d * Math.cos(a1) * rad, oy + Math.sin(a1) * rad);
    }
    g.stroke();
  }
  for (let n = game.floor === 2 ? 0 : 1 + Math.floor(r() * 2); n > 0; n--) {      // skulls left by earlier adventurers
    const tx = room.x + 1 + Math.floor(r() * (room.w - 2)), ty = room.y + (r() < 0.5 ? 0 : room.h - 1);
    if (tileAt(tx, ty) !== T_FLOOR) continue;
    const px = tx * TILE + 10 + r() * 12, py = ty * TILE + 15 + r() * 8;
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(px + 0.8, py + 4.2, 5.2, 2, 0, 0, TAU); g.fill();
    const sk = g.createRadialGradient(px - 1.5, py - 2, 0.5, px, py, 6);
    sk.addColorStop(0, '#fbf3dc'); sk.addColorStop(1, '#b5a27c');
    g.fillStyle = sk; g.beginPath(); g.ellipse(px, py - 0.5, 4.6, 4.1, 0, 0, TAU); g.fill();
    rrect(g, px - 2.6, py + 1.8, 5.2, 3.2, 1); g.fill();
    g.fillStyle = '#17121f'; g.beginPath(); g.ellipse(px - 1.8, py - 0.2, 1.2, 1.4, 0, 0, TAU); g.ellipse(px + 1.8, py - 0.2, 1.2, 1.4, 0, 0, TAU); g.fill();
    g.strokeStyle = '#17121f'; g.lineWidth = 0.5; g.beginPath(); for (const ox of [-1.2, 0, 1.2]) { g.moveTo(px + ox, py + 3); g.lineTo(px + ox, py + 4.8); } g.stroke();
  }
  if (game.floor === 2) for (let n = 2 + Math.floor(r() * 3); n > 0; n--) {       // little mushrooms
    const tx = room.x + Math.floor(r() * room.w), ty = room.y + Math.floor(r() * room.h);
    if (tileAt(tx, ty) !== T_FLOOR || (openAt(tx - 1, ty) && openAt(tx + 1, ty) && openAt(tx, ty - 1))) continue;
    const px = tx * TILE + 8 + r() * 16, py = ty * TILE + 14 + r() * 12, s = 0.8 + r() * 0.6;
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(px + 0.5, py + 3.5 * s, 3 * s, 1.1 * s, 0, 0, TAU); g.fill();
    g.fillStyle = '#eadfc4'; g.fillRect(px - 0.9 * s, py, 1.8 * s, 3.4 * s);
    const cap = g.createRadialGradient(px - s, py - 1.5 * s, 0.3, px, py, 4 * s);
    cap.addColorStop(0, '#ff7a70'); cap.addColorStop(1, '#a3222e');
    g.fillStyle = cap; g.beginPath(); g.ellipse(px, py, 3.6 * s, 2.5 * s, 0, Math.PI, TAU); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(px - 1.2 * s, py - 1.2 * s, 0.55 * s, 0, TAU); g.arc(px + 1.4 * s, py - 0.8 * s, 0.45 * s, 0, TAU); g.fill();
  }
  // Banners between the torches on the top wall.
  for (let tx = room.x + 1; tx < room.x + room.w - 1; tx++) {
    if (!isFaceTile(tx, room.y - 1) || dungeon.torches.some(t => t.tx === tx && t.ty === room.y - 1) || r() > 0.22) continue;
    const x = tx * TILE + 9, y = (room.y - 1) * TILE + 10.5, w = 14, h = 19;
    g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.moveTo(x + 1.5, y + 1); g.lineTo(x + w + 1.5, y + 1); g.lineTo(x + w + 1.5, y + h + 1); g.lineTo(x + w / 2 + 1.5, y + h - 3); g.lineTo(x + 1.5, y + h + 1); g.closePath(); g.fill();
    const cloth = g.createLinearGradient(x, 0, x + w, 0);              // folds in the cloth
    cloth.addColorStop(0, shade(th.banner, 0.18)); cloth.addColorStop(0.3, th.banner); cloth.addColorStop(0.55, shade(th.banner, -0.28));
    cloth.addColorStop(0.75, th.banner); cloth.addColorStop(1, shade(th.banner, -0.4));
    g.fillStyle = cloth; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w, y + h); g.lineTo(x + w / 2, y + h - 4); g.lineTo(x, y + h); g.closePath(); g.fill();
    g.strokeStyle = th.emblem; g.lineWidth = 0.7; g.beginPath(); g.moveTo(x + 1.5, y + 2); g.lineTo(x + 1.5, y + h - 2.5); g.moveTo(x + w - 1.5, y + 2); g.lineTo(x + w - 1.5, y + h - 2.5); g.stroke();
    g.fillStyle = th.emblem; g.beginPath(); g.moveTo(x + w / 2, y + 4); g.lineTo(x + w / 2 + 3.2, y + 8.5); g.lineTo(x + w / 2, y + 13); g.lineTo(x + w / 2 - 3.2, y + 8.5); g.closePath(); g.fill();
    g.fillStyle = fade(g, 0, y - 1.5, 0, y + 1, '#ffe08a', '#a8731f'); rrect(g, x - 2, y - 1.6, w + 4, 2.4, 1.1); g.fill();
    tx++;
  }
}

// A stone column drawn taller than its tile so characters can walk behind it.
function buildPillarArt() {
  const th = theme(), S = 3, c = makeCanvas(TILE * S, 52 * S), g = c.getContext('2d');
  g.scale(S, S);
  const stone = (x, y, w, h, rad) => {
    rrect(g, x, y, w, h, rad);
    const gr = g.createLinearGradient(x, 0, x + w, 0);
    gr.addColorStop(0, th.brickDark); gr.addColorStop(0.28, shade(th.brickLight, 0.15)); gr.addColorStop(0.6, th.brick); gr.addColorStop(1, shade(th.brickDark, -0.45));
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(8,6,14,0.85)'; g.lineWidth = 1; g.stroke();
  };
  stone(2.5, 42, 27, 9.5, 2.5);                       // base
  stone(6.5, 8, 19, 36, 1.5);                         // shaft
  g.fillStyle = 'rgba(0,0,0,0.3)';
  for (const by of [19, 31]) { g.fillRect(7, by, 18, 1); g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(7, by + 1, 18, 0.8); g.fillStyle = 'rgba(0,0,0,0.3)'; }
  g.fillStyle = fade(g, 0, 8, 0, 14, 'rgba(0,0,0,0.45)', 'rgba(0,0,0,0)'); g.fillRect(7, 8.5, 18, 6);
  stone(2.5, 0.5, 27, 9, 2.5);                        // cap
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(4, 1.5, 24, 1.2);
  return c;
}

function reveal(tx, ty) {
  if (!inBounds(tx, ty)) return;
  const i = idx(tx, ty);
  if (dungeon.explored[i]) return;
  dungeon.explored[i] = 1;
  fctx.clearRect(tx, ty, 1, 1);
  if (dungeon.tiles[i] !== T_WALL) return;
  // Clear the fog over the solid rock behind a wall too, so the wall itself is not half-hidden.
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++)
    if (inBounds(tx + ox, ty + oy) && dungeon.rock[idx(tx + ox, ty + oy)]) fctx.clearRect(tx + ox, ty + oy, 1, 1);
}
// Repaints one floor-level tile after it changes (boss gates opening and closing).
function repaintTile(tx, ty) {
  paintFloor(tx, ty);
  paintShadows(tx, ty);
  if (tileAt(tx, ty) === T_GATE) paintGate(tx, ty);
}

function makePattern(canvas, res) {
  const p = actx.createPattern(canvas, 'repeat');
  try { p.setTransform(new DOMMatrix().scale(1 / res)); } catch (err) { /* older browsers just get a coarser grain */ }
  return p;
}

function paintDungeon() {
  const d = dungeon, th = theme();
  artRng = mulberry32(game.seed * 31 + game.floor);
  const res = renderScale > 1.25 ? 2 : 1;             // sharper textures on big or high-density screens
  if (!mapArt || mapRes !== res) { mapRes = res; mapArt = makeCanvas(MAP_W * TILE * res, MAP_H * TILE * res); actx = mapArt.getContext('2d'); }
  actx.setTransform(1, 0, 0, 1, 0, 0);
  actx.clearRect(0, 0, mapArt.width, mapArt.height);
  actx.setTransform(res, 0, 0, res, 0, 0);
  const weave = makeCanvas(4, 4), wg = weave.getContext('2d');
  wg.fillStyle = '#000'; wg.fillRect(0, 0, 2, 2); wg.fillRect(2, 2, 2, 2);
  tex = {
    floor: makePattern(noiseTexture(256 * res, th.floor, 0.85, 0.22, artRng), res),
    top: makePattern(noiseTexture(256 * res, th.wallTop, 0.8, 0.22, artRng), res),
    brick: makePattern(noiseTexture(128 * res, th.brick, 0.55, 0.28, artRng), res),
    weave: makePattern(weave, 2),
  };
  fctx.globalCompositeOperation = 'source-over';
  fctx.fillStyle = '#05040a'; fctx.fillRect(0, 0, MAP_W, MAP_H);
  d.pillars = [];
  d.rock = new Uint8Array(MAP_W * MAP_H);             // solid rock: wall tiles with no floor anywhere near them
  for (let ty = 0; ty < MAP_H; ty++) for (let tx = 0; tx < MAP_W; tx++) if (openAt(tx, ty)) paintFloor(tx, ty);
  for (const room of d.rooms) paintRoomDecor(room);
  for (let ty = 0; ty < MAP_H; ty++) for (let tx = 0; tx < MAP_W; tx++) {
    const t = d.tiles[idx(tx, ty)];
    if (t === T_WALL) {
      let near = false;
      for (let oy = -1; oy <= 1 && !near; oy++) for (let ox = -1; ox <= 1; ox++) if (openAt(tx + ox, ty + oy)) { near = true; break; }
      if (near) paintWall(tx, ty); else d.rock[idx(tx, ty)] = 1;
      continue;
    }
    if (t === T_STAIRS) paintStairs(tx, ty);
    paintShadows(tx, ty);
    if (t === T_PILLAR) {
      d.pillars.push({ tx, ty, y: ty * TILE + TILE - 8 });
      actx.fillStyle = 'rgba(0,0,0,0.4)'; actx.beginPath(); actx.ellipse(tx * TILE + 19, ty * TILE + 27, 16, 6, 0, 0, TAU); actx.fill();
    }
  }
  for (const t of d.torches) {                        // iron brackets; the flames are animated separately
    const x = t.tx * TILE + 16, y = t.ty * TILE, g = actx;
    g.fillStyle = fade(g, x - 1.6, 0, x + 1.6, 0, '#b98054', '#5e3326'); g.fillRect(x - 1.6, y + 17, 3.2, 10);
    g.fillStyle = fade(g, 0, y + 15, 0, y + 19, '#8e9ab3', '#2e3344'); rrect(g, x - 3.6, y + 15, 7.2, 3.6, 1.2); g.fill();
    g.strokeStyle = '#2e3344'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y + 27); g.lineTo(x, y + 29.5); g.stroke();
  }
  pillarArt = buildPillarArt();
}

// Stains the floor where something died or broke. Only ever marks plain floor tiles.
function splat(wx, wy, colors, count, spread) {
  const g = actx;
  g.globalAlpha = 0.55;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, dd = Math.sqrt(Math.random()) * spread;
    const px = wx + Math.cos(a) * dd, py = wy + Math.sin(a) * dd * 0.7, rad = 0.7 + Math.random() * 1.9;
    if (tileAt(Math.floor(px / TILE), Math.floor(py / TILE)) !== T_FLOOR) continue;
    g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
    g.beginPath(); g.ellipse(px, py, rad * 1.3, rad, 0, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
}

// ============================================================
// COLLISION & PATHING
// ============================================================
function collides(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolidTile(tileAt(tx, ty))) return true;
  return false;
}

// Moves along one axis. If a wall corner is only just in the way, slides sideways around it instead.
// `other` is the movement wanted on the other axis: the slide never pushes against it, or the two
// would cancel out and leave you stuck.
function moveAxis(e, dx, dy, r, other) {
  if (!collides(e.x + dx, e.y + dy, r)) { e.x += dx; e.y += dy; return false; }
  const step = Math.min(Math.abs(dx) + Math.abs(dy), CORNER_ASSIST);
  for (const side of [1, -1]) {
    if (other && Math.sign(other) !== side) continue;
    const ox = dx ? 0 : side, oy = dx ? side : 0;
    if (collides(e.x + dx + ox * CORNER_ASSIST, e.y + dy + oy * CORNER_ASSIST, r)) continue;
    if (collides(e.x + ox * step, e.y + oy * step, r)) continue;
    e.x += ox * step; e.y += oy * step;
    return false;
  }
  return true;
}

// Axis-separated move so things slide along walls. Returns true if a wall was hit.
function moveEntity(e, dx, dy) {
  const r = e.cr || e.r;
  if (collides(e.x, e.y, r)) { e.x += dx; e.y += dy; return false; }   // escape hatch: never trap something inside a wall
  let hit = false;
  if (dx && moveAxis(e, dx, 0, r, dy)) hit = true;
  if (dy && moveAxis(e, 0, dy, r, dx)) hit = true;
  return hit;
}

function rayClear(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 8);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (solidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false;
  }
  return true;
}
// Like rayClear, but for something `r` wide.
function pathClear(x0, y0, x1, y1, r) {
  if (!rayClear(x0, y0, x1, y1)) return false;
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, ox = -dy / d * r, oy = dx / d * r;
  return rayClear(x0 + ox, y0 + oy, x1 + ox, y1 + oy) && rayClear(x0 - ox, y0 - oy, x1 - ox, y1 - oy);
}

// Unit vector that walks `e` toward the player: straight if the way is open, else down the flow field.
function chaseVector(e) {
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy);
  if (d < 1) return [0, 0];
  if (pathClear(e.x, e.y, player.x, player.y, (e.cr || e.r) - 1)) return [dx / d, dy / d];
  const tx = Math.floor(e.x / TILE), ty = Math.floor(e.y / TILE);
  let bestD = inBounds(tx, ty) && flow[idx(tx, ty)] >= 0 ? flow[idx(tx, ty)] : 32767, bx = -1, by = -1;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = tx + ox, ny = ty + oy;
    if (isSolidTile(tileAt(nx, ny))) continue;
    if (ox && oy && (isSolidTile(tileAt(tx + ox, ty)) || isSolidTile(tileAt(tx, ty + oy)))) continue;   // no corner cutting
    const f = flow[idx(nx, ny)];
    if (f >= 0 && f < bestD) { bestD = f; bx = nx; by = ny; }
  }
  if (bx < 0) return [dx / d, dy / d];
  const gx = bx * TILE + TILE / 2 - e.x, gy = by * TILE + TILE / 2 - e.y, gl = Math.hypot(gx, gy) || 1;
  return [gx / gl, gy / gl];
}

// ============================================================
// FOG OF WAR
// ============================================================
function castReveal(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (;;) {
    if (!inBounds(x, y)) return;
    const t = dungeon.tiles[idx(x, y)];
    reveal(x, y);
    if (t === T_WALL || t === T_GATE) return;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++)       // light up the walls beside open floor
      if (tileAt(x + ox, y + oy) === T_WALL) reveal(x + ox, y + oy);
    if (x === x1 && y === y1) return;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

function updateFOV(force) {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  if (!force && tx === fovTile.x && ty === fovTile.y) return;
  fovTile.x = tx; fovTile.y = ty;
  flow = bfs(dungeon.tiles, tx, ty);
  const room = roomAt(tx, ty);
  if (room) {
    if (!room.seen) {
      room.seen = true;
      if (room === dungeon.shopRoom) toast('A merchant! Spend your gold here.', '#63c74d');
      for (let y = room.y - 1; y <= room.y + room.h; y++)
        for (let x = room.x - 1; x <= room.x + room.w; x++) reveal(x, y);
    }
    if (!room.awake) wakeRoom(room);
  }
  for (let oy = -FOV_RADIUS; oy <= FOV_RADIUS; oy++)
    for (let ox = -FOV_RADIUS; ox <= FOV_RADIUS; ox++)
      if (ox * ox + oy * oy <= FOV_RADIUS * FOV_RADIUS) castReveal(tx, ty, tx + ox, ty + oy);
  minimapDirty = true;
}

function wakeRoom(room) {
  room.awake = true;
  for (const e of enemies) {
    if (e.room !== room || e.awake || e.type === 'boss') continue;
    e.awake = true;
    e.alert = 0.5;
    if (e.elite) toast('A champion guards this room!', '#fee761');
  }
}

// ============================================================
// EFFECTS
// ============================================================
function burst(x, y, colors, n, speed = 120, life = 0.5, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.6 + Math.random() * 0.6), max: life * 1.2,
      color: Array.isArray(colors) ? colors[Math.floor(Math.random() * colors.length)] : colors, size,
    });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}
function addNumber(x, y, text, color) {
  numbers.push({ x: x + (Math.random() - 0.5) * 12, y, text, color, life: 0.8 });
}
function toast(text, color = '#ffffff') {
  toasts.push({ text, color, life: 3.2 });
  if (toasts.length > 4) toasts.shift();
}
function flash(x, y, r, rgb, life = 0.25) { flashes.push({ x, y, r, rgb, life, max: life }); }
function ghost(name, x, y, flip, life, grow, dash) { ghosts.push({ name, x, y, flip, life, max: life, grow, dash }); }
function shake(amount) { game.shake = Math.max(game.shake, amount); }
function hitstop(seconds) { game.hitstop = Math.max(game.hitstop, seconds); }

// ============================================================
// PLAYER
// ============================================================
function weaponDamage(w) { return Math.round(WEAPONS[w.type].dmg * RARITIES[w.rarity].mult); }
function weaponLabel(w) { return RARITIES[w.rarity].name + ' ' + WEAPONS[w.type].name; }

class Player {
  constructor() {
    this.x = 0; this.y = 0; this.r = PLAYER_RADIUS;
    this.maxHp = PLAYER_MAX_HP; this.hp = this.maxHp; this.hpLag = this.hp;
    this.weapon = { type: 'sword', rarity: 0 };
    this.potions = 1; this.gold = 0; this.kills = 0;
    this.relics = {};
    this.attackCd = 0; this.dashCd = 0; this.dashT = 0; this.dashDx = 0; this.dashDy = 0;
    this.iframes = 0; this.aim = 0; this.facing = 1;
    this.swingT = 0; this.swingDir = 1; this.walk = 0; this.moving = false;
    this.moveX = 0; this.moveY = 0; this.kx = 0; this.ky = 0; this.dustT = 0;
  }
  get speed()  { return PLAYER_SPEED * (1 + 0.12 * (this.relics.boots || 0)); }
  get dmgMul() { return 1 + 0.18 * (this.relics.shard || 0); }
  get cdMul()  { return Math.pow(0.88, this.relics.charm || 0); }
  get armor()  { return Math.pow(0.85, this.relics.shield || 0); }

  update(dt) {
    this.attackCd = Math.max(0, this.attackCd - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.iframes = Math.max(0, this.iframes - dt);
    this.swingT = Math.max(0, this.swingT - dt);
    this.hpLag += (this.hp - this.hpLag) * Math.min(1, dt * 4);

    this.readMove();
    const mx = this.moveX, my = this.moveY;

    if (touch.aimActive) this.aim = Math.atan2(touch.aimY, touch.aimX);
    else if (mouse.active) this.aim = Math.atan2(mouse.y + cam.y - this.y, mouse.x + cam.x - this.x);
    else if (this.moving) this.aim = Math.atan2(my, mx);
    this.facing = Math.cos(this.aim) >= 0 ? 1 : -1;

    if (this.dashT > 0) {
      this.dashT -= dt;
      moveEntity(this, this.dashDx * DASH_SPEED * dt, this.dashDy * DASH_SPEED * dt);
      ghost('player', this.x, this.y - 6, this.facing, 0.22, 0, true);
      for (const pr of props) if (!pr.dead && dist(this.x, this.y, pr.x, pr.y) < this.r + POT_RADIUS + 2) breakPot(pr);
    } else if (this.moving) {
      moveEntity(this, mx * this.speed * dt, my * this.speed * dt);
      this.walk += dt * 11;
      if ((this.dustT -= dt) <= 0) {                  // little puffs of dust at your heels
        this.dustT = 0.19;
        particles.push({ x: this.x - mx * 6, y: this.y + 11, vx: -mx * 18 + (Math.random() - 0.5) * 14, vy: -10, life: 0.34, max: 0.34, color: '#8b9bb4', size: 3 });
      }
    }
    if (this.kx || this.ky) {
      moveEntity(this, this.kx * dt, this.ky * dt);
      const f = Math.exp(-10 * dt);
      this.kx *= f; this.ky *= f;
      if (Math.abs(this.kx) + Math.abs(this.ky) < 4) this.kx = this.ky = 0;
    }
    if ((mouse.down || touch.aimActive) && this.attackCd <= 0) this.attack();
  }

  // Movement input from keyboard + touch stick, as a vector no longer than 1.
  readMove() {
    let mx = touch.moveX, my = touch.moveY;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    this.moving = ml > 0.15;
    this.moveX = mx; this.moveY = my;
  }

  tryDash() {
    if (this.dashCd > 0 || this.dashT > 0) return;
    this.readMove();
    let dx = this.moveX, dy = this.moveY;
    const l = Math.hypot(dx, dy);
    if (l < 0.15) { dx = Math.cos(this.aim); dy = Math.sin(this.aim); } else { dx /= l; dy /= l; }
    this.dashDx = dx; this.dashDy = dy;
    this.dashT = DASH_TIME; this.dashCd = DASH_COOLDOWN;
    sfx.dash();
  }

  attack() {
    const w = WEAPONS[this.weapon.type];
    const dmg = weaponDamage(this.weapon) * this.dmgMul;
    const cos = Math.cos(this.aim), sin = Math.sin(this.aim);
    this.attackCd = w.cd * this.cdMul;
    if (w.kind === 'melee') {
      this.swingT = SWING_TIME; this.swingDir = -this.swingDir;
      slashes.push({ x: this.x, y: this.y, ang: this.aim, arc: w.arc, range: w.range, life: 0.16, color: RARITIES[this.weapon.rarity].color });
      sfx.swing();
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(this.x, this.y, e.x, e.y);
        if (d > w.range + e.r) continue;
        const inArc = Math.abs(angleDiff(Math.atan2(e.y - this.y, e.x - this.x), this.aim)) <= w.arc / 2;
        if (!inArc && d > e.r + this.r + 4) continue;
        if (!rayClear(this.x, this.y, e.x, e.y)) continue;
        damageEnemy(e, dmg, Math.atan2(e.y - this.y, e.x - this.x), w.knock);
      }
      for (const pr of props) {
        const d = dist(this.x, this.y, pr.x, pr.y);
        if (pr.dead || d > w.range + POT_RADIUS) continue;
        if (d < POT_TOUCH || Math.abs(angleDiff(Math.atan2(pr.y - this.y, pr.x - this.x), this.aim)) <= w.arc / 2) breakPot(pr);
      }
      for (const b of bullets) {                        // a good swing bats arrows out of the air (not magic!)
        if (b.dead || !b.isEnemy || b.kind !== 'arrow' || dist(this.x, this.y, b.x, b.y) > w.range + 8) continue;
        if (Math.abs(angleDiff(Math.atan2(b.y - this.y, b.x - this.x), this.aim)) > w.arc / 2 + 0.2) continue;
        b.dead = true;
        burst(b.x, b.y, ['#ffffff', '#fee761'], 5, 90, 0.25, 2);
        sfx.clink();
      }
    } else {
      const isOrb = w.kind === 'orb';
      // Shots start a little in front of you, so smash any pot you are standing right on.
      for (const pr of props) if (!pr.dead && dist(this.x, this.y, pr.x, pr.y) < POT_TOUCH) breakPot(pr);
      bullets.push({
        x: this.x + cos * 16, y: this.y + sin * 16, vx: cos * w.speed, vy: sin * w.speed,
        r: isOrb ? 6 : 4, dmg, knock: w.knock, kind: w.kind, isEnemy: false,
        pierce: w.pierce || 0, aoe: w.aoe || 0, hit: new Set(), life: 1.4, dead: false,
        color: RARITIES[this.weapon.rarity].color,
      });
      if (isOrb) sfx.orb(); else sfx.arrow();
    }
  }

  hurt(dmg, fromX, fromY) {
    if (this.iframes > 0 || this.dashT > 0 || game.state !== 'playing' || game.winTimer > 0) return false;
    dmg = Math.max(1, Math.round(dmg * this.armor * DIFFICULTIES[game.difficulty].dmg));
    this.hp -= dmg;
    this.iframes = PLAYER_IFRAMES;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    this.kx = Math.cos(a) * 260; this.ky = Math.sin(a) * 260;
    shake(8); game.hurtFlash = 0.35; hitstop(HITSTOP_HURT);
    flash(this.x, this.y, 70, '255,70,80');
    sfx.hurt();
    addNumber(this.x, this.y - 22, '-' + dmg, '#ff5566');
    burst(this.x, this.y, ['#e43b44', '#a22633'], 8, 130, 0.4, 3);
    splat(this.x, this.y + 8, ['#a22633', '#733e39'], 7, 14);
    if (this.hp <= 0) { this.hp = 0; die(); }
    return true;
  }
}

function drinkPotion() {
  if (game.state !== 'playing') return;
  if (player.potions <= 0) { toast('No potions left!', '#ff8888'); return; }
  if (player.hp >= player.maxHp) { toast('Already at full health', '#aaaaaa'); return; }
  player.potions--;
  const healed = Math.min(POTION_HEAL, player.maxHp - player.hp);
  player.hp += healed;
  addNumber(player.x, player.y - 22, '+' + Math.round(healed), '#63c74d');
  burst(player.x, player.y, ['#63c74d', '#f4f4f4'], 12, 90, 0.6, 3);
  flash(player.x, player.y, 90, '110,255,120', 0.4);
  sfx.potion();
}

// ============================================================
// ENEMIES
// ============================================================
function createEnemy(type, x, y, floor, room) {
  const s = ENEMY_STATS[type];
  const scaled = type !== 'boss';
  const hp = Math.round(s.hp * (scaled ? 1 + FLOOR_HP_SCALE * (floor - 1) : 1) * DIFFICULTIES[game.difficulty].hp);
  return {
    type, x, y, r: s.r, hp, maxHp: hp,
    speed: s.speed * (scaled ? 1 + FLOOR_SPEED_SCALE * (floor - 1) : 1),
    dmg: Math.round(s.dmg * (scaled ? 1 + FLOOR_DMG_SCALE * (floor - 1) : 1)),
    room, awake: false, dead: false, invuln: false,
    state: type === 'slime' || type === 'mini' ? 'rest' : 'move',
    timer: rand(0.1, 0.6), shootCd: rand(0.7, 1.5), strafeDir: chance(0.5) ? 1 : -1,
    dx: 0, dy: 0, kx: 0, ky: 0, aim: 0, facing: 1,
    flash: 0, alert: 0, anim: Math.random() * 10, seed: Math.random() * 10,
  };
}

function damageEnemy(e, dmg, angle, knock) {
  if (e.dead) return;
  if (e.invuln) { sfx.clink(); burst(e.x, e.y - 8, '#9aa5b1', 3, 70, 0.2, 2); return; }
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg;
  e.flash = 0.12;
  if (!e.awake && e.type !== 'boss') { if (e.room) wakeRoom(e.room); e.awake = true; }
  const k = e.type === 'boss' ? 0 : knock;
  e.kx += Math.cos(angle) * k; e.ky += Math.sin(angle) * k;
  addNumber(e.x, e.y - e.r - 10, String(dmg), '#ffffff');
  burst(e.x, e.y, DEATH_COLORS[e.type], 4, 110, 0.3, 2);
  sfx.hit();
  if (e.hp > 0) return;
  e.hp = 0;
  if (e.type === 'boss') startBossDeath(e); else killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  player.kills++;
  if (player.relics.fang && player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 2 * player.relics.fang);
  burst(e.x, e.y, DEATH_COLORS[e.type], 14, 150, 0.55, 3);
  sfx.kill();
  hitstop(HITSTOP_KILL);
  splat(e.x, e.y + 6, STAIN_COLORS[e.type], e.type === 'mini' ? 8 : 18, e.r + 8);
  const body = e.type === 'mini' ? 'slime' : e.type === 'bat' ? 'batA' : e.type;
  ghost(body, e.x, e.y - 5, e.facing, 0.2, 0.7);       // white silhouette that pops as it dies
  flash(e.x, e.y, 60, '255,255,255', 0.15);
  const g = ENEMY_STATS[e.type].gold;
  for (let i = randInt(g[0], g[1]); i > 0; i--) dropItem('gold', e.x, e.y, { value: 1 });
  if (e.type !== 'mini' && chance(POTION_DROP_CHANCE)) dropItem('potion', e.x, e.y);
  if (e.elite) {                                      // champions always leave a relic behind
    dropItem('relic', e.x, e.y, { relic: pick(RELIC_KEYS) });
    for (let i = 0; i < ELITE_GOLD; i++) dropItem('gold', e.x, e.y, { value: 1 });
    burst(e.x, e.y, ['#fee761', '#f4f4f4'], 24, 220, 0.8, 4);
    toast('Champion slain!', '#fee761');
  }
  if (e.type === 'slime') {                           // big slimes split in two
    for (const side of [-1, 1]) {
      const m = createEnemy('mini', e.x, e.y, game.floor, e.room);
      m.awake = true; m.kx = side * 170; m.ky = (Math.random() - 0.5) * 170; m.timer = 0.4;
      spawnQueue.push(m);
    }
  }
}

function fireEnemyBullet(x, y, angle, speed, dmg, kind) {
  bullets.push({
    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: kind === 'arrow' ? 4 : 6, dmg, kind, isEnemy: true, life: 5, dead: false,
  });
}

function updateSlime(e, dt) {
  e.timer -= dt;
  if (e.state === 'hop') {
    moveEntity(e, e.dx * e.speed * SLIME_HOP_BOOST * dt, e.dy * e.speed * SLIME_HOP_BOOST * dt);
    if (e.timer <= 0) { e.state = 'rest'; e.timer = rand(0.35, 0.6); }
  } else if (e.timer <= 0) {
    const v = chaseVector(e);
    e.dx = v[0]; e.dy = v[1];
    if (v[0]) e.facing = v[0] > 0 ? 1 : -1;
    e.state = 'hop'; e.timer = SLIME_HOP_TIME;
  }
}

function updateBat(e, dt) {
  e.timer -= dt;
  if (e.state === 'flee') {                           // swoop away after a bite
    const d = dist(player.x, player.y, e.x, e.y) || 1;
    moveEntity(e, (e.x - player.x) / d * e.speed * dt, (e.y - player.y) / d * e.speed * dt);
    if (e.timer <= 0) e.state = 'move';
    return;
  }
  const v = chaseVector(e), wob = Math.sin(e.anim * 7 + e.seed) * 0.9;
  const dx = v[0] - v[1] * wob, dy = v[1] + v[0] * wob, l = Math.hypot(dx, dy) || 1;
  moveEntity(e, dx / l * e.speed * dt, dy / l * e.speed * dt);
  if (dx) e.facing = dx > 0 ? 1 : -1;
}

function updateSkeleton(e, dt) {
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
  const los = rayClear(e.x, e.y, player.x, player.y);
  e.aim = Math.atan2(dy, dx);
  e.facing = dx >= 0 ? 1 : -1;
  e.shootCd -= dt;
  if (e.state === 'aim') {
    e.timer -= dt;
    if (e.timer <= 0) {
      fireEnemyBullet(e.x + Math.cos(e.aim) * 12, e.y + Math.sin(e.aim) * 12, e.aim, SKELETON_ARROW_SPEED, e.dmg, 'arrow');
      sfx.shoot();
      e.state = 'move'; e.shootCd = rand(1.5, 2.3);
    }
    return;
  }
  let v, strafing = false;
  if (!los || d > SKELETON_FAR) v = chaseVector(e);
  else if (d < SKELETON_NEAR) v = [-dx / d, -dy / d];
  else { v = [-dy / d * e.strafeDir, dx / d * e.strafeDir]; strafing = true; }
  const hit = moveEntity(e, v[0] * e.speed * dt, v[1] * e.speed * dt);
  if (hit && strafing) e.strafeDir = -e.strafeDir;
  if (los && d < SKELETON_SIGHT && e.shootCd <= 0) { e.state = 'aim'; e.timer = SKELETON_AIM_TIME; }
}

// ---- Boss: The Ember King -------------------------------------------------
function setBoss(e, state, timer) { e.state = state; e.timer = timer; }

function bossPickAttack(e) {
  const pool = ['ring', 'fan', 'charge'];
  if (e.phase2) {
    pool.push('spiral');
    if (enemies.filter(o => !o.dead && o.type === 'bat').length < 3) pool.push('summon');
  }
  let choice = pick(pool);
  if (choice === e.lastAttack) choice = pick(pool);
  // Punish anyone hugging the boss with a ground slam.
  if (e.lastAttack !== 'slam' && dist(e.x, e.y, player.x, player.y) < BOSS_SLAM_RADIUS - 10 && chance(0.65)) choice = 'slam';
  e.lastAttack = choice;
  e.volley = 0;
  if (choice === 'ring') setBoss(e, 'ringTell', 0.6);
  else if (choice === 'fan') setBoss(e, 'fan', 0.45);
  else if (choice === 'charge') setBoss(e, 'chargeTell', 0.8);
  else if (choice === 'slam') setBoss(e, 'slamTell', BOSS_SLAM_TELL);
  else if (choice === 'spiral') { setBoss(e, 'spiral', 2.2); e.shotT = 0.3; }
  else setBoss(e, 'summon', 0.7);
  sfx.tell();
}

function updateBoss(e, dt) {
  if (e.state === 'idle') return;
  e.timer -= dt;
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx);
  if (!e.phase2 && e.hp <= e.maxHp * 0.5 && e.state !== 'dying' && e.state !== 'charge') {
    e.phase2 = true; e.invuln = true;
    setBoss(e, 'roar', 1.3);
    for (const b of bullets) if (b.isEnemy) b.dead = true;
    sfx.roar(); shake(12);
    toast('The Ember King is enraged!', '#ff7744');
    return;
  }
  switch (e.state) {
    case 'intro': if (e.timer <= 0) { e.invuln = false; setBoss(e, 'chase', 1.0); } break;
    case 'roar':  if (e.timer <= 0) { e.invuln = false; setBoss(e, 'chase', 0.6); } break;
    case 'chase': {
      const sp = e.speed * (e.phase2 ? 1.4 : 1);
      if (d > e.r + 30) {
        let vx = dx / d, vy = dy / d;
        if (e.avoidT > 0) { e.avoidT -= dt; vx = e.avoidX; vy = e.avoidY; }
        const ox = e.x, oy = e.y;
        moveEntity(e, vx * sp * dt, vy * sp * dt);
        if (e.avoidT <= 0 && Math.hypot(e.x - ox, e.y - oy) < sp * dt * 0.5) {   // wedged on a pillar: step around it
          const side = chance(0.5) ? 1 : -1;
          e.avoidX = -dy / d * side; e.avoidY = dx / d * side; e.avoidT = BOSS_SIDESTEP_TIME;
        }
      }
      if (e.timer <= 0) bossPickAttack(e);
      break;
    }
    case 'ringTell':
      if (e.timer <= 0) {
        const off = e.volley % 2 ? Math.PI / BOSS_RING_COUNT : 0;
        for (let i = 0; i < BOSS_RING_COUNT; i++)
          fireEnemyBullet(e.x, e.y, off + i * TAU / BOSS_RING_COUNT, BOSS_RING_SPEED, BOSS_BULLET_DMG, 'orb');
        sfx.shoot();
        if (++e.volley < (e.phase2 ? 3 : 2)) e.timer = 0.5; else setBoss(e, 'rest', 0.8);
      }
      break;
    case 'fan':
      if (e.timer <= 0) {
        for (let i = 0; i < BOSS_FAN_COUNT; i++)
          fireEnemyBullet(e.x, e.y, ang + (i - (BOSS_FAN_COUNT - 1) / 2) * BOSS_FAN_SPREAD, BOSS_FAN_SPEED, BOSS_BULLET_DMG, 'orb');
        sfx.shoot();
        if (++e.volley < (e.phase2 ? 4 : 3)) e.timer = 0.38; else setBoss(e, 'rest', 0.8);
      }
      break;
    case 'chargeTell':
      if (e.timer > 0.2) e.dir = ang;                  // locks direction just before lunging
      if (e.timer <= 0) { setBoss(e, 'charge', 0.8); sfx.dash(); }
      break;
    case 'charge': {
      const hit = moveEntity(e, Math.cos(e.dir) * BOSS_CHARGE_SPEED * dt, Math.sin(e.dir) * BOSS_CHARGE_SPEED * dt);
      particles.push({ x: e.x, y: e.y + 10, vx: 0, vy: 0, life: 0.3, max: 0.3, color: '#f77622', size: 8 });
      if (hit) {                                       // slammed into a wall or pillar: stunned!
        shake(11); sfx.slam();
        burst(e.x + Math.cos(e.dir) * 30, e.y + Math.sin(e.dir) * 30, ['#9aa5b1', '#5b6470'], 16, 170, 0.6, 4);
        setBoss(e, 'stun', 1.2);
      } else if (e.timer <= 0) setBoss(e, 'rest', 0.5);
      break;
    }
    case 'slamTell':
      if (e.timer <= 0) {
        shake(12); sfx.slam();
        flash(e.x, e.y, 190, '255,80,60', 0.3);
        slashes.push({ x: e.x, y: e.y, ang: 0, arc: TAU, range: BOSS_SLAM_RADIUS, life: 0.22, color: '#e43b44', ring: true });
        burst(e.x, e.y + 20, ['#e43b44', '#f77622', '#5b6470'], 26, 260, 0.5, 4);
        if (d < BOSS_SLAM_RADIUS + player.r - 4) player.hurt(BOSS_SLAM_DMG, e.x, e.y);
        setBoss(e, 'rest', 0.7);
      }
      break;
    case 'spiral':
      e.spin += dt * 2.4;
      e.shotT -= dt;
      while (e.shotT <= 0) {
        e.shotT += 0.1;
        for (let k = 0; k < 3; k++) fireEnemyBullet(e.x, e.y, e.spin + k * TAU / 3, BOSS_SPIRAL_SPEED, BOSS_BULLET_DMG, 'orb');
      }
      if (e.timer <= 0) setBoss(e, 'rest', 1.0);
      break;
    case 'summon':
      if (e.timer <= 0) {
        for (const side of [-1, 1]) {
          const bat = createEnemy('bat', e.x, e.y, game.floor, e.room);    // born inside the boss so never inside a wall
          bat.awake = true; bat.alert = 0.4; bat.kx = side * 260;
          spawnQueue.push(bat);
          burst(bat.x, bat.y, DEATH_COLORS.bat, 10, 120, 0.4, 3);
        }
        setBoss(e, 'rest', 0.5);
      }
      break;
    case 'stun': case 'rest':
      if (e.timer <= 0) setBoss(e, 'chase', rand(0.9, 1.5) * (e.phase2 ? 0.7 : 1));
      break;
    case 'dying':
      if (Math.random() < dt * 14) {
        burst(e.x + (Math.random() - 0.5) * 70, e.y + (Math.random() - 0.5) * 70, DEATH_COLORS.boss, 10, 180, 0.6, 4);
        shake(5); sfx.boom();
      }
      if (e.timer <= 0) finishBoss(e);
      break;
  }
}

function sealArena() {
  const room = dungeon.bossRoom;
  room.sealed = true;
  for (let y = room.y - 1; y <= room.y + room.h; y++) for (let x = room.x - 1; x <= room.x + room.w; x++) {
    const onRing = x === room.x - 1 || x === room.x + room.w || y === room.y - 1 || y === room.y + room.h;
    if (onRing && tileAt(x, y) === T_FLOOR) { dungeon.tiles[idx(x, y)] = T_GATE; dungeon.gates.push(idx(x, y)); repaintTile(x, y); }
  }
  const boss = enemies.find(e => e.type === 'boss');
  if (boss) { boss.awake = true; setBoss(boss, 'intro', 1.6); }
  game.banner = { text: BOSS_NAME, sub: 'Lord of the Deep', life: 3, color: '#ff6644' };
  sfx.roar(); sfx.slam(); shake(10);
  updateFOV(true);
}

function startBossDeath(e) {
  e.invuln = true;
  setBoss(e, 'dying', 1.8);
  for (const b of bullets) if (b.isEnemy) b.dead = true;
  for (const o of enemies) if (o !== e && !o.dead && o.awake) killEnemy(o);
}

function finishBoss(e) {
  e.dead = true;
  player.kills++;
  burst(e.x, e.y, DEATH_COLORS.boss, 60, 320, 1.1, 5);
  splat(e.x, e.y + 10, STAIN_COLORS.boss, 160, 70);
  flash(e.x, e.y, 380, '255,210,150', 0.9);
  shake(16); sfx.boom(); sfx.win(); hitstop(HITSTOP_BOSS);
  for (let i = 0; i < ENEMY_STATS.boss.gold[0]; i++) dropItem('gold', e.x, e.y, { value: 2 });
  for (const i of dungeon.gates) { dungeon.tiles[i] = T_FLOOR; repaintTile(i % MAP_W, (i / MAP_W) | 0); }
  dungeon.gates = [];
  updateFOV(true);
  toast('The Ember King is slain!', '#fee761');
  game.winTimer = 3.2;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.alert = Math.max(0, e.alert - dt);
    e.anim += dt;
    if (!e.awake) continue;
    if (e.kx || e.ky) {
      moveEntity(e, e.kx * dt, e.ky * dt);
      const f = Math.exp(-9 * dt);
      e.kx *= f; e.ky *= f;
      if (Math.abs(e.kx) + Math.abs(e.ky) < 4) e.kx = e.ky = 0;
    }
    switch (e.type) {
      case 'slime': case 'mini': updateSlime(e, dt); break;
      case 'bat': updateBat(e, dt); break;
      case 'skeleton': updateSkeleton(e, dt); break;
      case 'boss': updateBoss(e, dt); break;
    }
    if (e.dead || e.state === 'dying' || e.state === 'idle') continue;
    if (dist(e.x, e.y, player.x, player.y) < e.r + player.r - 3) {
      const dmg = e.type === 'boss' && e.state === 'charge' ? BOSS_CHARGE_DMG : e.dmg;
      if (player.hurt(dmg, e.x, e.y) && e.type === 'bat') { e.state = 'flee'; e.timer = BAT_FLEE_TIME; }
    }
  }
  if (spawnQueue.length) { enemies.push(...spawnQueue); spawnQueue = []; }
  // Keep enemies from stacking on top of each other.
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead || !a.awake) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead || !b.awake) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d >= min || d === 0) continue;
      const push = (min - d) / 2, nx = dx / d, ny = dy / d;
      if (a.type !== 'boss') moveEntity(a, -nx * push, -ny * push);
      if (b.type !== 'boss') moveEntity(b, nx * push, ny * push);
    }
  }
}

// ============================================================
// BULLETS
// ============================================================
function breakPot(pr) {
  pr.dead = true;
  burst(pr.x, pr.y, ['#b86f50', '#733e39', '#ead4aa'], 10, 140, 0.45, 3);
  splat(pr.x, pr.y + 4, ['#b86f50', '#733e39'], 10, 14);
  noise(0.1, 0.18, 1400);
  for (let i = randInt(POT_GOLD[0], POT_GOLD[1]); i > 0; i--) dropItem('gold', pr.x, pr.y, { value: 1 });
  if (chance(POT_POTION_CHANCE)) dropItem('potion', pr.x, pr.y);
}

function explodeOrb(b) {
  burst(b.x, b.y, ['#f77622', '#fee761', '#e43b44'], 16, 170, 0.45, 4);
  slashes.push({ x: b.x, y: b.y, ang: 0, arc: TAU, range: b.aoe, life: 0.18, color: '#f77622', ring: true });
  sfx.boom(); shake(2);
  flash(b.x, b.y, 110, '255,150,50', 0.3);
  for (const pr of props) if (!pr.dead && dist(b.x, b.y, pr.x, pr.y) < b.aoe + POT_RADIUS) breakPot(pr);
  for (const e of enemies) {
    if (e.dead || dist(b.x, b.y, e.x, e.y) > b.aoe + e.r) continue;
    damageEnemy(e, b.dmg, Math.atan2(e.y - b.y, e.x - b.x), b.knock);
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (b.dead) continue;
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (solidAt(b.x, b.y)) {
      b.dead = true;
      if (b.kind === 'orb' && !b.isEnemy) explodeOrb(b);
      else burst(b.x - b.vx * dt, b.y - b.vy * dt, b.isEnemy ? '#f77622' : '#c8ccd4', 4, 70, 0.25, 2);
      continue;
    }
    if (b.isEnemy) {
      if (dist(b.x, b.y, player.x, player.y) < b.r + player.r - 2 && player.hurt(b.dmg, b.x - b.vx * 0.05, b.y - b.vy * 0.05)) b.dead = true;
      continue;
    }
    for (const pr of props) {
      if (pr.dead || dist(b.x, b.y, pr.x, pr.y) > b.r + POT_RADIUS) continue;
      breakPot(pr);
      if (b.kind === 'orb') { explodeOrb(b); b.dead = true; }
      break;
    }
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead || b.hit.has(e) || dist(b.x, b.y, e.x, e.y) > b.r + e.r) continue;
      if (b.kind === 'orb') { explodeOrb(b); b.dead = true; break; }
      damageEnemy(e, b.dmg, Math.atan2(b.vy, b.vx), b.knock);
      b.hit.add(e);
      if (b.pierce-- <= 0) { b.dead = true; break; }
    }
  }
}

// ============================================================
// LOOT
// ============================================================
function dropItem(kind, x, y, extra) {
  const a = Math.random() * TAU, s = 80 + Math.random() * 120;
  items.push(Object.assign({ kind, x, y, r: 5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, dead: false, seed: Math.random() * 10 }, extra));
}

function rollWeapon(floor) {
  const odds = RARITY_ODDS[floor - 1];
  const roll = () => {
    const r = rng();
    return { type: pick(WEAPON_KEYS), rarity: r < odds[0] ? 0 : r < odds[0] + odds[1] ? 1 : 2 };
  };
  let w = roll();
  if (w.type === player.weapon.type && w.rarity <= player.weapon.rarity) w = roll();   // fewer duds
  return w;
}

function openChest(c) {
  c.opened = true;
  sfx.chest();
  burst(c.x, c.y - 6, ['#fee761', '#f77622', '#f4f4f4'], 18, 150, 0.6, 3);
  flash(c.x, c.y - 4, 130, '255,220,110', 0.5);
  for (let i = randInt(5, 9); i > 0; i--) dropItem('gold', c.x, c.y, { value: randInt(1, 3) });
  if (c.potion) dropItem('potion', c.x, c.y);
  const kind = c.loot === 'any' ? (chance(0.55) ? 'weapon' : 'relic') : c.loot;
  if (kind === 'weapon') dropItem('weapon', c.x, c.y, { weapon: rollWeapon(game.floor) });
  else dropItem('relic', c.x, c.y, { relic: pick(RELIC_KEYS) });
}

function collectItem(it) {
  switch (it.kind) {
    case 'gold':
      player.gold += it.value; sfx.coin(); break;
    case 'potion':
      if (player.potions >= POTION_MAX) return false;
      player.potions++; sfx.pickup(); toast('Health Potion  (' + (touch.mode ? 'POTION' : 'Q') + ' to drink)', '#ff7788'); break;
    case 'relic': {
      const r = RELICS[it.relic];
      player.relics[it.relic] = (player.relics[it.relic] || 0) + 1;
      if (it.relic === 'heart') { player.maxHp += 25; player.hp += 25; }
      sfx.pickup(); toast(r.name + ' — ' + r.desc, '#fee761');
      burst(it.x, it.y, ['#fee761', '#f4f4f4'], 12, 110, 0.5, 3);
      flash(it.x, it.y, 80, '255,230,120', 0.35);
      break;
    }
    default: return false;                            // weapons are swapped with the Use key
  }
  return true;
}

function updateItems(dt) {
  interact = null;
  let nearestUse = null, nearestD = WEAPON_REACH;
  for (const it of items) {
    if (it.dead) continue;
    it.age += dt;
    if (it.vx || it.vy) {
      moveEntity(it, it.vx * dt, it.vy * dt);
      const f = Math.exp(-6 * dt);
      it.vx *= f; it.vy *= f;
      if (Math.abs(it.vx) + Math.abs(it.vy) < 3) it.vx = it.vy = 0;
    }
    const d = dist(it.x, it.y, player.x, player.y);
    if (it.kind === 'gold' && it.age > 0.4 && d < MAGNET_RADIUS && d > 1) {
      const pull = Math.min(d, 420 * dt);
      moveEntity(it, (player.x - it.x) / d * pull, (player.y - it.y) / d * pull);
    }
    if (it.kind === 'weapon' || it.price) {            // needs the Use key: weapon swaps and shop goods
      if (it.age > 0.3 && d < nearestD) { nearestD = d; nearestUse = it; }
      continue;
    }
    if (it.age > 0.35 && d < PICKUP_RADIUS && collectItem(it)) it.dead = true;
  }
  for (const c of chests)
    if (!c.opened && dist(c.x, c.y, player.x, player.y) < 26) openChest(c);

  if (nearestUse) interact = { type: nearestUse.price ? 'buy' : 'weapon', item: nearestUse };
  else if (tileAt(Math.floor(player.x / TILE), Math.floor(player.y / TILE)) === T_STAIRS) interact = { type: 'stairs' };
}

function useInteract() {
  if (game.state !== 'playing' || !interact) return;
  if (interact.type === 'buy') {
    const it = interact.item;
    if (player.gold < it.price) { toast('Not enough gold!', '#ff8888'); sfx.clink(); return; }
    if (it.kind === 'potion' && player.potions >= POTION_MAX) { toast('Your potion bag is full', '#aaaaaa'); return; }
    player.gold -= it.price;
    it.price = 0;
    sfx.coin();
    burst(it.x, it.y, ['#fee761', '#f77622'], 10, 100, 0.4, 3);
    if (it.kind !== 'weapon') { if (collectItem(it)) it.dead = true; return; }
  }
  if (interact.type === 'weapon' || interact.type === 'buy') {
    const it = interact.item, old = player.weapon;
    player.weapon = it.weapon;
    it.weapon = old; it.age = 0;                      // your old weapon stays on the floor
    player.attackCd = 0.2;
    sfx.pickup();
    toast('Equipped ' + weaponLabel(player.weapon), RARITIES[player.weapon.rarity].color);
  } else if (interact.type === 'stairs') {
    sfx.stairs();
    game.state = 'transition';
    game.transition = { t: 0, phase: 'out', next: game.floor + 1 };
  }
}

// ============================================================
// RUN FLOW
// ============================================================
function newRun() {
  game.seed = urlSeed !== null ? (Number(urlSeed) | 0) : (Math.random() * 0x7fffffff) | 0;
  game.time = 0; game.shake = 0; game.hurtFlash = 0; game.hitstop = 0; game.endT = 0; game.winTimer = 0;
  game.transition = null;
  toasts = [];
  player = new Player();
  enterFloor(1);
  game.state = 'playing';
}

function enterFloor(n) {
  game.floor = n;
  rng = mulberry32(game.seed + n * 7919);
  dungeon = generateFloor(n);
  paintDungeon();
  populateFloor(n);
  player.x = dungeon.start.cx * TILE + TILE / 2;
  player.y = dungeon.start.cy * TILE + TILE / 2;
  player.kx = player.ky = 0; player.dashT = 0;
  cam.x = player.x - VIEW_W / 2; cam.y = player.y - VIEW_H / 2;
  interact = null;
  updateFOV(true);
  game.banner = { text: n === FINAL_FLOOR ? 'Final Floor' : 'Floor ' + n, sub: THEMES[n - 1].name, life: 3, color: '#ffffff' };
}

function die() {
  game.state = 'dead'; game.endT = 0;
  burst(player.x, player.y, ['#3a86ff', '#9aa5b1', '#e43b44'], 30, 200, 0.9, 4);
  sfx.lose();
  best.bestGold = Math.max(best.bestGold, player.gold);
  saveBest();
}

function win() {
  game.state = 'win'; game.endT = 0;
  best.wins++;
  best.bestGold = Math.max(best.bestGold, player.gold);
  const d = game.difficulty;
  if (!best.times[d] || game.time < best.times[d]) best.times[d] = game.time;
  saveBest();
}

function togglePause() {
  if (game.state === 'playing') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'playing';
}

function primaryAction() {
  if (game.state === 'title') newRun();
  else if ((game.state === 'dead' || game.state === 'win') && game.endT > 0.9) newRun();
  else if (game.state === 'paused') togglePause();
}

// ============================================================
// UPDATE
// ============================================================
function updateEffects(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.float) continue;                            // embers and dust just drift
    const f = Math.exp(-4 * dt);
    p.vx *= f; p.vy *= f;
  }
  for (const gh of ghosts) gh.life -= dt;
  for (const fl of flashes) fl.life -= dt;
  ghosts = ghosts.filter(gh => gh.life > 0);
  flashes = flashes.filter(fl => fl.life > 0);
  for (const n of numbers) { n.life -= dt; n.y -= 38 * dt; }
  for (const s of slashes) s.life -= dt;
  for (const t of toasts) t.life -= dt;
  particles = particles.filter(p => p.life > 0);
  numbers = numbers.filter(n => n.life > 0);
  slashes = slashes.filter(s => s.life > 0);
  toasts = toasts.filter(t => t.life > 0);
  game.shake = Math.max(0, game.shake - dt * 30);
  game.hurtFlash = Math.max(0, game.hurtFlash - dt);
  if (game.banner && (game.banner.life -= dt) <= 0) game.banner = null;
}

function update(dt) {
  game.anim += dt;
  if (game.state === 'title' || game.state === 'paused') return;
  if (game.state === 'transition') {
    const tr = game.transition;
    tr.t += dt;
    if (tr.phase === 'out' && tr.t >= 0.5) { enterFloor(tr.next); tr.phase = 'in'; tr.t = 0; }
    else if (tr.phase === 'in' && tr.t >= 0.5) { game.transition = null; game.state = 'playing'; }
    return;
  }
  if (game.state === 'dead' || game.state === 'win') {
    game.endT += dt;
    player.hpLag += (player.hp - player.hpLag) * Math.min(1, dt * 4);
    updateEffects(dt);
    return;
  }

  if (game.hitstop > 0) { game.hitstop -= dt; return; }
  game.time += dt;
  player.update(dt);
  updateFOV(false);
  const br = dungeon.bossRoom;
  if (br && !br.sealed) {
    const tx = player.x / TILE, ty = player.y / TILE;
    if (tx > br.x + 1.2 && tx < br.x + br.w - 1.2 && ty > br.y + 1.2 && ty < br.y + br.h - 1.2) sealArena();
  }
  updateEnemies(dt);
  updateBullets(dt);
  updateItems(dt);
  updateEffects(dt);
  enemies = enemies.filter(e => !e.dead);
  bullets = bullets.filter(b => !b.dead);
  items = items.filter(it => !it.dead);
  props = props.filter(pr => !pr.dead);

  // Camera leans a little toward where you are aiming.
  const lookX = mouse.active ? (mouse.x - VIEW_W / 2) * 0.12 : 0, lookY = mouse.active ? (mouse.y - VIEW_H / 2) * 0.12 : 0;
  const k = Math.min(1, dt * 10);
  cam.x += (player.x + lookX - VIEW_W / 2 - cam.x) * k;
  cam.y += (player.y + lookY - VIEW_H / 2 - cam.y) * k;

  if (game.winTimer > 0 && game.state === 'playing' && (game.winTimer -= dt) <= 0) win();
}

// ============================================================
// RENDER — WORLD
// ============================================================
function drawTiles(g, cx, cy) {
  const sx = Math.max(0, cx), sy = Math.max(0, cy), ex = Math.min(MAP_W * TILE, cx + VIEW_W), ey = Math.min(MAP_H * TILE, cy + VIEW_H);
  if (ex > sx && ey > sy) g.drawImage(mapArt, sx * mapRes, sy * mapRes, (ex - sx) * mapRes, (ey - sy) * mapRes, sx, sy, ex - sx, ey - sy);
}

function drawTorches(g) {
  for (const t of dungeon.torches) {
    if (!dungeon.explored[idx(t.tx, t.ty)]) continue;
    drawSprite(g, 'flame' + Math.floor(game.anim * 9 + t.seed) % 3, t.x, t.y - 4);
    if (game.state === 'playing' && Math.random() < 0.07 && Math.abs(t.x - player.x) < 460 && Math.abs(t.y - player.y) < 360)
      particles.push({ x: t.x + (Math.random() - 0.5) * 6, y: t.y - 10, vx: (Math.random() - 0.5) * 12, vy: -22 - Math.random() * 22,
        life: 0.8, max: 0.8, color: Math.random() < 0.5 ? '#feae34' : '#f77622', size: 2, float: true });
  }
}

function drawShadow(g, x, y, w) {
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.beginPath(); g.ellipse(x, y, w, w * 0.4, 0, 0, TAU); g.fill();
}

function drawItem(g, it) {
  const bob = Math.sin(game.anim * 4 + it.seed) * 2;
  if (it.price) {                                     // shop goods sit on a little stone stand
    rrect(g, it.x - 14, it.y + 5, 28, 10, 2.6); paint(g, lin(g, 0, it.y + 5, 0, it.y + 15, '#aab4c8', '#687390', '#3d4459'), 1.1);
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(it.x - 11.5, it.y + 6.4, 23, 1);
  }
  drawShadow(g, it.x, it.y + 8, it.kind === 'gold' ? 5 : 9);
  if (it.kind === 'gold') { drawSprite(g, 'coin', it.x, it.y + bob * 0.5); return; }
  drawSprite(g, it.kind === 'weapon' ? WEAPONS[it.weapon.type].icon : it.kind === 'relic' ? it.relic : 'potion', it.x, it.y - 2 + bob);
}

function drawHeldWeapon(g, p) {
  const w = WEAPONS[p.weapon.type], col = RARITIES[p.weapon.rarity].color;
  g.save();
  g.translate(p.x, p.y + 2);
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (w.kind === 'melee') {
    const k = p.swingT > 0 ? 1 - p.swingT / SWING_TIME : 1;
    g.rotate(p.aim + (k - 0.5) * w.arc * p.swingDir * (p.swingT > 0 ? 1 : 0.6));
    rrect(g, 5, -1.7, 7.5, 3.4, 1.3); paint(g, '#8a5a3c', 1);
    poly(g, [[14, -2.7], [33, -2.7], [38.5, 0], [33, 2.7], [14, 2.7]]); paint(g, lin(g, 0, -3, 0, 3, '#ffffff', '#c9d2e2', '#7c88a6'), 1.1);
    g.strokeStyle = col; g.lineWidth = 1; g.beginPath(); g.moveTo(15.5, 0); g.lineTo(33, 0); g.stroke();
    rrect(g, 11, -6.2, 3.2, 12.4, 1.3); paint(g, lin(g, 0, -6, 0, 6, '#fff0a0', '#d99a22'), 1);
  } else if (w.kind === 'arrow') {
    g.rotate(p.aim);
    const pull = p.attackCd > 0 ? 0 : 5;
    g.strokeStyle = '#eef2f8'; g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(13.3, -11.9); g.lineTo(13.3 - pull, 0); g.lineTo(13.3, 11.9); g.stroke();
    g.beginPath(); g.arc(8, 0, 13, -1.15, 1.15);
    g.strokeStyle = INK; g.lineWidth = 4.6; g.stroke();
    g.strokeStyle = '#c08a5a'; g.lineWidth = 2.8; g.stroke();
    g.strokeStyle = col; g.lineWidth = 1; g.stroke();
  } else {
    g.rotate(p.aim);
    g.beginPath(); g.moveTo(3, 0); g.lineTo(26, 0);
    g.strokeStyle = INK; g.lineWidth = 4.6; g.stroke();
    g.strokeStyle = '#b98054'; g.lineWidth = 2.6; g.stroke();
    const pulse = 4.6 + Math.sin(game.anim * 10) * 0.6;
    oval(g, 28, 0, 6.2, 6.2); paint(g, col, 1.1);
    oval(g, 28, 0, pulse, pulse); g.fillStyle = radial(g, 27, -1, 6, '#fffbd0', '#ffc23a', '#f0661a'); g.fill();
  }
  g.restore();
}

function drawPlayer(g) {
  const p = player;
  if (game.state === 'dead') return;
  drawShadow(g, p.x, p.y + 12, 11);
  const blink = p.iframes > 0 && Math.floor(game.anim * 20) % 2 === 0;
  const bob = p.moving ? Math.abs(Math.sin(p.walk)) * 3 : 0;
  const behind = Math.sin(p.aim) < -0.3;
  g.globalAlpha = blink ? 0.4 : 1;
  if (behind) drawHeldWeapon(g, p);
  drawSprite(g, p.moving && Math.floor(p.walk / 1.7) % 2 ? 'playerWalk' : 'player', p.x, p.y - 6 - bob, p.facing, false, p.dashT > 0 ? 1.15 : 1, p.dashT > 0 ? 0.9 : 1);
  if (!behind) drawHeldWeapon(g, p);
  g.globalAlpha = 1;
}

function drawEnemy(g, e) {
  const flash = e.flash > 0, es = e.elite ? ELITE_SCALE : 1;
  switch (e.type) {
    case 'slime': case 'mini': {
      const s = e.type === 'mini' ? 0.62 : es;
      let sx = 1 + 0.06 * Math.sin(e.anim * 5), sy = 1 - 0.06 * Math.sin(e.anim * 5), lift = 0;
      if (e.state === 'hop' && e.awake) {
        const k = 1 - clamp(e.timer / SLIME_HOP_TIME, 0, 1);
        lift = Math.sin(k * Math.PI) * 9; sx = 0.9; sy = 1.14;
      }
      drawShadow(g, e.x, e.y + e.r - 2, e.r);
      drawSprite(g, 'slime', e.x, e.y - 4 * s - lift, e.facing, flash, sx * s, sy * s);
      break;
    }
    case 'bat':
      drawShadow(g, e.x, e.y + 12, 7);
      drawSprite(g, e.awake && Math.floor(e.anim * 9) % 2 ? 'batB' : 'batA', e.x, e.y - 8 + Math.sin(e.anim * 6) * 2, e.facing, flash, es, es);
      break;
    case 'skeleton': {
      drawShadow(g, e.x, e.y + 13, 10);
      drawSprite(g, e.awake && e.state === 'move' && Math.floor(e.anim * 6) % 2 ? 'skeletonWalk' : 'skeleton', e.x, e.y - 5 * es, e.facing, flash, es, es);
      g.save();
      g.translate(Math.round(e.x), Math.round(e.y)); g.rotate(e.aim);
      g.strokeStyle = '#1a1423'; g.lineWidth = 4; g.beginPath(); g.arc(6, 0, 11, -1.1, 1.1); g.stroke();
      g.strokeStyle = e.state === 'aim' ? '#f77622' : '#b86f50'; g.lineWidth = 2; g.beginPath(); g.arc(6, 0, 11, -1.1, 1.1); g.stroke();
      g.restore();
      break;
    }
    case 'boss': {
      drawShadow(g, e.x, e.y + 34, 38);
      let ox = 0, oy = 0;
      if (e.state === 'ringTell' || e.state === 'chargeTell' || e.state === 'slamTell' || e.state === 'roar' || e.state === 'dying') {
        ox = (Math.random() - 0.5) * 5; oy = (Math.random() - 0.5) * 5;
      }
      if (game.state === 'playing' && e.state !== 'dying' && Math.random() < (e.phase2 ? 0.5 : 0.2))      // crown of fire
        particles.push({ x: e.x + (Math.random() - 0.5) * 30, y: e.y - 52, vx: (Math.random() - 0.5) * 16, vy: -30 - Math.random() * 30,
          life: 0.6, max: 0.6, color: Math.random() < 0.5 ? '#feae34' : '#f77622', size: 3, float: true });
      const dim = e.state === 'stun';
      drawSprite(g, 'boss', e.x + ox, e.y - 14 + oy + Math.sin(e.anim * 2.5) * 3, 1,
        flash || (e.state === 'dying' && Math.floor(game.anim * 16) % 2 === 0), 1, dim ? 0.92 : 1);
      if (dim) {                                       // dizzy stars
        for (let k = 0; k < 3; k++) {
          const a = game.anim * 5 + k * TAU / 3;
          oval(g, e.x + Math.cos(a) * 28, e.y - 58 + Math.sin(a) * 6, 2.8, 2.8); paint(g, '#fee761', 1);
        }
      }
      break;
    }
  }
  if (e.alert > 0 || (e.type === 'skeleton' && e.state === 'aim')) {
    g.font = 'bold 18px "Courier New", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#1a1423'; g.fillText('!', e.x + 1, e.y - e.r - 21);
    g.fillStyle = e.alert > 0 ? '#fee761' : '#ff5544'; g.fillText('!', e.x, e.y - e.r - 22);
  }
  if (e.elite) {                                      // little crown
    const cy = e.y - e.r - 22, cx = e.x;
    poly(g, [[cx - 7, cy + 5], [cx - 7.5, cy - 2], [cx - 3.6, cy + 1.6], [cx, cy - 4], [cx + 3.6, cy + 1.6], [cx + 7.5, cy - 2], [cx + 7, cy + 5]]);
    paint(g, lin(g, 0, cy - 4, 0, cy + 5, '#fff3a8', '#f2b830', '#b87a16'), 1.1);
  }
  if (e.type !== 'boss' && (e.hp < e.maxHp || (e.elite && e.awake))) {
    const w = e.elite ? 40 : 26, hx = Math.round(e.x - w / 2), hy = Math.round(e.y - e.r - 14);
    g.fillStyle = '#1a1423'; g.fillRect(hx - 1, hy - 1, w + 2, 5);
    g.fillStyle = '#e43b44'; g.fillRect(hx, hy, Math.ceil(w * e.hp / e.maxHp), 3);
  }
}

function drawBossTelegraph(g, e) {
  if (e.state === 'chargeTell') {
    const a = 0.15 + 0.2 * (1 - clamp(e.timer / 0.8, 0, 1));
    g.save();
    let len = 0;                                      // the warning lane stops at the first wall
    while (len < 460 && !solidAt(e.x + Math.cos(e.dir) * (len + 8), e.y + Math.sin(e.dir) * (len + 8))) len += 8;
    g.translate(e.x, e.y); g.rotate(e.dir);
    g.fillStyle = `rgba(228,59,68,${a})`; g.fillRect(0, -26, len, 52);
    g.restore();
  } else if (e.state === 'slamTell') {
    const k = 1 - clamp(e.timer / BOSS_SLAM_TELL, 0, 1);
    g.fillStyle = 'rgba(228,59,68,0.16)';
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS, 0, TAU); g.fill();
    g.fillStyle = 'rgba(228,59,68,0.3)';
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS * k, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,120,100,0.8)'; g.lineWidth = 2;
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS, 0, TAU); g.stroke();
  } else if (e.state === 'ringTell' && e.volley === 0) {
    g.strokeStyle = `rgba(247,118,34,${0.5})`; g.lineWidth = 3;
    g.beginPath(); g.arc(e.x, e.y, 40 + (0.6 - e.timer) * 70, 0, TAU); g.stroke();
  }
}

function drawBullet(g, b) {
  if (b.kind === 'arrow') {
    g.save();
    g.translate(b.x, b.y); g.rotate(Math.atan2(b.vy, b.vx));

    const r = 130 + Math.sin(game.anim * 11 + t.seed) * 7;

    const pulse = 0.75 + 0.25 * Math.sin(game.anim * 5 + it.seed);
    if (it.kind === 'weapon') glows.push(it.x, it.y, 34, RARITIES[it.weapon.rarity].rgb, 0.5 * pulse);
    else if (it.kind === 'relic') glows.push(it.x, it.y, 32, '255,225,110', 0.5 * pulse);
    else if (it.kind === 'potion') glows.push(it.x, it.y, 24, '255,80,90', 0.3 * pulse);

    const r = punches[i + 2];

  const tx0 = Math.max(0, Math.floor(cx / TILE) - 1), ty0 = Math.max(0, Math.floor(cy / TILE) - 1);
  const tx1 = Math.min(MAP_W, Math.ceil((cx + VIEW_W) / TILE) + 1), ty1 = Math.min(MAP_H, Math.ceil((cy + VIEW_H) / TILE) + 1);
  if (tx1 > tx0 && ty1 > ty0)
    lctx.drawImage(fogMask, tx0, ty0, tx1 - tx0, ty1 - ty0, tx0 * TILE - cx, ty0 * TILE - cy, (tx1 - tx0) * TILE, (ty1 - ty0) * TILE);
  lctx.drawImage(vignette, 0, 0);

  g.globalCompositeOperation = 'lighter';             // coloured glow on top of the darkness
  for (let i = 0; i < glows.length; i += 5) {

    g.globalAlpha = glows[i + 4];

    m.y += th.moteVy * m.k / 60;
    if (m.x < -4) m.x += VIEW_W + 8; else if (m.x > VIEW_W + 4) m.x -= VIEW_W + 8;
    if (m.y < -4) m.y += VIEW_H + 8; else if (m.y > VIEW_H + 4) m.y -= VIEW_H + 8;

function drawWorld(g) {

function drawMinimap(g) {
