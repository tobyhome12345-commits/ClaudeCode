// ============================================================
// COLLISION & PATHING
// ============================================================
function collides(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolidTile(tileAt(tx, ty))) return true;
  return false;
}

// Moves along one axis. If a wall corner is only just in the way, slides sideways around it instead.
function moveAxis(e, dx, dy, r) {
  if (!collides(e.x + dx, e.y + dy, r)) { e.x += dx; e.y += dy; return false; }
  const step = Math.min(Math.abs(dx) + Math.abs(dy), CORNER_ASSIST);
  for (const side of [1, -1]) {
    const ox = dx ? 0 : side, oy = dx ? side : 0;
    if (collides(e.x + dx + ox * CORNER_ASSIST, e.y + dy + oy * CORNER_ASSIST, r)) continue;
    if (collides(e.x + ox * step, e.y + oy * step, r)) continue;
    e.x += ox * step; e.y += oy * step;
    return false;
  }
  return true;
}

// Axis-separated move so things slide along walls. Returns true if a wall was hit.
function moveEntity(e, dx, dy) {
  const r = e.cr || e.r;
  if (collides(e.x, e.y, r)) { e.x += dx; e.y += dy; return false; }   // escape hatch: never trap something inside a wall
  let hit = false;
  if (dx && moveAxis(e, dx, 0, r)) hit = true;
  if (dy && moveAxis(e, 0, dy, r)) hit = true;
  return hit;
}

function rayClear(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 8);
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (solidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false;
  }
  return true;
}
// Like rayClear, but for something `r` wide.
function pathClear(x0, y0, x1, y1, r) {
  if (!rayClear(x0, y0, x1, y1)) return false;
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, ox = -dy / d * r, oy = dx / d * r;
  return rayClear(x0 + ox, y0 + oy, x1 + ox, y1 + oy) && rayClear(x0 - ox, y0 - oy, x1 - ox, y1 - oy);
}

// Unit vector that walks `e` toward the player: straight if the way is open, else down the flow field.
function chaseVector(e) {
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy);
  if (d < 1) return [0, 0];
  if (pathClear(e.x, e.y, player.x, player.y, (e.cr || e.r) - 1)) return [dx / d, dy / d];
  const tx = Math.floor(e.x / TILE), ty = Math.floor(e.y / TILE);
  let bestD = inBounds(tx, ty) && flow[idx(tx, ty)] >= 0 ? flow[idx(tx, ty)] : 32767, bx = -1, by = -1;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = tx + ox, ny = ty + oy;
    if (isSolidTile(tileAt(nx, ny))) continue;
    if (ox && oy && (isSolidTile(tileAt(tx + ox, ty)) || isSolidTile(tileAt(tx, ty + oy)))) continue;   // no corner cutting
    const f = flow[idx(nx, ny)];
    if (f >= 0 && f < bestD) { bestD = f; bx = nx; by = ny; }
  }
  if (bx < 0) return [dx / d, dy / d];
  const gx = bx * TILE + TILE / 2 - e.x, gy = by * TILE + TILE / 2 - e.y, gl = Math.hypot(gx, gy) || 1;
  return [gx / gl, gy / gl];
}

// ============================================================
// FOG OF WAR
// ============================================================
function castReveal(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (;;) {
    if (!inBounds(x, y)) return;
    const t = dungeon.tiles[idx(x, y)];
    reveal(x, y);
    if (t === T_WALL || t === T_GATE) return;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++)       // light up the walls beside open floor
      if (tileAt(x + ox, y + oy) === T_WALL) reveal(x + ox, y + oy);
    if (x === x1 && y === y1) return;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
}

function updateFOV(force) {
  const tx = Math.floor(player.x / TILE), ty = Math.floor(player.y / TILE);
  if (!force && tx === fovTile.x && ty === fovTile.y) return;
  fovTile.x = tx; fovTile.y = ty;
  flow = bfs(dungeon.tiles, tx, ty);
  const room = roomAt(tx, ty);
  if (room) {
    if (!room.seen) {
      room.seen = true;
      if (room === dungeon.shopRoom) toast('A merchant! Spend your gold here.', '#63c74d');
      for (let y = room.y - 1; y <= room.y + room.h; y++)
        for (let x = room.x - 1; x <= room.x + room.w; x++) reveal(x, y);
    }
    if (!room.awake) wakeRoom(room);
  }
  for (let oy = -FOV_RADIUS; oy <= FOV_RADIUS; oy++)
    for (let ox = -FOV_RADIUS; ox <= FOV_RADIUS; ox++)
      if (ox * ox + oy * oy <= FOV_RADIUS * FOV_RADIUS) castReveal(tx, ty, tx + ox, ty + oy);
  minimapDirty = true;
}

function wakeRoom(room) {
  room.awake = true;
  for (const e of enemies) {
    if (e.room !== room || e.awake || e.type === 'boss') continue;
    e.awake = true;
    e.alert = 0.5;
    if (e.elite) toast('A champion guards this room!', '#fee761');
  }
}

// ============================================================
// EFFECTS
// ============================================================
function burst(x, y, colors, n, speed = 120, life = 0.5, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.6 + Math.random() * 0.6), max: life * 1.2,
      color: Array.isArray(colors) ? colors[Math.floor(Math.random() * colors.length)] : colors, size,
    });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}
function addNumber(x, y, text, color) {
  numbers.push({ x: x + (Math.random() - 0.5) * 12, y, text, color, life: 0.8 });
}
function toast(text, color = '#ffffff') {
  toasts.push({ text, color, life: 3.2 });
  if (toasts.length > 4) toasts.shift();
}
function shake(amount) { game.shake = Math.max(game.shake, amount); }
function hitstop(seconds) { game.hitstop = Math.max(game.hitstop, seconds); }

// ============================================================
// PLAYER
// ============================================================
function weaponDamage(w) { return Math.round(WEAPONS[w.type].dmg * RARITIES[w.rarity].mult); }
function weaponLabel(w) { return RARITIES[w.rarity].name + ' ' + WEAPONS[w.type].name; }

class Player {
  constructor() {
    this.x = 0; this.y = 0; this.r = PLAYER_RADIUS;
    this.maxHp = PLAYER_MAX_HP; this.hp = this.maxHp; this.hpLag = this.hp;
    this.weapon = { type: 'sword', rarity: 0 };
    this.potions = 1; this.gold = 0; this.kills = 0;
    this.relics = {};
    this.attackCd = 0; this.dashCd = 0; this.dashT = 0; this.dashDx = 0; this.dashDy = 0;
    this.iframes = 0; this.aim = 0; this.facing = 1;
    this.swingT = 0; this.swingDir = 1; this.walk = 0; this.moving = false;
    this.moveX = 0; this.moveY = 0; this.kx = 0; this.ky = 0;
  }
  get speed()  { return PLAYER_SPEED * (1 + 0.12 * (this.relics.boots || 0)); }
  get dmgMul() { return 1 + 0.18 * (this.relics.shard || 0); }
  get cdMul()  { return Math.pow(0.88, this.relics.charm || 0); }
  get armor()  { return Math.pow(0.85, this.relics.shield || 0); }

  update(dt) {
    this.attackCd = Math.max(0, this.attackCd - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.iframes = Math.max(0, this.iframes - dt);
    this.swingT = Math.max(0, this.swingT - dt);
    this.hpLag += (this.hp - this.hpLag) * Math.min(1, dt * 4);

    this.readMove();
    const mx = this.moveX, my = this.moveY;

    if (touch.aimActive) this.aim = Math.atan2(touch.aimY, touch.aimX);
    else if (mouse.active) this.aim = Math.atan2(mouse.y + cam.y - this.y, mouse.x + cam.x - this.x);
    else if (this.moving) this.aim = Math.atan2(my, mx);
    this.facing = Math.cos(this.aim) >= 0 ? 1 : -1;

    if (this.dashT > 0) {
      this.dashT -= dt;
      moveEntity(this, this.dashDx * DASH_SPEED * dt, this.dashDy * DASH_SPEED * dt);
      particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: '#2ce8f5', size: 5 });
      for (const pr of props) if (!pr.dead && dist(this.x, this.y, pr.x, pr.y) < this.r + POT_RADIUS + 2) breakPot(pr);
    } else if (this.moving) {
      moveEntity(this, mx * this.speed * dt, my * this.speed * dt);
      this.walk += dt * 11;
    }
    if (this.kx || this.ky) {
      moveEntity(this, this.kx * dt, this.ky * dt);
      const f = Math.exp(-10 * dt);
      this.kx *= f; this.ky *= f;
      if (Math.abs(this.kx) + Math.abs(this.ky) < 4) this.kx = this.ky = 0;
    }
    if ((mouse.down || touch.aimActive) && this.attackCd <= 0) this.attack();
  }

  // Movement input from keyboard + touch stick, as a vector no longer than 1.
  readMove() {
    let mx = touch.moveX, my = touch.moveY;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1;
    if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (keys.KeyW || keys.ArrowUp) my -= 1;
    if (keys.KeyS || keys.ArrowDown) my += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    this.moving = ml > 0.15;
    this.moveX = mx; this.moveY = my;
  }

  tryDash() {
    if (this.dashCd > 0 || this.dashT > 0) return;
    this.readMove();
    let dx = this.moveX, dy = this.moveY;
    const l = Math.hypot(dx, dy);
    if (l < 0.15) { dx = Math.cos(this.aim); dy = Math.sin(this.aim); } else { dx /= l; dy /= l; }
    this.dashDx = dx; this.dashDy = dy;
    this.dashT = DASH_TIME; this.dashCd = DASH_COOLDOWN;
    sfx.dash();
  }

  attack() {
    const w = WEAPONS[this.weapon.type];
    const dmg = weaponDamage(this.weapon) * this.dmgMul;
    const cos = Math.cos(this.aim), sin = Math.sin(this.aim);
    this.attackCd = w.cd * this.cdMul;
    if (w.kind === 'melee') {
      this.swingT = SWING_TIME; this.swingDir = -this.swingDir;
      slashes.push({ x: this.x, y: this.y, ang: this.aim, arc: w.arc, range: w.range, life: 0.16, color: RARITIES[this.weapon.rarity].color });
      sfx.swing();
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(this.x, this.y, e.x, e.y);
        if (d > w.range + e.r) continue;
        const inArc = Math.abs(angleDiff(Math.atan2(e.y - this.y, e.x - this.x), this.aim)) <= w.arc / 2;
        if (!inArc && d > e.r + this.r + 4) continue;
        if (!rayClear(this.x, this.y, e.x, e.y)) continue;
        damageEnemy(e, dmg, Math.atan2(e.y - this.y, e.x - this.x), w.knock);
      }
      for (const pr of props) {
        const d = dist(this.x, this.y, pr.x, pr.y);
        if (pr.dead || d > w.range + POT_RADIUS) continue;
        if (d < POT_TOUCH || Math.abs(angleDiff(Math.atan2(pr.y - this.y, pr.x - this.x), this.aim)) <= w.arc / 2) breakPot(pr);
      }
      for (const b of bullets) {                        // a good swing bats arrows out of the air (not magic!)
        if (b.dead || !b.isEnemy || b.kind !== 'arrow' || dist(this.x, this.y, b.x, b.y) > w.range + 8) continue;
        if (Math.abs(angleDiff(Math.atan2(b.y - this.y, b.x - this.x), this.aim)) > w.arc / 2 + 0.2) continue;
        b.dead = true;
        burst(b.x, b.y, ['#ffffff', '#fee761'], 5, 90, 0.25, 2);
        sfx.clink();
      }
    } else {
      const isOrb = w.kind === 'orb';
      // Shots start a little in front of you, so smash any pot you are standing right on.
      for (const pr of props) if (!pr.dead && dist(this.x, this.y, pr.x, pr.y) < POT_TOUCH) breakPot(pr);
      bullets.push({
        x: this.x + cos * 16, y: this.y + sin * 16, vx: cos * w.speed, vy: sin * w.speed,
        r: isOrb ? 6 : 4, dmg, knock: w.knock, kind: w.kind, isEnemy: false,
        pierce: w.pierce || 0, aoe: w.aoe || 0, hit: new Set(), life: 1.4, dead: false,
        color: RARITIES[this.weapon.rarity].color,
      });
      if (isOrb) sfx.orb(); else sfx.arrow();
    }
  }

  hurt(dmg, fromX, fromY) {
    if (this.iframes > 0 || this.dashT > 0 || game.state !== 'playing' || game.winTimer > 0) return false;
    dmg = Math.max(1, Math.round(dmg * this.armor * DIFFICULTIES[game.difficulty].dmg));
    this.hp -= dmg;
    this.iframes = PLAYER_IFRAMES;
    const a = Math.atan2(this.y - fromY, this.x - fromX);
    this.kx = Math.cos(a) * 260; this.ky = Math.sin(a) * 260;
    shake(8); game.hurtFlash = 0.35; hitstop(HITSTOP_HURT);
    sfx.hurt();
    addNumber(this.x, this.y - 22, '-' + dmg, '#ff5566');
    burst(this.x, this.y, ['#e43b44', '#a22633'], 8, 130, 0.4, 3);
    splat(this.x, this.y + 8, ['#a22633', '#733e39'], 7, 14);
    if (this.hp <= 0) { this.hp = 0; die(); }
    return true;
  }
}

function drinkPotion() {
  if (game.state !== 'playing') return;
  if (player.potions <= 0) { toast('No potions left!', '#ff8888'); return; }
  if (player.hp >= player.maxHp) { toast('Already at full health', '#aaaaaa'); return; }
  player.potions--;
  const healed = Math.min(POTION_HEAL, player.maxHp - player.hp);
  player.hp += healed;
  addNumber(player.x, player.y - 22, '+' + Math.round(healed), '#63c74d');
  burst(player.x, player.y, ['#63c74d', '#f4f4f4'], 12, 90, 0.6, 3);
  sfx.potion();
}

// ============================================================
// ENEMIES
// ============================================================
function createEnemy(type, x, y, floor, room) {
  const s = ENEMY_STATS[type];
  const scaled = type !== 'boss';
  const hp = Math.round(s.hp * (scaled ? 1 + FLOOR_HP_SCALE * (floor - 1) : 1) * DIFFICULTIES[game.difficulty].hp);
  return {
    type, x, y, r: s.r, hp, maxHp: hp,
    speed: s.speed * (scaled ? 1 + FLOOR_SPEED_SCALE * (floor - 1) : 1),
    dmg: Math.round(s.dmg * (scaled ? 1 + FLOOR_DMG_SCALE * (floor - 1) : 1)),
    room, awake: false, dead: false, invuln: false,
    state: type === 'slime' || type === 'mini' ? 'rest' : 'move',
    timer: rand(0.1, 0.6), shootCd: rand(0.7, 1.5), strafeDir: chance(0.5) ? 1 : -1,
    dx: 0, dy: 0, kx: 0, ky: 0, aim: 0, facing: 1,
    flash: 0, alert: 0, anim: Math.random() * 10, seed: Math.random() * 10,
  };
}

function damageEnemy(e, dmg, angle, knock) {
  if (e.dead) return;
  if (e.invuln) { sfx.clink(); burst(e.x, e.y - 8, '#9aa5b1', 3, 70, 0.2, 2); return; }
  dmg = Math.max(1, Math.round(dmg));
  e.hp -= dmg;
  e.flash = 0.12;
  if (!e.awake && e.type !== 'boss') { if (e.room) wakeRoom(e.room); e.awake = true; }
  const k = e.type === 'boss' ? 0 : knock;
  e.kx += Math.cos(angle) * k; e.ky += Math.sin(angle) * k;
  addNumber(e.x, e.y - e.r - 10, String(dmg), '#ffffff');
  burst(e.x, e.y, DEATH_COLORS[e.type], 4, 110, 0.3, 2);
  sfx.hit();
  if (e.hp > 0) return;
  e.hp = 0;
  if (e.type === 'boss') startBossDeath(e); else killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  player.kills++;
  if (player.relics.fang && player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 2 * player.relics.fang);
  burst(e.x, e.y, DEATH_COLORS[e.type], 14, 150, 0.55, 3);
  sfx.kill();
  hitstop(HITSTOP_KILL);
  splat(e.x, e.y + 6, STAIN_COLORS[e.type], e.type === 'mini' ? 8 : 18, e.r + 8);
  const g = ENEMY_STATS[e.type].gold;
  for (let i = randInt(g[0], g[1]); i > 0; i--) dropItem('gold', e.x, e.y, { value: 1 });
  if (e.type !== 'mini' && chance(POTION_DROP_CHANCE)) dropItem('potion', e.x, e.y);
  if (e.elite) {                                      // champions always leave a relic behind
    dropItem('relic', e.x, e.y, { relic: pick(RELIC_KEYS) });
    for (let i = 0; i < ELITE_GOLD; i++) dropItem('gold', e.x, e.y, { value: 1 });
    burst(e.x, e.y, ['#fee761', '#f4f4f4'], 24, 220, 0.8, 4);
    toast('Champion slain!', '#fee761');
  }
  if (e.type === 'slime') {                           // big slimes split in two
    for (const side of [-1, 1]) {
      const m = createEnemy('mini', e.x, e.y, game.floor, e.room);
      m.awake = true; m.kx = side * 170; m.ky = (Math.random() - 0.5) * 170; m.timer = 0.4;
      spawnQueue.push(m);
    }
  }
}

function fireEnemyBullet(x, y, angle, speed, dmg, kind) {
  bullets.push({
    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: kind === 'arrow' ? 4 : 6, dmg, kind, isEnemy: true, life: 5, dead: false,
  });
}

function updateSlime(e, dt) {
  e.timer -= dt;
  if (e.state === 'hop') {
    moveEntity(e, e.dx * e.speed * SLIME_HOP_BOOST * dt, e.dy * e.speed * SLIME_HOP_BOOST * dt);
    if (e.timer <= 0) { e.state = 'rest'; e.timer = rand(0.35, 0.6); }
  } else if (e.timer <= 0) {
    const v = chaseVector(e);
    e.dx = v[0]; e.dy = v[1];
    if (v[0]) e.facing = v[0] > 0 ? 1 : -1;
    e.state = 'hop'; e.timer = SLIME_HOP_TIME;
  }
}

function updateBat(e, dt) {
  e.timer -= dt;
  if (e.state === 'flee') {                           // swoop away after a bite
    const d = dist(player.x, player.y, e.x, e.y) || 1;
    moveEntity(e, (e.x - player.x) / d * e.speed * dt, (e.y - player.y) / d * e.speed * dt);
    if (e.timer <= 0) e.state = 'move';
    return;
  }
  const v = chaseVector(e), wob = Math.sin(e.anim * 7 + e.seed) * 0.9;
  const dx = v[0] - v[1] * wob, dy = v[1] + v[0] * wob, l = Math.hypot(dx, dy) || 1;
  moveEntity(e, dx / l * e.speed * dt, dy / l * e.speed * dt);
  if (dx) e.facing = dx > 0 ? 1 : -1;
}

function updateSkeleton(e, dt) {
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;
  const los = rayClear(e.x, e.y, player.x, player.y);
  e.aim = Math.atan2(dy, dx);
  e.facing = dx >= 0 ? 1 : -1;
  e.shootCd -= dt;
  if (e.state === 'aim') {
    e.timer -= dt;
    if (e.timer <= 0) {
      fireEnemyBullet(e.x + Math.cos(e.aim) * 12, e.y + Math.sin(e.aim) * 12, e.aim, SKELETON_ARROW_SPEED, e.dmg, 'arrow');
      sfx.shoot();
      e.state = 'move'; e.shootCd = rand(1.5, 2.3);
    }
    return;
  }
  let v, strafing = false;
  if (!los || d > SKELETON_FAR) v = chaseVector(e);
  else if (d < SKELETON_NEAR) v = [-dx / d, -dy / d];
  else { v = [-dy / d * e.strafeDir, dx / d * e.strafeDir]; strafing = true; }
  const hit = moveEntity(e, v[0] * e.speed * dt, v[1] * e.speed * dt);
  if (hit && strafing) e.strafeDir = -e.strafeDir;
  if (los && d < SKELETON_SIGHT && e.shootCd <= 0) { e.state = 'aim'; e.timer = SKELETON_AIM_TIME; }
}

// ---- Boss: The Ember King -------------------------------------------------
function setBoss(e, state, timer) { e.state = state; e.timer = timer; }

function bossPickAttack(e) {
  const pool = ['ring', 'fan', 'charge'];
  if (e.phase2) {
    pool.push('spiral');
    if (enemies.filter(o => !o.dead && o.type === 'bat').length < 3) pool.push('summon');
  }
  let choice = pick(pool);
  if (choice === e.lastAttack) choice = pick(pool);
  // Punish anyone hugging the boss with a ground slam.
  if (e.lastAttack !== 'slam' && dist(e.x, e.y, player.x, player.y) < BOSS_SLAM_RADIUS - 10 && chance(0.65)) choice = 'slam';
  e.lastAttack = choice;
  e.volley = 0;
  if (choice === 'ring') setBoss(e, 'ringTell', 0.6);
  else if (choice === 'fan') setBoss(e, 'fan', 0.45);
  else if (choice === 'charge') setBoss(e, 'chargeTell', 0.8);
  else if (choice === 'slam') setBoss(e, 'slamTell', BOSS_SLAM_TELL);
  else if (choice === 'spiral') { setBoss(e, 'spiral', 2.2); e.shotT = 0.3; }
  else setBoss(e, 'summon', 0.7);
  sfx.tell();
}

function updateBoss(e, dt) {
  if (e.state === 'idle') return;
  e.timer -= dt;
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx);
  if (!e.phase2 && e.hp <= e.maxHp * 0.5 && e.state !== 'dying' && e.state !== 'charge') {
    e.phase2 = true; e.invuln = true;
    setBoss(e, 'roar', 1.3);
    for (const b of bullets) if (b.isEnemy) b.dead = true;
    sfx.roar(); shake(12);
    toast('The Ember King is enraged!', '#ff7744');
    return;
  }
  switch (e.state) {
    case 'intro': if (e.timer <= 0) { e.invuln = false; setBoss(e, 'chase', 1.0); } break;
    case 'roar':  if (e.timer <= 0) { e.invuln = false; setBoss(e, 'chase', 0.6); } break;
    case 'chase': {
      const sp = e.speed * (e.phase2 ? 1.4 : 1);
      if (d > e.r + 30) {
        let vx = dx / d, vy = dy / d;
        if (e.avoidT > 0) { e.avoidT -= dt; vx = e.avoidX; vy = e.avoidY; }
        const ox = e.x, oy = e.y;
        moveEntity(e, vx * sp * dt, vy * sp * dt);
        if (e.avoidT <= 0 && Math.hypot(e.x - ox, e.y - oy) < sp * dt * 0.5) {   // wedged on a pillar: step around it
          const side = chance(0.5) ? 1 : -1;
          e.avoidX = -dy / d * side; e.avoidY = dx / d * side; e.avoidT = BOSS_SIDESTEP_TIME;
        }
      }
      if (e.timer <= 0) bossPickAttack(e);
      break;
    }
    case 'ringTell':
      if (e.timer <= 0) {
        const off = e.volley % 2 ? Math.PI / BOSS_RING_COUNT : 0;
        for (let i = 0; i < BOSS_RING_COUNT; i++)
          fireEnemyBullet(e.x, e.y, off + i * TAU / BOSS_RING_COUNT, BOSS_RING_SPEED, BOSS_BULLET_DMG, 'orb');
        sfx.shoot();
        if (++e.volley < (e.phase2 ? 3 : 2)) e.timer = 0.5; else setBoss(e, 'rest', 0.8);
      }
      break;
    case 'fan':
      if (e.timer <= 0) {
        for (let i = 0; i < BOSS_FAN_COUNT; i++)
          fireEnemyBullet(e.x, e.y, ang + (i - (BOSS_FAN_COUNT - 1) / 2) * BOSS_FAN_SPREAD, BOSS_FAN_SPEED, BOSS_BULLET_DMG, 'orb');
        sfx.shoot();
        if (++e.volley < (e.phase2 ? 4 : 3)) e.timer = 0.38; else setBoss(e, 'rest', 0.8);
      }
      break;
    case 'chargeTell':
      if (e.timer > 0.2) e.dir = ang;                  // locks direction just before lunging
      if (e.timer <= 0) { setBoss(e, 'charge', 0.8); sfx.dash(); }
      break;
    case 'charge': {
      const hit = moveEntity(e, Math.cos(e.dir) * BOSS_CHARGE_SPEED * dt, Math.sin(e.dir) * BOSS_CHARGE_SPEED * dt);
      particles.push({ x: e.x, y: e.y + 10, vx: 0, vy: 0, life: 0.3, max: 0.3, color: '#f77622', size: 8 });
      if (hit) {                                       // slammed into a wall or pillar: stunned!
        shake(11); sfx.slam();
        burst(e.x + Math.cos(e.dir) * 30, e.y + Math.sin(e.dir) * 30, ['#9aa5b1', '#5b6470'], 16, 170, 0.6, 4);
        setBoss(e, 'stun', 1.2);
      } else if (e.timer <= 0) setBoss(e, 'rest', 0.5);
      break;
    }
    case 'slamTell':
      if (e.timer <= 0) {
        shake(12); sfx.slam();
        slashes.push({ x: e.x, y: e.y, ang: 0, arc: TAU, range: BOSS_SLAM_RADIUS, life: 0.22, color: '#e43b44', ring: true });
        burst(e.x, e.y + 20, ['#e43b44', '#f77622', '#5b6470'], 26, 260, 0.5, 4);
        if (d < BOSS_SLAM_RADIUS + player.r - 4) player.hurt(BOSS_SLAM_DMG, e.x, e.y);
        setBoss(e, 'rest', 0.7);
      }
      break;
    case 'spiral':
      e.spin += dt * 2.4;
      e.shotT -= dt;
      while (e.shotT <= 0) {
        e.shotT += 0.1;
        for (let k = 0; k < 3; k++) fireEnemyBullet(e.x, e.y, e.spin + k * TAU / 3, BOSS_SPIRAL_SPEED, BOSS_BULLET_DMG, 'orb');
      }
      if (e.timer <= 0) setBoss(e, 'rest', 1.0);
      break;
    case 'summon':
      if (e.timer <= 0) {
        for (const side of [-1, 1]) {
          const bat = createEnemy('bat', e.x, e.y, game.floor, e.room);    // born inside the boss so never inside a wall
          bat.awake = true; bat.alert = 0.4; bat.kx = side * 260;
          spawnQueue.push(bat);
          burst(bat.x, bat.y, DEATH_COLORS.bat, 10, 120, 0.4, 3);
        }
        setBoss(e, 'rest', 0.5);
      }
      break;
    case 'stun': case 'rest':
      if (e.timer <= 0) setBoss(e, 'chase', rand(0.9, 1.5) * (e.phase2 ? 0.7 : 1));
      break;
    case 'dying':
      if (Math.random() < dt * 14) {
        burst(e.x + (Math.random() - 0.5) * 70, e.y + (Math.random() - 0.5) * 70, DEATH_COLORS.boss, 10, 180, 0.6, 4);
        shake(5); sfx.boom();
      }
      if (e.timer <= 0) finishBoss(e);
      break;
  }
}

function sealArena() {
  const room = dungeon.bossRoom;
  room.sealed = true;
  for (let y = room.y - 1; y <= room.y + room.h; y++) for (let x = room.x - 1; x <= room.x + room.w; x++) {
    const onRing = x === room.x - 1 || x === room.x + room.w || y === room.y - 1 || y === room.y + room.h;
    if (onRing && tileAt(x, y) === T_FLOOR) { dungeon.tiles[idx(x, y)] = T_GATE; dungeon.gates.push(idx(x, y)); repaintTile(x, y); }
  }
  const boss = enemies.find(e => e.type === 'boss');
  if (boss) { boss.awake = true; setBoss(boss, 'intro', 1.6); }
  game.banner = { text: BOSS_NAME, sub: 'Lord of the Deep', life: 3, color: '#ff6644' };
  sfx.roar(); sfx.slam(); shake(10);
  updateFOV(true);
}

function startBossDeath(e) {
  e.invuln = true;
  setBoss(e, 'dying', 1.8);
  for (const b of bullets) if (b.isEnemy) b.dead = true;
  for (const o of enemies) if (o !== e && !o.dead && o.awake) killEnemy(o);
}

function finishBoss(e) {
  e.dead = true;
  player.kills++;
  burst(e.x, e.y, DEATH_COLORS.boss, 60, 320, 1.1, 5);
  splat(e.x, e.y + 10, STAIN_COLORS.boss, 160, 70);
  shake(16); sfx.boom(); sfx.win(); hitstop(HITSTOP_BOSS);
  for (let i = 0; i < ENEMY_STATS.boss.gold[0]; i++) dropItem('gold', e.x, e.y, { value: 2 });
  for (const i of dungeon.gates) { dungeon.tiles[i] = T_FLOOR; repaintTile(i % MAP_W, (i / MAP_W) | 0); }
  dungeon.gates = [];
  updateFOV(true);
  toast('The Ember King is slain!', '#fee761');
  game.winTimer = 3.2;
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.alert = Math.max(0, e.alert - dt);
    e.anim += dt;
    if (!e.awake) continue;
    if (e.kx || e.ky) {
      moveEntity(e, e.kx * dt, e.ky * dt);
      const f = Math.exp(-9 * dt);
      e.kx *= f; e.ky *= f;
      if (Math.abs(e.kx) + Math.abs(e.ky) < 4) e.kx = e.ky = 0;
    }
    switch (e.type) {
      case 'slime': case 'mini': updateSlime(e, dt); break;
      case 'bat': updateBat(e, dt); break;
      case 'skeleton': updateSkeleton(e, dt); break;
      case 'boss': updateBoss(e, dt); break;
    }
    if (e.dead || e.state === 'dying' || e.state === 'idle') continue;
    if (dist(e.x, e.y, player.x, player.y) < e.r + player.r - 3) {
      const dmg = e.type === 'boss' && e.state === 'charge' ? BOSS_CHARGE_DMG : e.dmg;
      if (player.hurt(dmg, e.x, e.y) && e.type === 'bat') { e.state = 'flee'; e.timer = BAT_FLEE_TIME; }
    }
  }
  if (spawnQueue.length) { enemies.push(...spawnQueue); spawnQueue = []; }
  // Keep enemies from stacking on top of each other.
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.dead || !a.awake) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.dead || !b.awake) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d >= min || d === 0) continue;
      const push = (min - d) / 2, nx = dx / d, ny = dy / d;
      if (a.type !== 'boss') moveEntity(a, -nx * push, -ny * push);
      if (b.type !== 'boss') moveEntity(b, nx * push, ny * push);
    }
  }
}

// ============================================================
// BULLETS
// ============================================================
function breakPot(pr) {
  pr.dead = true;
  burst(pr.x, pr.y, ['#b86f50', '#733e39', '#ead4aa'], 10, 140, 0.45, 3);
  splat(pr.x, pr.y + 4, ['#b86f50', '#733e39'], 10, 14);
  noise(0.1, 0.18, 1400);
  for (let i = randInt(POT_GOLD[0], POT_GOLD[1]); i > 0; i--) dropItem('gold', pr.x, pr.y, { value: 1 });
  if (chance(POT_POTION_CHANCE)) dropItem('potion', pr.x, pr.y);
}

function explodeOrb(b) {
  burst(b.x, b.y, ['#f77622', '#fee761', '#e43b44'], 16, 170, 0.45, 4);
  slashes.push({ x: b.x, y: b.y, ang: 0, arc: TAU, range: b.aoe, life: 0.18, color: '#f77622', ring: true });
  sfx.boom(); shake(2);
  for (const pr of props) if (!pr.dead && dist(b.x, b.y, pr.x, pr.y) < b.aoe + POT_RADIUS) breakPot(pr);
  for (const e of enemies) {
    if (e.dead || dist(b.x, b.y, e.x, e.y) > b.aoe + e.r) continue;
    damageEnemy(e, b.dmg, Math.atan2(e.y - b.y, e.x - b.x), b.knock);
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (b.dead) continue;
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (solidAt(b.x, b.y)) {
      b.dead = true;
      if (b.kind === 'orb' && !b.isEnemy) explodeOrb(b);
      else burst(b.x - b.vx * dt, b.y - b.vy * dt, b.isEnemy ? '#f77622' : '#c8ccd4', 4, 70, 0.25, 2);
      continue;
    }
    if (b.isEnemy) {
      if (dist(b.x, b.y, player.x, player.y) < b.r + player.r - 2 && player.hurt(b.dmg, b.x - b.vx * 0.05, b.y - b.vy * 0.05)) b.dead = true;
      continue;
    }
    for (const pr of props) {
      if (pr.dead || dist(b.x, b.y, pr.x, pr.y) > b.r + POT_RADIUS) continue;
      breakPot(pr);
      if (b.kind === 'orb') { explodeOrb(b); b.dead = true; }
      break;
    }
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead || b.hit.has(e) || dist(b.x, b.y, e.x, e.y) > b.r + e.r) continue;
      if (b.kind === 'orb') { explodeOrb(b); b.dead = true; break; }
      damageEnemy(e, b.dmg, Math.atan2(b.vy, b.vx), b.knock);
      b.hit.add(e);
      if (b.pierce-- <= 0) { b.dead = true; break; }
    }
  }
}

// ============================================================
// LOOT
// ============================================================
function dropItem(kind, x, y, extra) {
  const a = Math.random() * TAU, s = 80 + Math.random() * 120;
  items.push(Object.assign({ kind, x, y, r: 5, vx: Math.cos(a) * s, vy: Math.sin(a) * s, age: 0, dead: false, seed: Math.random() * 10 }, extra));
}

function rollWeapon(floor) {
  const odds = RARITY_ODDS[floor - 1];
  const roll = () => {
    const r = rng();
    return { type: pick(WEAPON_KEYS), rarity: r < odds[0] ? 0 : r < odds[0] + odds[1] ? 1 : 2 };
  };
  let w = roll();
  if (w.type === player.weapon.type && w.rarity <= player.weapon.rarity) w = roll();   // fewer duds
  return w;
}

function openChest(c) {
  c.opened = true;
  sfx.chest();
  burst(c.x, c.y - 6, ['#fee761', '#f77622', '#f4f4f4'], 18, 150, 0.6, 3);
  for (let i = randInt(5, 9); i > 0; i--) dropItem('gold', c.x, c.y, { value: randInt(1, 3) });
  if (c.potion) dropItem('potion', c.x, c.y);
  const kind = c.loot === 'any' ? (chance(0.55) ? 'weapon' : 'relic') : c.loot;
  if (kind === 'weapon') dropItem('weapon', c.x, c.y, { weapon: rollWeapon(game.floor) });
  else dropItem('relic', c.x, c.y, { relic: pick(RELIC_KEYS) });
}

function collectItem(it) {
  switch (it.kind) {
    case 'gold':
      player.gold += it.value; sfx.coin(); break;
    case 'potion':
      if (player.potions >= POTION_MAX) return false;
      player.potions++; sfx.pickup(); toast('Health Potion  (' + (touch.mode ? 'POTION' : 'Q') + ' to drink)', '#ff7788'); break;
    case 'relic': {
      const r = RELICS[it.relic];
      player.relics[it.relic] = (player.relics[it.relic] || 0) + 1;
      if (it.relic === 'heart') { player.maxHp += 25; player.hp += 25; }
      sfx.pickup(); toast(r.name + ' — ' + r.desc, '#fee761');
      burst(it.x, it.y, ['#fee761', '#f4f4f4'], 12, 110, 0.5, 3);
      break;
    }
    default: return false;                            // weapons are swapped with the Use key
  }
  return true;
}

function updateItems(dt) {
  interact = null;
  let nearestUse = null, nearestD = WEAPON_REACH;
  for (const it of items) {
    if (it.dead) continue;
    it.age += dt;
    if (it.vx || it.vy) {
      moveEntity(it, it.vx * dt, it.vy * dt);
      const f = Math.exp(-6 * dt);
      it.vx *= f; it.vy *= f;
      if (Math.abs(it.vx) + Math.abs(it.vy) < 3) it.vx = it.vy = 0;
    }
    const d = dist(it.x, it.y, player.x, player.y);
    if (it.kind === 'gold' && it.age > 0.4 && d < MAGNET_RADIUS && d > 1) {
      const pull = Math.min(d, 420 * dt);
      moveEntity(it, (player.x - it.x) / d * pull, (player.y - it.y) / d * pull);
    }
    if (it.kind === 'weapon' || it.price) {            // needs the Use key: weapon swaps and shop goods
      if (it.age > 0.3 && d < nearestD) { nearestD = d; nearestUse = it; }
      continue;
    }
    if (it.age > 0.35 && d < PICKUP_RADIUS && collectItem(it)) it.dead = true;
  }
  for (const c of chests)
    if (!c.opened && dist(c.x, c.y, player.x, player.y) < 26) openChest(c);

  if (nearestUse) interact = { type: nearestUse.price ? 'buy' : 'weapon', item: nearestUse };
  else if (tileAt(Math.floor(player.x / TILE), Math.floor(player.y / TILE)) === T_STAIRS) interact = { type: 'stairs' };
}

function useInteract() {
  if (game.state !== 'playing' || !interact) return;
  if (interact.type === 'buy') {
    const it = interact.item;
    if (player.gold < it.price) { toast('Not enough gold!', '#ff8888'); sfx.clink(); return; }
    if (it.kind === 'potion' && player.potions >= POTION_MAX) { toast('Your potion bag is full', '#aaaaaa'); return; }
    player.gold -= it.price;
    it.price = 0;
    sfx.coin();
    burst(it.x, it.y, ['#fee761', '#f77622'], 10, 100, 0.4, 3);
    if (it.kind !== 'weapon') { if (collectItem(it)) it.dead = true; return; }
  }
  if (interact.type === 'weapon' || interact.type === 'buy') {
    const it = interact.item, old = player.weapon;
    player.weapon = it.weapon;
    it.weapon = old; it.age = 0;                      // your old weapon stays on the floor
    player.attackCd = 0.2;
    sfx.pickup();
    toast('Equipped ' + weaponLabel(player.weapon), RARITIES[player.weapon.rarity].color);
  } else if (interact.type === 'stairs') {
    sfx.stairs();
    game.state = 'transition';
    game.transition = { t: 0, phase: 'out', next: game.floor + 1 };
  }
}

// ============================================================
// RUN FLOW
// ============================================================
function newRun() {
  game.seed = urlSeed !== null ? (Number(urlSeed) | 0) : (Math.random() * 0x7fffffff) | 0;
  game.time = 0; game.shake = 0; game.hurtFlash = 0; game.hitstop = 0; game.endT = 0; game.winTimer = 0;
  game.transition = null;
  toasts = [];
  player = new Player();
  enterFloor(1);
  game.state = 'playing';
}

function enterFloor(n) {
  game.floor = n;
  rng = mulberry32(game.seed + n * 7919);
  dungeon = generateFloor(n);
  paintDungeon();
  populateFloor(n);
  player.x = dungeon.start.cx * TILE + TILE / 2;
  player.y = dungeon.start.cy * TILE + TILE / 2;
  player.kx = player.ky = 0; player.dashT = 0;
  cam.x = player.x - VIEW_W / 2; cam.y = player.y - VIEW_H / 2;
  interact = null;
  updateFOV(true);
  game.banner = { text: n === FINAL_FLOOR ? 'Final Floor' : 'Floor ' + n, sub: THEMES[n - 1].name, life: 3, color: '#ffffff' };
}

function die() {
  game.state = 'dead'; game.endT = 0;
  burst(player.x, player.y, ['#3a86ff', '#9aa5b1', '#e43b44'], 30, 200, 0.9, 4);
  sfx.lose();
  best.bestGold = Math.max(best.bestGold, player.gold);
  saveBest();
}

function win() {
  game.state = 'win'; game.endT = 0;
  best.wins++;
  best.bestGold = Math.max(best.bestGold, player.gold);
  const d = game.difficulty;
  if (!best.times[d] || game.time < best.times[d]) best.times[d] = game.time;
  saveBest();
}

function togglePause() {
  if (game.state === 'playing') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'playing';
}

function primaryAction() {
  if (game.state === 'title') newRun();
  else if ((game.state === 'dead' || game.state === 'win') && game.endT > 0.9) newRun();
  else if (game.state === 'paused') togglePause();
}

// ============================================================
// UPDATE
// ============================================================
function updateEffects(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const f = Math.exp(-4 * dt);
    p.vx *= f; p.vy *= f;
  }
  for (const n of numbers) { n.life -= dt; n.y -= 38 * dt; }
  for (const s of slashes) s.life -= dt;
  for (const t of toasts) t.life -= dt;
  particles = particles.filter(p => p.life > 0);
  numbers = numbers.filter(n => n.life > 0);
  slashes = slashes.filter(s => s.life > 0);
  toasts = toasts.filter(t => t.life > 0);
  game.shake = Math.max(0, game.shake - dt * 30);
  game.hurtFlash = Math.max(0, game.hurtFlash - dt);
  if (game.banner && (game.banner.life -= dt) <= 0) game.banner = null;
}

function update(dt) {
  game.anim += dt;
  if (game.state === 'title' || game.state === 'paused') return;
  if (game.state === 'transition') {
    const tr = game.transition;
    tr.t += dt;
    if (tr.phase === 'out' && tr.t >= 0.5) { enterFloor(tr.next); tr.phase = 'in'; tr.t = 0; }
    else if (tr.phase === 'in' && tr.t >= 0.5) { game.transition = null; game.state = 'playing'; }
    return;
  }
  if (game.state === 'dead' || game.state === 'win') {
    game.endT += dt;
    player.hpLag += (player.hp - player.hpLag) * Math.min(1, dt * 4);
    updateEffects(dt);
    return;
  }

  if (game.hitstop > 0) { game.hitstop -= dt; return; }
  game.time += dt;
  player.update(dt);
  updateFOV(false);
  const br = dungeon.bossRoom;
  if (br && !br.sealed) {
    const tx = player.x / TILE, ty = player.y / TILE;
    if (tx > br.x + 1.2 && tx < br.x + br.w - 1.2 && ty > br.y + 1.2 && ty < br.y + br.h - 1.2) sealArena();
  }
  updateEnemies(dt);
  updateBullets(dt);
  updateItems(dt);
  updateEffects(dt);
  enemies = enemies.filter(e => !e.dead);
  bullets = bullets.filter(b => !b.dead);
  items = items.filter(it => !it.dead);
  props = props.filter(pr => !pr.dead);

  // Camera leans a little toward where you are aiming.
  const lookX = mouse.active ? (mouse.x - VIEW_W / 2) * 0.12 : 0, lookY = mouse.active ? (mouse.y - VIEW_H / 2) * 0.12 : 0;
  const k = Math.min(1, dt * 10);
  cam.x += (player.x + lookX - VIEW_W / 2 - cam.x) * k;
  cam.y += (player.y + lookY - VIEW_H / 2 - cam.y) * k;

  if (game.winTimer > 0 && game.state === 'playing' && (game.winTimer -= dt) <= 0) win();
}

// ============================================================
// RENDER — WORLD
// ============================================================
function drawTiles(g, cx, cy) {
  const sx = Math.max(0, cx), sy = Math.max(0, cy), ex = Math.min(mapSeen.width, cx + VIEW_W), ey = Math.min(mapSeen.height, cy + VIEW_H);
  if (ex > sx && ey > sy) g.drawImage(mapSeen, sx, sy, ex - sx, ey - sy, sx, sy, ex - sx, ey - sy);
  if (dungeon.exitRoom) {                                        // stairs shimmer
    const s = dungeon.exitRoom;
    if (dungeon.explored[idx(s.cx, s.cy)]) {
      g.fillStyle = `rgba(254,231,97,${0.1 + 0.08 * Math.sin(game.anim * 4)})`;
      g.fillRect(s.cx * TILE + 4, s.cy * TILE + 4, 24, 24);
    }
  }
}

function drawTorches(g) {
  for (const t of dungeon.torches) {
    if (!dungeon.explored[idx(t.tx, t.ty)]) continue;
    drawSprite(g, 'flame' + Math.floor(game.anim * 9 + t.seed) % 3, t.x, t.y - 4);
  }
}

function drawShadow(g, x, y, w) {
  g.fillStyle = 'rgba(0,0,0,0.35)';
  g.beginPath(); g.ellipse(x, y, w, w * 0.4, 0, 0, TAU); g.fill();
}

function drawItem(g, it) {
  const bob = Math.sin(game.anim * 4 + it.seed) * 2;
  if (it.price) {                                     // shop goods sit on a little stone stand
    g.fillStyle = '#1a1423'; g.fillRect(it.x - 15, it.y + 5, 30, 11);
    g.fillStyle = '#5b6470'; g.fillRect(it.x - 13, it.y + 7, 26, 7);
    g.fillStyle = '#9aa5b1'; g.fillRect(it.x - 13, it.y + 7, 26, 2);
  }
  drawShadow(g, it.x, it.y + 8, it.kind === 'gold' ? 5 : 9);
  if (it.kind === 'gold') { drawSprite(g, 'coin', it.x, it.y + bob * 0.5); return; }
  if (it.kind === 'weapon') {
    g.fillStyle = RARITIES[it.weapon.rarity].color;
    g.globalAlpha = 0.25 + 0.12 * Math.sin(game.anim * 5 + it.seed);
    g.beginPath(); g.arc(it.x, it.y, 17, 0, TAU); g.fill();
    g.globalAlpha = 1;
    drawSprite(g, WEAPONS[it.weapon.type].icon, it.x, it.y - 2 + bob);
    return;
  }
  if (it.kind === 'relic') {
    g.fillStyle = '#fee761'; g.globalAlpha = 0.2 + 0.1 * Math.sin(game.anim * 5 + it.seed);
    g.beginPath(); g.arc(it.x, it.y, 16, 0, TAU); g.fill();
    g.globalAlpha = 1;
  }
  drawSprite(g, it.kind === 'relic' ? it.relic : 'potion', it.x, it.y - 2 + bob);
}

function drawHeldWeapon(g, p) {
  const w = WEAPONS[p.weapon.type], col = RARITIES[p.weapon.rarity].color;
  g.save();
  g.translate(Math.round(p.x), Math.round(p.y) + 2);
  if (w.kind === 'melee') {
    const k = p.swingT > 0 ? 1 - p.swingT / SWING_TIME : 1;
    g.rotate(p.aim + (k - 0.5) * w.arc * p.swingDir * (p.swingT > 0 ? 1 : 0.6));
    g.fillStyle = '#733e39'; g.fillRect(6, -2, 6, 4);
    g.fillStyle = '#fee761'; g.fillRect(11, -6, 3, 12);
    g.fillStyle = '#1a1423'; g.fillRect(14, -3, 23, 6);
    g.fillStyle = '#dfe6ee'; g.fillRect(14, -2, 22, 4);
    g.fillStyle = col; g.fillRect(14, -1, 22, 1);
  } else if (w.kind === 'arrow') {
    g.rotate(p.aim);
    g.strokeStyle = '#1a1423'; g.lineWidth = 5; g.beginPath(); g.arc(8, 0, 13, -1.15, 1.15); g.stroke();
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(8, 0, 13, -1.15, 1.15); g.stroke();
    const pull = p.attackCd > 0 ? 0 : 5;
    g.strokeStyle = '#f4f4f4'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(13.3, -11.9); g.lineTo(13.3 - pull, 0); g.lineTo(13.3, 11.9); g.stroke();
  } else {
    g.rotate(p.aim);
    g.fillStyle = '#1a1423'; g.fillRect(3, -3, 24, 6);
    g.fillStyle = '#b86f50'; g.fillRect(4, -2, 22, 4);
    g.fillStyle = col; g.beginPath(); g.arc(28, 0, 6, 0, TAU); g.fill();
    g.fillStyle = '#f77622'; g.beginPath(); g.arc(28, 0, 4 + Math.sin(game.anim * 10), 0, TAU); g.fill();
  }
  g.restore();
}

function drawPlayer(g) {
  const p = player;
  if (game.state === 'dead') return;
  drawShadow(g, p.x, p.y + 12, 11);
  const blink = p.iframes > 0 && Math.floor(game.anim * 20) % 2 === 0;
  const bob = p.moving ? Math.abs(Math.sin(p.walk)) * 3 : 0;
  const behind = Math.sin(p.aim) < -0.3;
  g.globalAlpha = blink ? 0.4 : 1;
  if (behind) drawHeldWeapon(g, p);
  drawSprite(g, 'player', p.x, p.y - 6 - bob, p.facing, false, p.dashT > 0 ? 1.15 : 1, p.dashT > 0 ? 0.9 : 1);
  if (!behind) drawHeldWeapon(g, p);
  g.globalAlpha = 1;
}

function drawEnemy(g, e) {
  const flash = e.flash > 0, es = e.elite ? ELITE_SCALE : 1;
  if (e.elite) {                                      // champions glow gold
    g.fillStyle = `rgba(254,231,97,${0.2 + 0.1 * Math.sin(game.anim * 6)})`;
    g.beginPath(); g.arc(e.x, e.y - 2, e.r + 12, 0, TAU); g.fill();
  }
  switch (e.type) {
    case 'slime': case 'mini': {
      const s = e.type === 'mini' ? 0.62 : es;
      let sx = 1 + 0.06 * Math.sin(e.anim * 5), sy = 1 - 0.06 * Math.sin(e.anim * 5), lift = 0;
      if (e.state === 'hop' && e.awake) {
        const k = 1 - clamp(e.timer / SLIME_HOP_TIME, 0, 1);
        lift = Math.sin(k * Math.PI) * 9; sx = 0.9; sy = 1.14;
      }
      drawShadow(g, e.x, e.y + e.r - 2, e.r);
      drawSprite(g, 'slime', e.x, e.y - 4 * s - lift, e.facing, flash, sx * s, sy * s);
      break;
    }
    case 'bat':
      drawShadow(g, e.x, e.y + 12, 7);
      drawSprite(g, e.awake && Math.floor(e.anim * 9) % 2 ? 'batB' : 'batA', e.x, e.y - 8 + Math.sin(e.anim * 6) * 2, e.facing, flash, es, es);
      break;
    case 'skeleton': {
      drawShadow(g, e.x, e.y + 13, 10);
      drawSprite(g, 'skeleton', e.x, e.y - 5 * es, e.facing, flash, es, es);
      g.save();
      g.translate(Math.round(e.x), Math.round(e.y)); g.rotate(e.aim);
      g.strokeStyle = '#1a1423'; g.lineWidth = 4; g.beginPath(); g.arc(6, 0, 11, -1.1, 1.1); g.stroke();
      g.strokeStyle = e.state === 'aim' ? '#f77622' : '#b86f50'; g.lineWidth = 2; g.beginPath(); g.arc(6, 0, 11, -1.1, 1.1); g.stroke();
      g.restore();
      break;
    }
    case 'boss': {
      drawShadow(g, e.x, e.y + 34, 34);
      let ox = 0, oy = 0;
      if (e.state === 'ringTell' || e.state === 'chargeTell' || e.state === 'slamTell' || e.state === 'roar' || e.state === 'dying') {
        ox = (Math.random() - 0.5) * 5; oy = (Math.random() - 0.5) * 5;
      }
      if (e.phase2 && e.state !== 'dying') {
        g.fillStyle = `rgba(247,118,34,${0.18 + 0.08 * Math.sin(game.anim * 8)})`;
        g.beginPath(); g.arc(e.x, e.y - 4, 52, 0, TAU); g.fill();
      }
      const dim = e.state === 'stun';
      drawSprite(g, 'boss', e.x + ox, e.y - 6 + oy + Math.sin(e.anim * 2.5) * 3, 1,
        flash || (e.state === 'dying' && Math.floor(game.anim * 16) % 2 === 0), 1, dim ? 0.92 : 1);
      if (dim) {                                       // dizzy stars
        for (let k = 0; k < 3; k++) {
          const a = game.anim * 5 + k * TAU / 3;
          g.fillStyle = '#fee761'; g.fillRect(e.x + Math.cos(a) * 26 - 2, e.y - 52 + Math.sin(a) * 6, 5, 5);
        }
      }
      break;
    }
  }
  if (e.alert > 0 || (e.type === 'skeleton' && e.state === 'aim')) {
    g.font = 'bold 18px "Courier New", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#1a1423'; g.fillText('!', e.x + 1, e.y - e.r - 21);
    g.fillStyle = e.alert > 0 ? '#fee761' : '#ff5544'; g.fillText('!', e.x, e.y - e.r - 22);
  }
  if (e.elite) {                                      // little crown
    const cy = Math.round(e.y - e.r - 26), cx = Math.round(e.x);
    g.fillStyle = '#1a1423'; g.fillRect(cx - 8, cy - 1, 16, 8);
    g.fillStyle = '#fee761'; g.fillRect(cx - 7, cy + 3, 14, 3);
    g.fillRect(cx - 7, cy, 3, 3); g.fillRect(cx - 1, cy, 3, 3); g.fillRect(cx + 4, cy, 3, 3);
  }
  if (e.type !== 'boss' && (e.hp < e.maxHp || (e.elite && e.awake))) {
    const w = e.elite ? 40 : 26, hx = Math.round(e.x - w / 2), hy = Math.round(e.y - e.r - 14);
    g.fillStyle = '#1a1423'; g.fillRect(hx - 1, hy - 1, w + 2, 5);
    g.fillStyle = '#e43b44'; g.fillRect(hx, hy, Math.ceil(w * e.hp / e.maxHp), 3);
  }
}

function drawBossTelegraph(g, e) {
  if (e.state === 'chargeTell') {
    const a = 0.15 + 0.2 * (1 - clamp(e.timer / 0.8, 0, 1));
    g.save();
    let len = 0;                                      // the warning lane stops at the first wall
    while (len < 460 && !solidAt(e.x + Math.cos(e.dir) * (len + 8), e.y + Math.sin(e.dir) * (len + 8))) len += 8;
    g.translate(e.x, e.y); g.rotate(e.dir);
    g.fillStyle = `rgba(228,59,68,${a})`; g.fillRect(0, -26, len, 52);
    g.restore();
  } else if (e.state === 'slamTell') {
    const k = 1 - clamp(e.timer / BOSS_SLAM_TELL, 0, 1);
    g.fillStyle = 'rgba(228,59,68,0.16)';
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS, 0, TAU); g.fill();
    g.fillStyle = 'rgba(228,59,68,0.3)';
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS * k, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,120,100,0.8)'; g.lineWidth = 2;
    g.beginPath(); g.arc(e.x, e.y, BOSS_SLAM_RADIUS, 0, TAU); g.stroke();
  } else if (e.state === 'ringTell' && e.volley === 0) {
    g.strokeStyle = `rgba(247,118,34,${0.5})`; g.lineWidth = 3;
    g.beginPath(); g.arc(e.x, e.y, 40 + (0.6 - e.timer) * 70, 0, TAU); g.stroke();
  }
}

function drawBullet(g, b) {
  if (b.kind === 'arrow') {
    const a = Math.atan2(b.vy, b.vx);
    g.save();
    g.translate(b.x, b.y); g.rotate(a);
    g.fillStyle = '#1a1423'; g.fillRect(-10, -2, 18, 4);
    g.fillStyle = b.isEnemy ? '#ead4aa' : '#f4f4f4'; g.fillRect(-9, -1, 15, 2);
    g.fillStyle = b.isEnemy ? '#e43b44' : b.color; g.fillRect(4, -3, 5, 6);
    g.restore();
  } else {
    g.fillStyle = b.isEnemy ? '#a22633' : '#f77622';
    g.beginPath(); g.arc(b.x, b.y, b.r + 2, 0, TAU); g.fill();
    g.fillStyle = b.isEnemy ? '#f77622' : '#fee761';
    g.beginPath(); g.arc(b.x, b.y, b.r - 1, 0, TAU); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(b.x - 1, b.y - 1, 2, 0, TAU); g.fill();
  }
}

function punchLight(x, y, r, strength) {
  const gr = lctx.createRadialGradient(x, y, r * 0.1, x, y, r);
  gr.addColorStop(0, `rgba(0,0,0,${strength})`);
  gr.addColorStop(0.55, `rgba(0,0,0,${strength * 0.9})`);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  lctx.fillStyle = gr;
  lctx.beginPath(); lctx.arc(x, y, r, 0, TAU); lctx.fill();
}

function drawLighting(g, cx, cy) {
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, VIEW_W, VIEW_H);
  lctx.fillStyle = `rgba(${theme().dark},0.93)`;
  lctx.fillRect(0, 0, VIEW_W, VIEW_H);
  lctx.globalCompositeOperation = 'destination-out';
  punchLight(player.x - cx, player.y - cy, LIGHT_RADIUS + Math.sin(game.anim * 3) * 5, 1);
  const lit = [];
  for (const t of dungeon.torches) {
    if (!dungeon.explored[idx(t.tx, t.ty)]) continue;
    const x = t.x - cx, y = t.y - cy + 12;
    if (x < -150 || y < -150 || x > VIEW_W + 150 || y > VIEW_H + 150) continue;
    const r = 125 + Math.sin(game.anim * 11 + t.seed) * 6;
    punchLight(x, y, r, 0.85);
    lit.push([x, y, r]);
  }
  for (const b of bullets) if (b.kind === 'orb') punchLight(b.x - cx, b.y - cy, 46, 0.7);
  for (const e of enemies) if (e.type === 'boss' && e.awake) punchLight(e.x - cx, e.y - cy, 210, 0.85);
  g.drawImage(lightCanvas, 0, 0);
  g.globalCompositeOperation = 'lighter';                         // warm torch glow
  for (const [x, y, r] of lit) {
    const gr = g.createRadialGradient(x, y, 4, x, y, r);
    gr.addColorStop(0, 'rgba(255,150,50,0.15)'); gr.addColorStop(1, 'rgba(255,120,30,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

function drawWorld(g) {
  const sh = game.shake;
  const cx = Math.round(cam.x + (Math.random() - 0.5) * sh), cy = Math.round(cam.y + (Math.random() - 0.5) * sh);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#05040a'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.setTransform(1, 0, 0, 1, -cx, -cy);
  drawTiles(g, cx, cy);
  drawTorches(g);
  for (const e of enemies) if (e.type === 'boss') drawBossTelegraph(g, e);

  // Everything standing on the floor, sorted so lower things overlap higher ones.
  const list = [];
  for (const c of chests) if (dungeon.explored[idx(Math.floor(c.x / TILE), Math.floor(c.y / TILE))]) list.push({ y: c.y, kind: 0, o: c });
  for (const it of items) if (dungeon.explored[idx(Math.floor(it.x / TILE), Math.floor(it.y / TILE))]) list.push({ y: it.y - 4, kind: 1, o: it });
  for (const e of enemies) if (dungeon.explored[idx(clamp(Math.floor(e.x / TILE), 0, MAP_W - 1), clamp(Math.floor(e.y / TILE), 0, MAP_H - 1))]) list.push({ y: e.y, kind: 2, o: e });
  const mer = dungeon.merchant;
  if (mer && dungeon.explored[idx(Math.floor(mer.x / TILE), Math.floor(mer.y / TILE))]) list.push({ y: mer.y, kind: 4, o: mer });
  for (const pr of props) if (dungeon.explored[idx(Math.floor(pr.x / TILE), Math.floor(pr.y / TILE))]) list.push({ y: pr.y, kind: 5, o: pr });
  for (const pl of dungeon.pillars) if (dungeon.explored[idx(pl.tx, pl.ty)]) list.push({ y: pl.y, kind: 6, o: pl });
  list.push({ y: player.y, kind: 3, o: player });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) {
    if (d.kind === 0) { drawShadow(g, d.o.x, d.o.y + 11, 15); drawSprite(g, d.o.opened ? 'chestOpen' : 'chest', d.o.x, d.o.y); }
    else if (d.kind === 1) drawItem(g, d.o);
    else if (d.kind === 2) drawEnemy(g, d.o);
    else if (d.kind === 6) g.drawImage(pillarArt, d.o.tx * TILE, d.o.ty * TILE - 20);
    else if (d.kind === 5) { drawShadow(g, d.o.x, d.o.y + 10, 10); drawSprite(g, 'pot', d.o.x, d.o.y - 2); }
    else if (d.kind === 4) {
      drawShadow(g, d.o.x, d.o.y + 13, 12);
      drawSprite(g, 'merchant', d.o.x, d.o.y - 5 + Math.sin(game.anim * 2) * 1.5, player.x >= d.o.x ? 1 : -1);
    }
    else drawPlayer(g);
  }
  for (const b of bullets) drawBullet(g, b);
  for (const s of slashes) {
    const k = clamp(s.life / 0.16, 0, 1);
    g.globalAlpha = k * 0.85; g.strokeStyle = s.ring ? s.color : '#ffffff';
    if (s.ring) { g.lineWidth = 4; g.beginPath(); g.arc(s.x, s.y, s.range * (1.1 - k * 0.5), 0, TAU); g.stroke(); }
    else {
      g.lineWidth = 9 * k + 2; g.beginPath(); g.arc(s.x, s.y, s.range * 0.78, s.ang - s.arc / 2, s.ang + s.arc / 2); g.stroke();
      g.strokeStyle = s.color; g.lineWidth = 2; g.beginPath(); g.arc(s.x, s.y, s.range * 0.92, s.ang - s.arc / 2, s.ang + s.arc / 2); g.stroke();
    }
    g.globalAlpha = 1;
  }
  for (const p of particles) {
    g.globalAlpha = clamp(p.life / p.max, 0, 1);
    g.fillStyle = p.color;
    g.fillRect(Math.round(p.x - p.size / 2), Math.round(p.y - p.size / 2), p.size, p.size);
  }
  g.globalAlpha = 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawLighting(g, cx, cy);
  const lowHp = game.state === 'playing' && player.hp / player.maxHp < LOW_HP_WARNING ? 0.16 + 0.1 * Math.sin(game.anim * 6) : 0;
  const edge = Math.max(game.hurtFlash * 1.4, lowHp);
  if (edge > 0) {
    const gr = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 180, VIEW_W / 2, VIEW_H / 2, 520);
    gr.addColorStop(0, 'rgba(228,59,68,0)'); gr.addColorStop(1, `rgba(228,59,68,${edge})`);
    g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  return [cx, cy];
}

// ============================================================
// RENDER — HUD & SCREENS  (drawn at full display resolution)
// ============================================================
const FONT = '"Courier New", Courier, monospace';
const TITLE_FONT = 'Georgia, "Times New Roman", serif';
function text(g, str, x, y, size, color, align = 'left', font = FONT) {
  g.font = `bold ${size}px ${font}`;
  g.textAlign = align; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(0,0,0,0.8)'; g.fillText(str, x + 1, y + 2);
  g.fillStyle = color; g.fillText(str, x, y);
}
function icon(g, name, x, y, size) {            // sprite scaled to fit a size×size box centred on (x, y)
  const img = SPR[name], s = size / Math.max(img.width, img.height);
  g.drawImage(img, x - img.width * s / 2, y - img.height * s / 2, img.width * s, img.height * s);
}

function drawMinimap(g) {
  if (minimapDirty) {
    minimapDirty = false;
    mctx.clearRect(0, 0, minimap.width, minimap.height);
    for (let ty = 0; ty < MAP_H; ty++) for (let tx = 0; tx < MAP_W; tx++) {
      if (!dungeon.explored[idx(tx, ty)]) continue;
      const t = dungeon.tiles[idx(tx, ty)];
      mctx.fillStyle = t === T_WALL ? '#34364e' : t === T_STAIRS ? '#fee761' : t === T_GATE ? '#e43b44' : t === T_PILLAR ? '#5b6080' : '#8b90b4';
      mctx.fillRect(tx * 2, ty * 2, 2, 2);
    }
  }
  const s = 1.5, w = minimap.width * s, h = minimap.height * s, x = VIEW_W - w - 12, y = 12;
  g.fillStyle = 'rgba(8,6,14,0.72)'; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1; g.strokeRect(x - 2.5, y - 2.5, w + 5, h + 5);
  g.drawImage(minimap, x, y, w, h);
  const dot = (wx, wy, col, size) => { g.fillStyle = col; g.fillRect(x + wx / TILE * 2 * s - size / 2, y + wy / TILE * 2 * s - size / 2, size, size); };
  for (const c of chests) if (!c.opened && dungeon.explored[idx(Math.floor(c.x / TILE), Math.floor(c.y / TILE))]) dot(c.x, c.y, '#f77622', 4);
  for (const e of enemies) if (e.type === 'boss' && e.awake) dot(e.x, e.y, '#e43b44', 6);
  const mer = dungeon.merchant;
  if (mer && dungeon.explored[idx(Math.floor(mer.x / TILE), Math.floor(mer.y / TILE))]) dot(mer.x, mer.y, '#63c74d', 5);
  if (Math.floor(game.anim * 4) % 2) dot(player.x, player.y, '#ffffff', 5); else dot(player.x, player.y, '#2ce8f5', 5);
  text(g, (game.floor === FINAL_FLOOR ? 'Final Floor' : 'Floor ' + game.floor + '/' + FINAL_FLOOR) + ' · ' + DIFFICULTIES[game.difficulty].name, x + w, y + h + 16, 12, '#c8ccd4', 'right');
  text(g, THEMES[game.floor - 1].name, x + w, y + h + 31, 11, '#8b90b4', 'right');
}

function drawHUD(g) {
  const p = player, x = 14, y = 46, w = 190;
  g.fillStyle = 'rgba(8,6,14,0.72)'; g.fillRect(x - 6, y - 6, w + 12, 94);
  // Health
  g.fillStyle = '#2a1418'; g.fillRect(x, y, w, 18);
  g.fillStyle = '#f4f4f4'; g.fillRect(x, y, w * clamp(p.hpLag / p.maxHp, 0, 1), 18);
  g.fillStyle = p.hp / p.maxHp < 0.3 && Math.floor(game.anim * 6) % 2 ? '#ff7b84' : '#e43b44';
  g.fillRect(x, y, w * clamp(p.hp / p.maxHp, 0, 1), 18);
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x, y, w * clamp(p.hp / p.maxHp, 0, 1), 5);
  text(g, Math.ceil(p.hp) + ' / ' + p.maxHp, x + w / 2, y + 10, 12, '#ffffff', 'center');
  // Dash
  g.fillStyle = '#16222c'; g.fillRect(x, y + 21, w, 4);
  g.fillStyle = p.dashCd > 0 ? '#2a7f8a' : '#2ce8f5'; g.fillRect(x, y + 21, w * (1 - p.dashCd / DASH_COOLDOWN), 4);
  // Potions & gold
  icon(g, 'potion', x + 10, y + 40, 20);
  text(g, 'x' + p.potions, x + 24, y + 41, 13, p.potions ? '#ffffff' : '#777777');
  icon(g, 'coin', x + 78, y + 40, 14);
  text(g, String(p.gold), x + 90, y + 41, 13, '#fee761');
  text(g, formatTime(game.time), x + w, y + 41, 12, '#8b90b4', 'right');
  // Weapon
  icon(g, WEAPONS[p.weapon.type].icon, x + 10, y + 62, 20);
  text(g, weaponLabel(p.weapon), x + 24, y + 58, 12, RARITIES[p.weapon.rarity].color);
  text(g, 'DMG ' + Math.round(weaponDamage(p.weapon) * p.dmgMul), x + 24, y + 71, 10, '#8b90b4');
  // Relics
  let rx = x + 8;
  for (const key of RELIC_KEYS) {
    const n = p.relics[key];
    if (!n) continue;
    g.fillStyle = 'rgba(8,6,14,0.72)'; g.fillRect(rx - 12, y + 92, 28, 24);
    icon(g, key, rx, y + 104, 18);
    if (n > 1) text(g, String(n), rx + 12, y + 110, 10, '#ffffff', 'center');
    rx += 30;
  }

  drawMinimap(g);

  // Boss health
  const boss = enemies.find(e => e.type === 'boss' && e.awake);
  if (boss) {
    const bw = 400, bx = (VIEW_W - bw) / 2, by = VIEW_H - 34;
    text(g, BOSS_NAME, VIEW_W / 2, by - 12, 13, '#ff8866', 'center');
    g.fillStyle = 'rgba(8,6,14,0.8)'; g.fillRect(bx - 3, by - 3, bw + 6, 16);
    g.fillStyle = '#3a1418'; g.fillRect(bx, by, bw, 10);
    g.fillStyle = boss.phase2 ? '#f77622' : '#e43b44'; g.fillRect(bx, by, bw * boss.hp / boss.maxHp, 10);
    g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(bx + bw / 2 - 1, by, 2, 10);
  }

  // Use prompt
  const useKey = touch.mode ? 'USE' : '[E]';
  const promptY = boss ? VIEW_H - 78 : VIEW_H - 50;
  if (interact && game.state === 'playing') {
    const it = interact.item;
    if (interact.type === 'stairs') text(g, useKey + ' Descend deeper', VIEW_W / 2, promptY, 15, '#fee761', 'center');
    else if (it.kind === 'weapon') {
      const wpn = it.weapon, verb = it.price ? ' Buy ' : ' Take ', cost = it.price ? '  —  ' + it.price + ' gold' : '';
      text(g, useKey + verb + weaponLabel(wpn) + cost, VIEW_W / 2, promptY - 9, 15, it.price > p.gold ? '#ff8888' : RARITIES[wpn.rarity].color, 'center');
      text(g, 'DMG ' + Math.round(weaponDamage(wpn) * p.dmgMul) + '   (yours: ' + Math.round(weaponDamage(p.weapon) * p.dmgMul) + ')', VIEW_W / 2, promptY + 9, 12, '#c8ccd4', 'center');
    } else {
      const name = it.kind === 'potion' ? 'Health Potion' : RELICS[it.relic].name;
      const desc = it.kind === 'potion' ? 'Heals ' + POTION_HEAL + ' HP when you drink it' : RELICS[it.relic].desc;
      text(g, useKey + ' Buy ' + name + '  —  ' + it.price + ' gold', VIEW_W / 2, promptY - 9, 15, it.price > p.gold ? '#ff8888' : '#fee761', 'center');
      text(g, desc, VIEW_W / 2, promptY + 9, 12, '#c8ccd4', 'center');
    }
  }
  // Toasts
  toasts.forEach((t, i) => {
    g.globalAlpha = clamp(t.life, 0, 1);
    text(g, t.text, VIEW_W / 2, promptY - 34 - (toasts.length - 1 - i) * 20, 13, t.color, 'center');
  });
  g.globalAlpha = 1;
  // Floor banner
  if (game.banner) {
    const b = game.banner;
    g.globalAlpha = clamp(Math.min(b.life, 3 - b.life) * 2.5, 0, 1);
    text(g, b.text, VIEW_W / 2, 150, 44, b.color, 'center', TITLE_FONT);
    text(g, b.sub, VIEW_W / 2, 190, 17, '#c8ccd4', 'center', TITLE_FONT);
    g.globalAlpha = 1;
  }
}

// Price tags and the merchant's patter, drawn crisp on top of the world.
function drawShopLabels(g, cx, cy) {
  const mer = dungeon.merchant;
  if (!mer) return;
  for (const it of items) {
    if (!it.price || dist(it.x, it.y, player.x, player.y) > 260) continue;
    text(g, it.price + 'g', it.x - cx, it.y - cy + 26, 12, it.price > player.gold ? '#ff8888' : '#fee761', 'center');
  }
  if (dist(mer.x, mer.y, player.x, player.y) < 150 && items.some(it => it.price))
    text(g, 'Gold for goods, traveller!', mer.x - cx, mer.y - cy - 32, 12, '#c8f0b0', 'center');
}

function drawNumbers(g, cx, cy) {
  for (const n of numbers) {
    g.globalAlpha = clamp(n.life * 2.5, 0, 1);
    text(g, n.text, n.x - cx, n.y - cy, 14, n.color, 'center');
  }
  g.globalAlpha = 1;
}

function controlLines() {
  return touch.mode
    ? ['Left stick: move', 'Right stick: aim + attack', 'DASH: dodge roll', 'POTION: heal', 'USE: stairs, shop + weapons']
    : ['WASD / Arrows: move', 'Mouse: aim   Click: attack', 'Space: dash through danger', 'Q: drink potion', 'E: stairs, shop + swap weapons', 'P: pause   M: mute'];
}

function difficultyButton(i) { return { x: VIEW_W / 2 - 187 + i * 128, y: 484, w: 118, h: 28 }; }
const embers = [];
function drawTitle(g) {
  const gr = g.createRadialGradient(VIEW_W / 2, 420, 40, VIEW_W / 2, 300, 560);
  gr.addColorStop(0, '#3a1a14'); gr.addColorStop(0.5, '#150c14'); gr.addColorStop(1, '#05040a');
  g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H);
  if (embers.length < 70) embers.push({ x: Math.random() * VIEW_W, y: VIEW_H + 10, vy: 20 + Math.random() * 50, s: 2 + Math.random() * 3, seed: Math.random() * 10 });
  for (const e of embers) {
    e.y -= e.vy / 60; e.x += Math.sin(game.anim * 2 + e.seed) * 0.4;
    if (e.y < -10) { e.y = VIEW_H + 10; e.x = Math.random() * VIEW_W; }
    g.globalAlpha = clamp(e.y / VIEW_H, 0, 1) * 0.8;
    g.fillStyle = e.seed > 5 ? '#f77622' : '#fee761';
    g.fillRect(e.x, e.y, e.s, e.s);
  }
  g.globalAlpha = 1;
  g.save();
  g.shadowColor = '#f77622'; g.shadowBlur = 26 + Math.sin(game.anim * 3) * 8;
  text(g, 'EMBERDEEP', VIEW_W / 2, 118, 78, '#fee761', 'center', TITLE_FONT);
  g.restore();
  text(g, 'A roguelike dungeon crawler', VIEW_W / 2, 172, 18, '#e8b796', 'center', TITLE_FONT);

  // The cast
  const baseY = 268, bob = k => Math.sin(game.anim * 3 + k) * 3;
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(120, baseY + 26, 560, 6);
  drawSprite(g, 'player', 190, baseY + bob(0), 1, false, 1.4, 1.4);
  drawSprite(g, 'slime', 320, baseY + 6 + bob(1), -1, false, 1.3, 1.3);
  drawSprite(g, Math.floor(game.anim * 8) % 2 ? 'batA' : 'batB', 420, baseY - 14 + bob(2) * 2, -1, false, 1.3, 1.3);
  drawSprite(g, 'skeleton', 510, baseY + bob(3), -1, false, 1.3, 1.3);
  drawSprite(g, 'boss', 620, baseY - 18 + bob(4), 1, false, 0.9, 0.9);
  text(g, 'You', 190, baseY + 46, 12, '#2ce8f5', 'center');
  text(g, 'Slime', 320, baseY + 46, 12, '#63c74d', 'center');
  text(g, 'Bat', 420, baseY + 46, 12, '#b55088', 'center');
  text(g, 'Skeleton', 510, baseY + 46, 12, '#ead4aa', 'center');
  text(g, 'Ember King', 620, baseY + 46, 12, '#ff6644', 'center');

  text(g, 'Fight through 3 random floors, grab loot, and slay the Ember King.', VIEW_W / 2, 352, 14, '#c8ccd4', 'center');
  controlLines().forEach((line, i) => text(g, line, VIEW_W / 2, 378 + i * 17, 12, '#8b90b4', 'center'));

  // Difficulty picker
  const diff = DIFFICULTIES[game.difficulty];
  DIFFICULTIES.forEach((d, i) => {
    const b = difficultyButton(i), on = i === game.difficulty;
    g.fillStyle = on ? d.color : 'rgba(8,6,14,0.6)'; g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = d.color; g.lineWidth = 2; g.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    g.font = `bold 14px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = on ? '#1a1423' : d.color; g.fillText((touch.mode ? '' : (i + 1) + ' ') + d.name, b.x + b.w / 2, b.y + b.h / 2 + 1);
  });
  text(g, diff.blurb, VIEW_W / 2, 524, 11, diff.color, 'center');
  if (Math.floor(game.anim * 2) % 2)
    text(g, touch.mode ? 'TAP TO DESCEND' : 'CLICK OR PRESS ENTER TO DESCEND', VIEW_W / 2, 550, 19, '#ffffff', 'center');
  if (best.wins || best.bestGold)
    text(g, 'Wins: ' + best.wins + (best.times[game.difficulty] ? '   Fastest ' + diff.name + ' win: ' + formatTime(best.times[game.difficulty]) : '') + '   Most gold: ' + best.bestGold, VIEW_W / 2, 580, 12, '#b86f50', 'center');
}

function drawEndScreen(g, won) {
  const a = clamp(game.endT / 0.8, 0, 1);
  g.fillStyle = won ? `rgba(20,14,4,${a * 0.78})` : `rgba(24,2,6,${a * 0.8})`;
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = a;
  g.save();
  g.shadowColor = won ? '#fee761' : '#e43b44'; g.shadowBlur = 24;
  text(g, won ? 'VICTORY!' : 'YOU DIED', VIEW_W / 2, 170, 68, won ? '#fee761' : '#e43b44', 'center', TITLE_FONT);
  g.restore();
  text(g, won ? 'The Ember King has fallen. The deep is quiet again.' : 'Slain on ' + (game.floor === FINAL_FLOOR ? 'the final floor' : 'floor ' + game.floor) + ' — ' + THEMES[game.floor - 1].name,
    VIEW_W / 2, 232, 16, '#e8b796', 'center', TITLE_FONT);
  const rows = [['Difficulty', DIFFICULTIES[game.difficulty].name], ['Time', formatTime(game.time)], ['Monsters slain', String(player.kills)],
    ['Gold', String(player.gold)], ['Weapon', weaponLabel(player.weapon)]];
  rows.forEach(([label, value], i) => {
    text(g, label, VIEW_W / 2 - 16, 278 + i * 26, 15, '#8b90b4', 'right');
    text(g, value, VIEW_W / 2 + 16, 278 + i * 26, 15, '#ffffff', 'left');
  });
  if (won && best.times[game.difficulty]) text(g, 'Fastest ' + DIFFICULTIES[game.difficulty].name + ' win: ' + formatTime(best.times[game.difficulty]), VIEW_W / 2, 420, 13, '#b86f50', 'center');
  if (game.endT > 0.9 && Math.floor(game.anim * 2) % 2)
    text(g, touch.mode ? 'TAP TO PLAY AGAIN' : 'CLICK OR PRESS ENTER TO PLAY AGAIN', VIEW_W / 2, 470, 18, '#ffffff', 'center');
  g.globalAlpha = 1;
}

function render() {
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (game.state === 'title') { drawTitle(ctx); return; }

  const [cx, cy] = drawWorld(wctx);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = !Number.isInteger(renderScale);
  ctx.drawImage(world, 0, 0, canvas.width, canvas.height);
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
  ctx.imageSmoothingEnabled = false;

  drawShopLabels(ctx, cx, cy);
  drawNumbers(ctx, cx, cy);
  drawHUD(ctx);
  if (game.state === 'paused') {
    ctx.fillStyle = 'rgba(5,4,10,0.72)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text(ctx, 'PAUSED', VIEW_W / 2, 190, 54, '#ffffff', 'center', TITLE_FONT);
    controlLines().forEach((line, i) => text(ctx, line, VIEW_W / 2, 260 + i * 22, 14, '#c8ccd4', 'center'));
    text(ctx, touch.mode ? 'Tap to resume' : 'Press P or click to resume', VIEW_W / 2, 420, 15, '#fee761', 'center');
  } else if (game.state === 'dead') drawEndScreen(ctx, false);
  else if (game.state === 'win') drawEndScreen(ctx, true);
  else if (game.state === 'transition') {
    const tr = game.transition, k = clamp(tr.t / 0.5, 0, 1);
    ctx.fillStyle = `rgba(5,4,10,${tr.phase === 'out' ? k : 1 - k})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// ============================================================
// INPUT
// ============================================================
function setMouse(ev) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (ev.clientX - rect.left) * VIEW_W / rect.width;
  mouse.y = (ev.clientY - rect.top) * VIEW_H / rect.height;
}
canvas.addEventListener('pointerdown', ev => {
  initAudio();
  if (ev.pointerType === 'mouse') {
    if (ev.button !== 0) return;
    mouse.active = true; mouse.down = true; touch.mode = false;
    setMouse(ev);
  } else touch.mode = true;
  if (game.state === 'title') {                       // clicking a difficulty button picks it instead of starting
    const rect = canvas.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * VIEW_W / rect.width, py = (ev.clientY - rect.top) * VIEW_H / rect.height;
    for (let i = 0; i < DIFFICULTIES.length; i++) {
      const b = difficultyButton(i);
      if (px >= b.x && px <= b.x + b.w && py >= b.y - 4 && py <= b.y + b.h + 4) { setDifficulty(i); mouse.down = false; return; }
    }
  }
  primaryAction();
});
canvas.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse') { mouse.active = true; setMouse(ev); } });
window.addEventListener('pointerup', ev => { if (ev.pointerType === 'mouse') mouse.down = false; });
canvas.addEventListener('contextmenu', ev => ev.preventDefault());
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

window.addEventListener('keydown', ev => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(ev.code)) ev.preventDefault();
  keys[ev.code] = true;
  if (ev.repeat) return;
  initAudio();
  switch (ev.code) {
    case 'Enter': primaryAction(); break;
    case 'KeyR': if (game.state === 'dead' || game.state === 'win') primaryAction(); break;
    case 'Space': if (game.state === 'playing') player.tryDash(); else if (game.state === 'title') primaryAction(); break;
    case 'Digit1': case 'Digit2': case 'Digit3':
      if (game.state === 'title') setDifficulty(Number(ev.code.slice(5)) - 1);
      break;
    case 'ArrowLeft': case 'ArrowRight':
      if (game.state === 'title') setDifficulty(game.difficulty + (ev.code === 'ArrowLeft' ? -1 : 1));
      break;
    case 'KeyE': useInteract(); break;
    case 'KeyQ': drinkPotion(); break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyM':
      audio.muted = !audio.muted;
      if (game.state === 'playing') toast(audio.muted ? 'Sound off' : 'Sound on', '#aaaaaa');
      break;
  }
});
window.addEventListener('keyup', ev => { keys[ev.code] = false; });

function setupJoystick(el, onMove) {
  const dot = el.firstElementChild, R = 46;
  let id = null;
  const handle = ev => {
    const rect = el.getBoundingClientRect();
    let dx = ev.clientX - (rect.left + rect.width / 2), dy = ev.clientY - (rect.top + rect.height / 2);
    const l = Math.hypot(dx, dy), m = Math.min(l, R);
    if (l > 0) { dx = dx / l * m; dy = dy / l * m; }
    dot.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onMove(dx / R, dy / R, true);
  };
  const end = ev => {
    if (ev.pointerId !== id) return;
    id = null;
    dot.style.transform = 'translate(-50%, -50%)';
    onMove(0, 0, false);
  };
  el.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    initAudio(); touch.mode = true;
    id = ev.pointerId;
    try { el.setPointerCapture(id); } catch (err) { /* synthetic pointer */ }
    handle(ev);
  });
  el.addEventListener('pointermove', ev => { if (ev.pointerId === id) handle(ev); });
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
setupJoystick(document.getElementById('joyL'), (x, y) => { touch.moveX = x; touch.moveY = y; });
setupJoystick(document.getElementById('joyR'), (x, y, on) => {
  touch.aimActive = on && Math.hypot(x, y) > 0.25;
  if (touch.aimActive) { touch.aimX = x; touch.aimY = y; }
});
function bindButton(id, fn) {
  document.getElementById(id).addEventListener('pointerdown', ev => { ev.preventDefault(); initAudio(); touch.mode = true; fn(); });
}
bindButton('btnDash', () => { if (game.state === 'playing') player.tryDash(); });
bindButton('btnPotion', drinkPotion);
bindButton('btnUse', useInteract);

// ============================================================
// MAIN LOOP
// ============================================================
function resize() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H, 2);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
  canvas.width = Math.round(VIEW_W * s * dpr);
  canvas.height = Math.round(VIEW_H * s * dpr);
  renderScale = canvas.width / VIEW_W;
}
window.addEventListener('resize', resize);
resize();
touch.mode = window.matchMedia('(pointer: coarse)').matches;

let lastTs = 0;
function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 1 / 30) || 0;
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
