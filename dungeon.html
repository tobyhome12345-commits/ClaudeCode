    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #05040a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; cursor: crosshair; touch-action: none; }
    #back-btn {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 999;
      padding: 0.3rem 0.8rem;
      background: rgba(13,13,26,0.82);
      color: #a8dadc;
      border: 1px solid #1a3a6a;
      border-radius: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      backdrop-filter: blur(6px);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    #back-btn:hover { background: rgba(168,218,220,0.12); border-color: #a8dadc; color: #fff; }

    /* ── Touch controls (touch devices only) ─────────────────── */
    #touch-ui { display: none; }
    .joy {
      position: fixed; bottom: 24px; z-index: 200;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      touch-action: none;
    }
    #joyL { left: 24px; }
    #joyR { right: 24px; border-color: rgba(255,150,80,0.4); }
    .joy .dot {
      position: absolute; top: 50%; left: 50%;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.35);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .tbtn {
      position: fixed; right: 24px; z-index: 200;
      width: 64px; height: 40px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      font: bold 11px 'Courier New', monospace;
      touch-action: none;

function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function buildSprite(rows, scale, flash) {
  const c = makeCanvas(rows[0].length * scale, rows.length * scale), g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      if (row[x] === '.') continue;
      g.fillStyle = flash ? '#ffffff' : PALETTE[row[x]];
      g.fillRect(x * scale, y * scale, scale, scale);
    }
  });
  return c;
}
const SPR = {}, SPR_FLASH = {};
for (const [name, def] of Object.entries(SPRITE_DATA)) {
  SPR[name] = buildSprite(def.rows, def.scale || PX, false);
  SPR_FLASH[name] = buildSprite(def.rows, def.scale || PX, true);
}

// Draws a pre-rendered sprite centred on (x, y).
function drawSprite(g, name, x, y, flip = 1, flash = false, sx = 1, sy = 1) {
  const img = (flash ? SPR_FLASH : SPR)[name];
  g.save();
  g.translate(Math.round(x), Math.round(y));
  g.scale(flip * sx, sy);
  g.drawImage(img, -img.width / 2, -img.height / 2);
  g.restore();
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;                // seeded per floor; cosmetic effects use Math.random
const rand = (a, b) => a + rng() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => rng() < p;
const pick = arr => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
function angleDiff(a, b) {
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function weightedPick(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let roll = rng() * total;
  for (const k in weights) { roll -= weights[k]; if (roll <= 0) return k; }
  return Object.keys(weights)[0];
}
function formatTime(sec) {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

const audio = { ctx: null, master: null, noiseBuf: null, muted: false };
function initAudio() {
  if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audio.ctx = new AC();
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.3;
    audio.master.connect(audio.ctx.destination);
    const len = Math.floor(audio.ctx.sampleRate * 0.5);
    audio.noiseBuf = audio.ctx.createBuffer(1, len, audio.ctx.sampleRate);
    const data = audio.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  } catch (err) { audio.ctx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.2, slideTo = 0, delay = 0) {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime + delay;
  const osc = audio.ctx.createOscillator(), gain = audio.ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audio.master);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, cutoff = 1200, delay = 0) {
  if (!audio.ctx || audio.muted) return;
  const t = audio.ctx.currentTime + delay;
  const src = audio.ctx.createBufferSource(), filter = audio.ctx.createBiquadFilter(), gain = audio.ctx.createGain();
  src.buffer = audio.noiseBuf;
  filter.type = 'lowpass'; filter.frequency.value = cutoff;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter); filter.connect(gain); gain.connect(audio.master);
  src.start(t); src.stop(t + dur + 0.02);
}

const idx = (x, y) => y * MAP_W + x;
const inBounds = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
const isSolidTile = t => t === T_WALL || t === T_PILLAR || t === T_GATE;

// 4-way flood fill; returns steps from (sx, sy) for every reachable tile, -1 elsewhere.
function bfs(tiles, sx, sy) {
  const out = new Int16Array(MAP_W * MAP_H).fill(-1);
  if (!inBounds(sx, sy)) return out;
  const queue = new Int32Array(MAP_W * MAP_H);
  let head = 0, tail = 0;
  out[idx(sx, sy)] = 0;
  queue[tail++] = idx(sx, sy);
  while (head < tail) {
    const c = queue[head++], cx = c % MAP_W, cy = (c / MAP_W) | 0, d = out[c] + 1;
    for (let k = 0; k < 4; k++) {
      const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (!inBounds(nx, ny)) continue;
      const n = idx(nx, ny);
      if (out[n] !== -1 || isSolidTile(tiles[n])) continue;
      out[n] = d;
      queue[tail++] = n;
    }
  }
  return out;
}

function makeRoom(x, y, w, h) {

  let x = a.cx, y = a.cy;
  const carve = () => {
    for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
      const i = idx(x + dx, y + dy);
      if (tiles[i] === T_WALL) tiles[i] = T_FLOOR;
    }

  const walkX = () => { while (x !== b.cx) { x += Math.sign(b.cx - x); carve(); } };
  const walkY = () => { while (y !== b.cy) { y += Math.sign(b.cy - y); carve(); } };
  carve();
  if (horizFirst) { walkX(); walkY(); } else { walkY(); walkX(); }
}

function tryGenerate(floor) {

  if (isBossFloor) {                                    // arena hugs one side so it has a single entrance
    const left = chance(0.5);
    const x = left ? 3 : MAP_W - ARENA_W - 3;
    rooms.push(makeRoom(x, randInt(3, MAP_H - ARENA_H - 4), ARENA_W, ARENA_H));
    if (left) minX = x + ARENA_W + 4; else maxX = x - 5;
  }
  const target = isBossFloor ? 6 : 7 + floor;
  for (let i = 0; i < 400 && rooms.length < target; i++) {
    const w = randInt(7, 12), h = randInt(6, 9);
    const x = randInt(minX, maxX - w + 1), y = randInt(2, MAP_H - h - 3);
    const room = makeRoom(x, y, w, h);
    if (rooms.some(o => roomsOverlap(room, o, 3))) continue;
    rooms.push(room);
  }
  if (rooms.length < target) return null;

  for (const r of rooms)
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) tiles[idx(x, y)] = T_FLOOR;

  // Connect every room to its nearest already-connected neighbour (a spanning tree).
  const order = isBossFloor ? rooms.slice(1).concat(rooms[0]) : rooms.slice();
  for (let k = 1; k < order.length; k++) {
    const a = order[k];
    let nearest = order[0], nd = Infinity;
    for (let j = 0; j < k; j++) {
      const d = dist(a.cx, a.cy, order[j].cx, order[j].cy);

    }
    carveCorridor(tiles, a, nearest, (isBossFloor && a === rooms[0]) || chance(0.5));   // arena exits through its side wall
  }
  // A couple of extra links so the map has loops (never through the arena).
  const loopPool = isBossFloor ? rooms.slice(1) : rooms;
  for (let k = 0; k < 2; k++) {
    const a = pick(loopPool), b = pick(loopPool);
    if (a !== b) carveCorridor(tiles, a, b, chance(0.5));
  }

  // Start / exit are as far apart as the map allows.
  const anchor = rooms[0];
  const distMap = bfs(tiles, anchor.cx, anchor.cy);
  let far = null, farD = -1;
  for (const r of rooms) {
    const d = distMap[idx(r.cx, r.cy)];

  // One quiet room per floor belongs to the merchant (on the final floor the merchant waits at the start).
  let shopRoom = start;
  if (!isBossFloor) { shopRoom = pick(rooms.filter(r => r.kind === 'normal')); shopRoom.kind = 'shop'; }

  // Pillars: single tiles with open floor on all 8 sides, so they can never block a path.
  for (const r of rooms) {
    if (r === start || r === shopRoom) continue;
    const inset = r.kind === 'boss' ? 3 : 2;
    if (r.kind !== 'boss' && !(r.w >= 9 && r.h >= 7 && chance(0.6))) continue;
    for (const [px, py] of [[r.x + inset, r.y + inset], [r.x + r.w - 1 - inset, r.y + inset],

  }

  // Wall torches along the top wall of each room.
  const torches = [];
  for (const r of rooms) {
    const spots = [r.x + 2, r.x + r.w - 3];
    if (r.w >= 11) spots.push(r.cx);
    for (const tx of spots) {
      if (tiles[idx(tx, r.y - 1)] !== T_WALL) continue;
      torches.push({ tx, ty: r.y - 1, x: tx * TILE + TILE / 2, y: (r.y - 1) * TILE + 14, seed: Math.random() * 10 });
    }
  }
  return { tiles, explored: new Uint8Array(MAP_W * MAP_H), rooms, start, exitRoom, bossRoom, shopRoom, merchant: null, torches, gates: [] };
}

function generateFloor(floor) {
  for (let attempt = 0; attempt < 200; attempt++) {
    const d = tryGenerate(floor);
    if (d) return d;
  }
  throw new Error('Dungeon generation failed');
}

function roomAt(tx, ty) {
  for (const r of dungeon.rooms)
    if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h) return r;
  return null;
}

// Random open tile inside a room that is not on top of anything in `avoid`.
function freeSpot(room, avoid) {
  for (let i = 0; i < 60; i++) {
    const tx = randInt(room.x + 1, room.x + room.w - 2), ty = randInt(room.y + 1, room.y + room.h - 2);
    if (dungeon.tiles[idx(tx, ty)] !== T_FLOOR) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (avoid.some(o => dist(o.x, o.y, x, y) < 30)) continue;
    return { x, y };
  }
  return { x: room.cx * TILE + TILE / 2 + TILE, y: room.cy * TILE + TILE / 2 };
}

// Random floor tile hugging one of the room's walls (never a doorway), for pots.
function wallSpot(room, avoid) {
  for (let i = 0; i < 30; i++) {
    let tx, ty, ox = 0, oy = 0;
    if (chance(0.5)) { tx = randInt(room.x, room.x + room.w - 1); oy = chance(0.5) ? -1 : 1; ty = oy < 0 ? room.y : room.y + room.h - 1; }
    else { ty = randInt(room.y, room.y + room.h - 1); ox = chance(0.5) ? -1 : 1; tx = ox < 0 ? room.x : room.x + room.w - 1; }
    if (dungeon.tiles[idx(tx, ty)] !== T_FLOOR || dungeon.tiles[idx(tx + ox, ty + oy)] !== T_WALL) continue;
    const x = tx * TILE + TILE / 2, y = ty * TILE + TILE / 2;
    if (avoid.some(o => dist(o.x, o.y, x, y) < 30)) continue;
    return { x, y };
  }
  return null;
}

// The merchant stands at the back of the room with three priced goods laid out in front.
function stockShop(room, floor) {
  const cx = room.cx * TILE + TILE / 2, cy = room.cy * TILE + TILE / 2;
  dungeon.merchant = { x: cx, y: cy - TILE * 2 };
  const rarity = chance(SHOP_EPIC_ODDS[floor - 1]) ? 2 : 1;
  let type = pick(WEAPON_KEYS);
  if (type === player.weapon.type && rarity <= player.weapon.rarity) type = pick(WEAPON_KEYS.filter(k => k !== type));
  const goods = [
    { kind: 'potion', price: SHOP_PRICES.potion },
    { kind: 'relic', relic: pick(RELIC_KEYS), price: SHOP_PRICES.relic },
    { kind: 'weapon', weapon: { type, rarity }, price: SHOP_PRICES.weapon[rarity] },
  ];
  goods.forEach((g, i) => items.push(Object.assign(
    { x: cx + (i - 1) * TILE * 2, y: cy + TILE * 2, r: 5, vx: 0, vy: 0, age: 1, dead: false, seed: i * 2 }, g)));
}

function populateFloor(floor) {
  enemies = []; bullets = []; items = []; chests = []; props = []; particles = []; numbers = []; slashes = []; spawnQueue = [];
  const combatRooms = shuffle(dungeon.rooms.filter(r => r.kind === 'normal'));
  const isBossFloor = floor === FINAL_FLOOR;
  let chestCount = 0;

  for (const room of dungeon.rooms) {
    const placed = [];
    const cxp = room.cx * TILE + TILE / 2, cyp = room.cy * TILE + TILE / 2;
    if (room === dungeon.shopRoom) stockShop(room, floor);
    if (room.kind === 'shop') continue;
    if (room.kind === 'start') {
      if (isBossFloor) chests.push({ x: cxp + TILE * 2, y: cyp, opened: false, loot: 'any', potion: true });
      continue;
    }
    if (room.kind === 'boss') {
      const boss = createEnemy('boss', cxp, cyp, floor, room);
      boss.state = 'idle'; boss.invuln = true; boss.cr = BOSS_COLLIDE_R; boss.phase2 = false;
      boss.volley = 0; boss.dir = 0; boss.spin = 0; boss.shotT = 0; boss.lastAttack = '';
      boss.avoidT = 0; boss.avoidX = 0; boss.avoidY = 0;
      enemies.push(boss);
      continue;
    }
    if (room.kind === 'exit') placed.push({ x: cxp, y: cyp });
    // First two shuffled rooms always hold a chest: one weapon, one relic.
    const order = combatRooms.indexOf(room);
    if (room.kind === 'normal' && (order < 2 || chance(0.35))) {
      const spot = freeSpot(room, placed);
      placed.push(spot);
      chests.push({ x: spot.x, y: spot.y, opened: false, loot: order === 0 ? 'weapon' : order === 1 ? 'relic' : 'any', potion: chance(CHEST_POTION_CHANCE) });
      chestCount++;

    const area = (room.w - 2) * (room.h - 2);
    const count = clamp(Math.round(area / 13) + floor - 1, 2, 7);
    for (let i = 0; i < count; i++) {
      const spot = freeSpot(room, placed);
      placed.push(spot);
      enemies.push(createEnemy(weightedPick(SPAWN_WEIGHTS[floor - 1]), spot.x, spot.y, floor, room));
    }
    for (let i = randInt(POTS_PER_ROOM[0], POTS_PER_ROOM[1]); i > 0; i--) {
      const spot = wallSpot(room, placed);
      if (!spot) continue;
      placed.push(spot);
      props.push({ x: spot.x, y: spot.y, dead: false });
    }

    const e = pick(enemies.filter(o => o.type !== 'boss'));
    e.elite = true;
    e.hp = e.maxHp = Math.round(e.maxHp * ELITE_HP_MUL);
    e.dmg = Math.round(e.dmg * ELITE_DMG_MUL);

}

// ============================================================
// DUNGEON ART
// The whole floor is painted once into mapArt. Each tile is copied into mapSeen when it is first
// explored, so drawing the dungeon every frame is a single blit.
// ============================================================
const ART = 2;                                        // screen pixels per environment art pixel
const TP = TILE / ART;                                // art pixels per tile
const mapArt = makeCanvas(MAP_W * TILE, MAP_H * TILE), actx = mapArt.getContext('2d');

let artRng = Math.random;

// Lightens (amt > 0) or darkens (amt < 0) a #rrggbb colour.
function shade(hex, amt) {

function paintFloor(tx, ty) {
  const th = theme(), x = tx * TP, y = ty * TP, r = artRng;
  ap(x, y, TP, TP, shade(th.floor, (r() - 0.5) * 0.12));
  ap(x, y, TP, 1, shade(th.floor, 0.08)); ap(x, y, 1, TP, shade(th.floor, 0.05));      // lit edges
  ap(x, y + TP - 1, TP, 1, th.line); ap(x + TP - 1, y, 1, TP, th.line);                // grout
  const roll = r();
  if (roll < 0.14) {                                  // four small slabs
    ap(x, y + 7, TP, 1, th.line); ap(x + 7, y, 1, TP, th.line);
    ap(x + 8, y + 8, 7, 1, shade(th.floor, 0.08)); ap(x, y + 8, 7, 1, shade(th.floor, 0.08));
  } else if (roll < 0.22) {                           // crack
    let cx = x + 4 + Math.floor(r() * 6), cy = y + 2;
    for (let i = 0; i < 10; i++) { ap(cx, cy++, 1, 1, th.line); if (r() < 0.55) cx = clamp(cx + (r() < 0.5 ? -1 : 1), x + 1, x + TP - 3); }
  } else if (roll < 0.30) {                           // pebbles

      const px = x + 2 + Math.floor(r() * 11), py = y + 2 + Math.floor(r() * 10);
      ap(px, py, 2, 1, shade(th.floor, 0.25)); ap(px, py + 1, 2, 1, th.line);
    }
  }
  for (let i = 0; i < 4; i++) ap(x + 1 + Math.floor(r() * 13), y + 1 + Math.floor(r() * 13), 1, 1, shade(th.floor, r() < 0.5 ? 0.1 : -0.14));
  const extra = r();
  if (game.floor === 1 && extra < 0.015) {            // an old bone
    const px = x + 3 + Math.floor(r() * 7), py = y + 4 + Math.floor(r() * 8);
    ap(px, py, 5, 1, '#ead4aa'); ap(px - 1, py - 1, 1, 3, '#ead4aa'); ap(px + 5, py - 1, 1, 3, '#ead4aa'); ap(px, py + 1, 5, 1, 'rgba(0,0,0,0.3)');
  } else if (game.floor === 2 && extra < 0.2) {       // moss
    const mx = x + 2 + Math.floor(r() * 10), my = y + 2 + Math.floor(r() * 10);
    for (let i = 0; i < 9; i++) ap(mx + Math.floor(r() * 5) - 2, my + Math.floor(r() * 4) - 1, 1 + Math.floor(r() * 2), 1, r() < 0.2 ? '#63c74d' : r() < 0.5 ? '#3e8948' : '#265c42');
  } else if (game.floor === 2 && extra < 0.24) {      // puddle
    const px = x + 3 + Math.floor(r() * 4), py = y + 5 + Math.floor(r() * 5);
    ap(px + 1, py, 6, 1, '#193c3e'); ap(px, py + 1, 8, 2, '#193c3e'); ap(px + 1, py + 3, 6, 1, '#193c3e'); ap(px + 2, py + 1, 3, 1, '#3e8948');
  } else if (game.floor === 3 && extra < 0.08) {      // glowing crack
    let cx = x + 2, cy = y + 4 + Math.floor(r() * 8);
    for (let i = 0; i < 11; i++) { ap(cx, cy + 1, 1, 1, '#a22633'); ap(cx, cy, 1, 1, i % 3 ? '#f77622' : '#feae34'); cx++; if (r() < 0.5) cy = clamp(cy + (r() < 0.5 ? -1 : 1), y + 2, y + TP - 4); }
  } else if (game.floor === 3 && extra < 0.12) {      // ash
    for (let i = 0; i < 7; i++) ap(x + 3 + Math.floor(r() * 9), y + 6 + Math.floor(r() * 6), 1, 1, r() < 0.5 ? '#5a6988' : '#262b44');
  }
}

function paintStairs(tx, ty) {
  const th = theme(), x = tx * TP, y = ty * TP;
  ap(x, y, TP, TP, th.line); ap(x + 1, y + 1, 14, 14, shade(th.floor, 0.28)); ap(x + 2, y + 2, 12, 12, '#05040a');
  for (let i = 0; i < 6; i++) { ap(x + 2, y + 2 + i * 2, 12, 2, shade(th.floor, 0.1 - i * 0.2)); ap(x + 2, y + 2 + i * 2, 12, 1, shade(th.floor, 0.3 - i * 0.2)); }
  ap(x + 2, y + 2, 1, 12, 'rgba(0,0,0,0.35)'); ap(x + 13, y + 2, 1, 12, 'rgba(0,0,0,0.35)');
}

function paintGate(tx, ty) {
  const x = tx * TP, y = ty * TP;
  ap(x, y, TP, TP, 'rgba(0,0,0,0.45)');
  for (const bx of [1, 4, 7, 10, 13]) { ap(x + bx, y, 2, TP, '#181425'); ap(x + bx, y, 1, TP - 1, '#8b9bb4'); ap(x + bx, y + TP - 2, 2, 2, '#c0cbdc'); }
  for (const by of [3, 10]) { ap(x, y + by, TP, 2, '#181425'); ap(x, y + by, TP, 1, '#5a6988'); }
}

// Soft shadows where the floor meets a wall.
function paintShadows(tx, ty) {
  const x = tx * TP, y = ty * TP;
  if (!openAt(tx, ty - 1)) [0.4, 0.32, 0.24, 0.15, 0.07].forEach((a, i) => ap(x, y + i, TP, 1, `rgba(0,0,0,${a})`));
  if (!openAt(tx - 1, ty)) [0.28, 0.13].forEach((a, i) => ap(x + i, y, 1, TP, `rgba(0,0,0,${a})`));
  if (!openAt(tx + 1, ty)) [0.28, 0.13].forEach((a, i) => ap(x + TP - 1 - i, y, 1, TP, `rgba(0,0,0,${a})`));
  if (!openAt(tx, ty + 1)) ap(x, y + TP - 1, TP, 1, 'rgba(0,0,0,0.22)');
}

function paintWall(tx, ty) {

  const L = openAt(tx - 1, ty), R = openAt(tx + 1, ty), U = openAt(tx, ty - 1), rimDark = shade(th.rim, -0.35);
  if (isFaceTile(tx, ty)) {

        const x0 = Math.max(bx, 0), x1 = Math.min(bx + 7, TP);
        if (x1 <= x0) continue;
        const tone = (r() - 0.5) * 0.2;

    }

    ap(x, y + 3, TP, 1, th.rim); ap(x, y + 4, TP, 1, rimDark);
    if (U) ap(x, y, TP, 1, th.rim);
    if (L) { ap(x, y, 1, 4, th.rim); ap(x, y + 5, 1, 11, 'rgba(0,0,0,0.3)'); }
    if (R) { ap(x + TP - 1, y, 1, 4, th.rim); ap(x + TP - 1, y + 5, 1, 11, 'rgba(0,0,0,0.3)'); }
    const roll = r();
    if (roll < 0.09) {                                // cracked bricks

      }
    } else if (game.floor === 3 && roll < 0.2) {      // ember seams

    } else if (game.floor !== 2 && roll < 0.16) {     // rusty chain

  if (U) { ap(x, y, TP, 1, th.rim); ap(x, y + 1, TP, 1, rimDark); }
  const sideTop = (ox) => isFaceTile(tx + ox, ty) ? 4 : 0;     // beside a brick front the edge starts under the lip

  if (!U && !R && openAt(tx + 1, ty - 1)) ap(x + TP - 1, y, 1, 1, th.rim);

}

// A rune circle of single art pixels, centred on a tile centre.
function paintCircle(wx, wy, radius, color, dash) {
  const cx = wx / ART, cy = wy / ART, steps = Math.ceil(radius * 7);
  for (let i = 0; i < steps; i++) {
    if (dash && Math.floor(i / dash) % 2) continue;
    const a = i / steps * TAU, px = Math.round(cx + Math.cos(a) * radius), py = Math.round(cy + Math.sin(a) * radius);

    for (let k = 0; k < 8; k++) {

  }

function copyTile(i) {

// Repaints one floor-level tile after it changes (boss gates opening and closing).

function paintDungeon() {
  const d = dungeon;
  artRng = mulberry32(game.seed * 31 + game.floor);

      if (near) paintWall(tx, ty);

    const x = t.tx * TP + 7, y = t.ty * TP;

  }

// Stains the floor where something died or broke. Only ever marks plain floor tiles.
function splat(wx, wy, colors, count, spread) {
  const touched = new Set();
  actx.globalAlpha = 0.6;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU, dd = Math.sqrt(Math.random()) * spread;
    const px = Math.floor((wx + Math.cos(a) * dd) / ART), py = Math.floor((wy + Math.sin(a) * dd * 0.7) / ART);
    const tx = Math.floor(px / TP), ty = Math.floor(py / TP);
    if (tileAt(tx, ty) !== T_FLOOR) continue;
    ap(px, py, 1 + (Math.random() < 0.4 && px % TP < TP - 1 ? 1 : 0), 1, colors[Math.floor(Math.random() * colors.length)]);
    touched.add(idx(tx, ty));
