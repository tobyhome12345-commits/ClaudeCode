<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bunker 9: The Quiet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gochi+Hand&family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: one-screen field terminal. Stencil header + live sound-meter strip, a scrolling field log, and a docked choice keypad with a command line. */
:root{
  --bg:#0e1216; --panel:#151b21; --panel-2:#1b232b; --line:#29343f; --line-2:#3c4a57;
  --fg:#ebe6da; --muted:#929ca7; --faint:#5f6a75;
  --amber:#f3a83b; --amber-ink:#1b1306; --amber-soft:rgba(243,168,59,.13);
  --hum:#b4a7ff; --hum-soft:rgba(180,167,255,.12);
  --danger:#ff6d5f; --ok:#7bd69a;
  --c-mop:#5fd6c6; --c-vendr:#ff92c8; --c-bert:#f2df74; --c-varga:#ffa06f; --c-pip:#a8df74; --c-tape:#d6ceff;
  --sticky-bg:#f0d470; --sticky-ink:#2b2306; --slate:#22302b; --slate-ink:#eef0e6; --shadow:rgba(0,0,0,.35);
  --f-display:"Saira Stencil One","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-hand:"Gochi Hand","Comic Sans MS","Bradley Hand",cursive;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7eaed; --panel:#f6f7f8; --panel-2:#eceff2; --line:#c6cdd4; --line-2:#a7b1bb;
    --fg:#17202a; --muted:#53606b; --faint:#86919b;
    --amber:#a65600; --amber-ink:#fff7ea; --amber-soft:rgba(166,86,0,.10);
    --hum:#5842d2; --hum-soft:rgba(88,66,210,.08);
    --danger:#c73326; --ok:#1c7a3c;
    --c-mop:#0a776a; --c-vendr:#b42e6e; --c-bert:#7f6100; --c-varga:#b3461a; --c-pip:#3b7413; --c-tape:#4a3eb2;
    --sticky-bg:#f4dc7e; --sticky-ink:#2b2306; --slate:#2b3a33; --slate-ink:#eef0e6; --shadow:rgba(20,30,40,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e7eaed; --panel:#f6f7f8; --panel-2:#eceff2; --line:#c6cdd4; --line-2:#a7b1bb;
  --fg:#17202a; --muted:#53606b; --faint:#86919b;
  --amber:#a65600; --amber-ink:#fff7ea; --amber-soft:rgba(166,86,0,.10);
  --hum:#5842d2; --hum-soft:rgba(88,66,210,.08);
  --danger:#c73326; --ok:#1c7a3c;
  --c-mop:#0a776a; --c-vendr:#b42e6e; --c-bert:#7f6100; --c-varga:#b3461a; --c-pip:#3b7413; --c-tape:#4a3eb2;
  --sticky-bg:#f4dc7e; --sticky-ink:#2b2306; --slate:#2b3a33; --slate-ink:#eef0e6; --shadow:rgba(20,30,40,.14);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
.app{height:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;flex-direction:column;min-width:0}
.logo{font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:.03em;white-space:nowrap}
.logo b{font-weight:400;color:var(--amber)}
.sub{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tool{text-decoration:none;font:500 12px/1 var(--f-mono);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--fg)}
.tool:hover:not(:disabled){border-color:var(--amber)}
.tool:disabled{opacity:.38;cursor:default}
.tool[aria-pressed="false"] .ic{filter:grayscale(1);opacity:.6}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* sound meter */
.scope{position:relative;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;transition:border-color .2s}
.scope.hurt{border-color:var(--danger)}
.scope canvas{display:block;width:100%;height:100%}
.scope .lbl{position:absolute;top:50%;transform:translateY(-50%);font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--muted);background:var(--panel);padding:4px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
#dbl{left:6px} #clk{right:6px;color:var(--amber)}

/* log */
.log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 18px;position:relative}
.turn{padding-block:14px;border-bottom:1px dashed var(--line)}
.turn:last-child{border-bottom:0}
.turn.old{opacity:.6}
.turn.old .status{display:none}
.echo{font:500 14px/1.4 var(--f-mono);color:var(--amber);margin-bottom:8px;overflow-wrap:anywhere}
.turn p{margin:.45em 0;max-width:66ch}
.turn strong{font-weight:700}
.say{display:flex;gap:10px;align-items:baseline;margin:.6em 0;max-width:72ch}
.say .tag{flex:none;font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid currentColor;border-radius:4px;color:var(--who);position:relative;top:-2px;white-space:nowrap}
.say .line{min-width:0}
.c-mop{--who:var(--c-mop)} .c-vendr{--who:var(--c-vendr)} .c-bert{--who:var(--c-bert)} .c-varga{--who:var(--c-varga)} .c-pip{--who:var(--c-pip)} .c-hum{--who:var(--hum)} .c-tape{--who:var(--c-tape)}
.c-hum .tag{background:var(--hum-soft)}
.c-hum .line{color:var(--hum)}
.c-tape .line{color:var(--c-tape);font-style:italic}
.c-pip .line{font-family:var(--f-hand);font-size:1.15em;text-transform:uppercase;letter-spacing:.02em}
.note{font:500 13px/1.4 var(--f-mono);color:var(--muted);margin:.3em 0}
.note.up{color:var(--ok)} .note.down{color:var(--danger)} .note.item{color:var(--amber)} .note.meet{color:var(--hum)} .note.interp{color:var(--faint)}
.intro{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-bottom:6px}
.intro-name{font-family:var(--f-display);font-size:26px;line-height:1}
.intro-skill{font:500 13px/1.3 var(--f-mono);color:var(--amber)}
.intro-skill small{color:var(--muted)}
.scratch{font-family:var(--f-display);font-size:21px;letter-spacing:.07em;line-height:1.3;padding:12px 16px;border:1px dashed var(--line-2);border-radius:4px;background:var(--panel-2);transform:rotate(-1deg);width:fit-content;max-width:100%;margin:.7em 0}
.sticky{font-family:var(--f-hand);font-size:20px;line-height:1.3;background:var(--sticky-bg);color:var(--sticky-ink);padding:10px 14px;width:fit-content;max-width:100%;transform:rotate(1.2deg);box-shadow:0 3px 0 var(--shadow);margin:.8em 0}
.chalk{font-family:var(--f-hand);font-size:19px;line-height:1.5;background:var(--slate);color:var(--slate-ink);padding:12px 16px;border-radius:6px;margin:.7em 0;max-width:62ch;text-transform:uppercase}
.riddle{font-style:italic;font-size:1.08em;line-height:1.6;padding:12px 16px;border:1px dashed var(--amber);border-radius:6px;background:var(--amber-soft);margin:.7em 0;width:fit-content;max-width:100%}
.margin{font-family:var(--f-hand);font-size:19px;line-height:1.4;padding:12px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;margin:.7em 0;max-width:60ch}
.quote{font-style:italic;font-size:1.04em;padding:6px 0 6px 18px;border-left:3px solid var(--line-2);margin:.7em 0;max-width:60ch}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin:.7em 0}
.labels span{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;padding:6px 9px;border:1px solid var(--hum);color:var(--hum);border-radius:999px;background:var(--hum-soft)}
.honk{font-family:var(--f-display);font-size:54px;line-height:1;color:var(--c-bert);margin:.15em 0;display:inline-block;animation:shake .45s 2}
.silence{font:500 15px/1 var(--f-mono);color:var(--faint);padding:14px 20px;border:1px dashed var(--line-2);border-radius:18px;width:fit-content;letter-spacing:.5em;margin:.6em 0}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}

/* status bar */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
.st-loc{font-family:var(--f-display);font-size:15px;color:var(--fg);letter-spacing:.05em}
.st-hp{color:var(--danger);letter-spacing:2px;font-size:14px}
.st-hp .off{color:var(--line-2)}
.st-items{color:var(--fg);overflow-wrap:anywhere}
.st-items sub{font-size:9px;color:var(--muted)}
.st-items .none{color:var(--faint)}
.st-trust{display:inline-flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.tm{display:inline-flex;align-items:center;gap:5px;color:var(--who)}
.tm .bars{display:inline-flex;gap:2px}
.tm i{width:6px;height:10px;border-radius:1px;background:var(--line-2)}
.tm i.on{background:var(--who)}

/* dock */
.dock{border-top:1px solid var(--line);padding-block:10px 12px;background:var(--bg)}
.ask{font:600 10.5px/1 var(--f-mono);letter-spacing:.16em;color:var(--muted);margin:0 0 8px}
.choices{display:grid;gap:6px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font:400 16px/1.35 var(--f-body);cursor:pointer;transition:border-color .12s,background .12s;color:var(--fg)}
.choice:hover{border-color:var(--amber);background:var(--panel-2)}
.choice .k{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--amber);color:var(--amber-ink);font:600 13px/1 var(--f-mono);box-shadow:inset 0 -2px 0 var(--shadow)}
.choice .t{min-width:0}
.choice .sk{margin-left:auto;flex:none;font:600 9.5px/1 var(--f-mono);letter-spacing:.12em;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:3px 5px}
.prompt{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:4px 4px 4px 12px}
.prompt:focus-within{border-color:var(--amber)}
.caret{font:600 16px/1 var(--f-mono);color:var(--amber)}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 15px/1.4 var(--f-mono);padding:9px 0;color:var(--fg)}
#in::placeholder{color:var(--faint)}
.go{font:600 12px/1 var(--f-mono);letter-spacing:.08em;background:var(--amber);color:var(--amber-ink);border:0;border-radius:6px;padding:10px 12px;cursor:pointer}

/* cards in the log */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:.6em 0;max-width:100%}
.card h3{font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.05em;margin:0 0 10px}
.card p{margin:.4em 0}
.muted{color:var(--muted)} .small{font-size:.86em}
.fl{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.inv-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12.5px/1.4 var(--f-mono);color:var(--muted);margin-bottom:12px}
.inv-meta b{color:var(--fg)}
.inv-list{display:grid;gap:10px}
.inv-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start}
.inv-row .ie{font-size:20px;line-height:1.2}
.inv-row b{display:block}
.inv-row small{display:block;color:var(--muted);font-size:.86em;line-height:1.4}
.mini{font:600 10.5px/1 var(--f-mono);letter-spacing:.08em;padding:7px 9px;border-radius:6px;border:1px solid var(--amber);background:var(--amber-soft);color:var(--amber);cursor:pointer;white-space:nowrap}
.inv-notes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.nchip{font:500 12px/1 var(--f-mono);padding:6px 8px;border-radius:6px;border:1px dashed var(--line-2);color:var(--faint)}
.nchip.have{border-style:solid;border-color:var(--amber);color:var(--amber)}
.nchip.placed{border-style:solid;border-color:var(--ok);color:var(--ok)}
.zone{margin-top:12px}
.zone:first-of-type{margin-top:0}
.zone .fl{margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:7px;padding:7px 8px;min-height:50px;font:500 12px/1.25 var(--f-mono);background:var(--panel-2);display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.cell .ce{font-size:16px}
.cell.here{border-color:var(--amber);background:var(--amber-soft)}
.cell.here::after{content:"YOU ARE HERE";font-size:9px;letter-spacing:.12em;color:var(--amber)}
.cell.fog{border-style:dashed;color:var(--faint);background:transparent}
.cell.empty{visibility:hidden}
.zone.unknown .cell{display:none}
.save-code{display:block;width:100%;font:500 13px/1.45 var(--f-mono);padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--fg);word-break:break-all;resize:none;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.help-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.95em}
.help-grid code{font:600 13px/1.4 var(--f-mono);color:var(--amber)}

/* title */
.title{padding-block:18px 8px}
.t-kicker{font:500 11px/1.3 var(--f-mono);letter-spacing:.18em;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:400;font-size:clamp(52px,13vw,92px);line-height:.88;margin:.12em 0 .18em;letter-spacing:.01em}
.big span{display:block;font-size:.38em;color:var(--amber);letter-spacing:.14em;margin-top:.2em}
.t-lede{font-size:1.08em;max-width:58ch;margin:.4em 0 .8em}
.t-rules{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px 18px;font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.t-rules b{color:var(--fg)}
.t-form{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.t-form input,.t-loadrow input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:400 16px/1.3 var(--f-body);color:var(--fg)}
.t-form input:focus,.t-loadrow input:focus{border-color:var(--amber);outline:0}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.skill,.cat{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--fg)}
.skill:hover,.cat:hover{border-color:var(--amber)}
.skill[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.skill .se,.cat .se{font-size:22px}
.skill b,.cat b{display:block;font-size:15px}
.skill small,.cat small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.cmap{display:grid;gap:8px;padding:12px;border:1px dashed var(--amber);border-radius:10px}
.cmap p{margin:0}
.start{justify-self:start;font-family:var(--f-display);font-size:22px;letter-spacing:.06em;background:var(--amber);color:var(--amber-ink);border:0;border-radius:9px;padding:12px 22px;cursor:pointer;box-shadow:inset 0 -3px 0 var(--shadow)}
.t-err{margin:0;font:500 13px/1.4 var(--f-mono);color:var(--danger);min-height:1em}
.t-load{margin-top:14px}
.t-load summary{cursor:pointer;font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.t-loadrow{display:flex;gap:8px;margin-top:10px}
.t-ends{margin-top:18px}
.eg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.eg div{border:1px dashed var(--line-2);border-radius:7px;padding:8px;font:500 11px/1.3 var(--f-mono);color:var(--faint);min-height:52px;display:flex;flex-direction:column;gap:3px}
.eg div.got{border-style:solid;border-color:var(--amber);color:var(--fg);background:var(--amber-soft)}
.eg .ee{font-size:16px}

/* endings */
.ending{margin-top:14px;padding:20px;border:1px solid var(--amber);border-radius:12px;background:var(--panel)}
.end-kicker{font:600 11px/1.3 var(--f-mono);letter-spacing:.16em;color:var(--amber)}
.end-emoji{font-size:44px;line-height:1;margin-top:10px}
.end-title{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,46px);line-height:1;margin:.15em 0 .5em;letter-spacing:.02em;text-wrap:balance}
.end-epi{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.end-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font:500 12.5px/1.4 var(--f-mono);color:var(--muted)}
.end-stats b{color:var(--fg)}

@media (max-width:620px){
  body{font-size:16px}
  .tool .lb{display:none}
  .tool{padding:7px}
  .tools{flex-wrap:nowrap;gap:4px;flex:none}
  .brand{flex:1}
  .logo{font-size:22px}
  .sub{font-size:9.5px;letter-spacing:.12em}
  .choice{padding:7px 10px;font-size:15px;gap:10px}
  .choice .k{width:24px;height:24px}
  .scope{height:32px}
  .eg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .say{flex-direction:column;gap:4px}
  .honk{font-size:44px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">BUNKER <b>9</b></div>
      <div class="sub">THE QUIET · HUSHWELL ACOUSTICS</div>
    </div>
    <nav class="tools" aria-label="Game commands">
      <a class="tool" id="hublink" href="index.html" title="Back to the arcade"><span class="ic">←</span><span class="lb">Arcade</span></a>
      <button class="tool" type="button" data-cmd="inventory" title="Inventory (type: inventory)"><span class="ic">🎒</span><span class="lb">Inventory</span></button>
      <button class="tool" type="button" data-cmd="map" title="Map (type: map)"><span class="ic">🗺️</span><span class="lb">Map</span></button>
      <button class="tool" type="button" data-cmd="hint" title="Hint (type: hint)"><span class="ic">💡</span><span class="lb">Hint</span></button>
      <button class="tool" type="button" data-cmd="save" title="Save (type: save)"><span class="ic">💾</span><span class="lb">Save</span></button>
      <button class="tool" type="button" id="snd" aria-pressed="true" title="Sound on/off"><span class="ic">🔊</span><span class="lb">Sound</span></button>
    </nav>
  </header>
  <div class="scope" id="scopebox" aria-hidden="true">
    <canvas id="scope"></canvas>
    <span class="lbl" id="dbl">AMBIENT 38 dB</span>
    <span class="lbl" id="clk">03:17</span>
  </div>
  <main class="log" id="log" aria-live="polite"></main>
  <footer class="dock" id="dock" hidden>
    <div class="ask" id="ask">WHAT DO YOU DO?</div>
    <div class="choices" id="choices"></div>
    <form class="prompt" id="cmd" autocomplete="off">
      <label class="caret" for="in">&gt;</label>
      <input id="in" maxlength="80" placeholder="Type your own action… or: inventory, map, hint, save" enterkeyhint="go">
      <button class="go" type="submit">DO IT</button>
    </form>
  </footer>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   DOM
   ===================================================================== */
const logEl = document.getElementById('log');
const choicesEl = document.getElementById('choices');

/* =====================================================================
   OUTPUT HELPERS
   ===================================================================== */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return String(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }
function N(){ return esc(G.name).replace(/\*/g,'&#42;'); }
function NU(){ return esc(G.name.toUpperCase()).replace(/\*/g,'&#42;'); }
function add(cls, html, tag){ const el = document.createElement(tag || 'div'); if (cls) el.className = cls; el.innerHTML = html; curTurn.appendChild(el); return el; }
function p(s){ add('', fmt(s), 'p'); }
function note(s, cls){ add('note ' + (cls || ''), s); }
function say(who, s){ add('say c-' + who, `<span class="tag">${esc(tagName(who))}</span><span class="line">${fmt(s)}</span>`); }
function chalk(s){ add('chalk', fmt(s)); }
function sticky(s){ add('sticky', fmt(s)); }
function riddle(s){ add('riddle', s); }
function tagName(who){
  if (who === 'hum') return (F.humWhat ? 'The Hum' : '???') + ' · your voice';
  if (who === 'tape') return 'Tape · your voice';
  return charName(who);
}
function charName(w){
  if (w === 'bert') return (F.sawBand || F.bTalk) ? 'Bertrand' : 'The Goose';
  if (w === 'hum') return F.humWhat ? 'The Hum' : '??? (your voice)';
  return CHARS[w].name;
}
function shortName(w){
  return { mop:'MOP', vendr:'VEND-R', bert:(F.sawBand || F.bTalk) ? 'BERTRAND' : 'GOOSE', varga:'VARGA', hum:F.humWhat ? 'HUM' : '???', pip:'PIP' }[w];
}

/* =====================================================================
   STATE HELPERS
   ===================================================================== */
function has(id){ return (G.inv[id] || 0) > 0; }
function itemName(id){ const n = ITEMS[id].n; return typeof n === 'function' ? n() : n; }
function give(id, n){ n = n || 1; G.inv[id] = (G.inv[id] || 0) + n; note(`+ ${ITEMS[id].e} ${esc(itemName(id))}${n > 1 ? ' ×' + n : ''}`, 'item'); }
function take(id, n){ const left = (G.inv[id] || 0) - (n || 1); if (left > 0) G.inv[id] = left; else delete G.inv[id]; }
function tok(n){ G.tok += n; note(n > 0 ? `+ 🪙 Bunker Token${n > 1 ? ' ×' + n : ''}` : `− 🪙 ${-n} token${n < -1 ? 's' : ''}`, n > 0 ? 'item' : ''); }
function meet(who, start){
  if (G.trust[who] === undefined){ G.trust[who] = start; note(`👋 New contact: ${esc(charName(who))} · trust meter added`, 'meet'); }
}
function meetHum(){ meet('hum', 0); }
function tr(who, d){
  if (G.trust[who] === undefined) G.trust[who] = 0;
  const before = G.trust[who];
  G.trust[who] = Math.max(0, Math.min(5, before + d));
  const diff = G.trust[who] - before;
  if (diff > 0) note(`🤝 ${esc(charName(who))} trust ${'▲'.repeat(diff)}`, 'up');
  else if (diff < 0) note(`💔 ${esc(charName(who))} trust ${'▼'.repeat(-diff)}`, 'down');
}
function hurt(n, why){
  G.hp = Math.max(0, G.hp - n);
  note(`♥ −${n} ${esc(why || '')}`, 'down');
  scopeBox.classList.add('hurt'); setTimeout(() => scopeBox.classList.remove('hurt'), 700);
  Sound.tone(140, 0.25, 'square', 0.05, 70);
}
function heal(n, why){
  const b = G.hp; G.hp = Math.min(5, G.hp + n);
  if (G.hp > b) note(`♥ +${G.hp - b} ${esc(why || '')}`, 'up'); else note('♥ Already at full health.');
}
function zoneNow(){ if (!G) return 'bunker'; if (G.loc === 'tower' && F.towerIn) return 'booth'; return LOCS[G.loc].zone; }
function hasLight(){ return !!(F.lit || has('glow')); }
function noteCount(){ return (F.slotA || has('beep') ? 1 : 0) + (F.slotB || F.bFollow ? 1 : 0) + (F.slotC || has('music') ? 1 : 0); }
function allSlots(){ return !!(F.slotA && F.slotB && F.slotC); }
function chorusReady(){ return allSlots() && F.solvedEcho && (G.trust.hum || 0) >= 3; }
function checkFollow(){
  const need = F.grabbedB ? 4 : 3;
  if (!F.bFollow && (G.trust.bert || 0) >= need){
    F.bFollow = 1;
    p(`🪿 **${charName('bert')} has decided you belong to him now.** He will follow you everywhere.`);
    note('🪿 Companion joined: ' + esc(charName('bert')), 'meet');
  }
}

function techFlash(){
  if (!has('flash')){ p(`You'd fix a flashlight if you had one.`); return true; }
  F.lit = 1;
  p(`You rub the contacts, bend a spring back into shape, and give it one firm smack. *Click.* **Light!** Who needs batteries?`);

}
function installBat(){
  if (!has('bat')){ p(`You don't have any batteries. ${F.vendrMet ? 'VEND-R sells them.' : 'Maybe a vending machine sells them?'}`); return true; }
  if (!has('flash')){ p(`You've got batteries but nothing to put them in.`); return true; }
  if (F.lit){ p(`Your flashlight already works.`); return true; }
  take('bat'); F.lit = 1;
  p(`You slot the batteries in. *Click.* **LIGHT!** Glorious, beautiful light.`);
  return true;
}

function pickVendr(){
  F.picked = 1; G.stock.b4 = 0;
  p(`You sneak around the back, find the service panel, and tickle the lock with two bobby pins. *Click.* Slot B4 swings open.`);
  give('chip');
  if ((G.trust.vendr || 0) >= 4) say('vendr', `...Did you just pick my lock? ...You know what? You're my favorite. I'll allow it.`);
  else { tr('vendr', -2); say('vendr', `Did you just... PICK MY LOCK? I feel so... *violated*.`); }
}
function pryVendr(){
  F.pried = 1; G.stock.b4 = 0;
  p(`You jam the crowbar into VEND-R's door and HEAVE. *CRUNCH.* A tiny chip clatters out of slot B4.`);
  give('chip');
  if (G.trust.vendr) { G.trust.vendr = 0; note('💔 VEND-R trust ▼▼▼', 'down'); }
  p(`VEND-R's fairy lights flicker... and go dim.`);
  say('vendr', `...Why? I would have sold it to you. Eventually.`);
  p(`Then it starts playing a very, very sad song. It will remember this.`);
}
function b4Price(){ return F.haggled ? 2 : 3; }
function buy(id, cost){
  if (G.tok < cost){ say('vendr', `Darling, you have ${G.tok} token${G.tok === 1 ? '' : 's'}. I don't do credit.`); return; }
  G.tok -= cost; G.stock[id]--; note(`− 🪙 ${cost}`);
  const lines = {
    soup:`*Ka-chunk!* One Mystery Soup. Don't ask what the mystery is. I don't know either.`,
    bat:`*Ka-chunk!* Batteries! For all your battery-related needs.`,
    pretz:`*Ka-chunk!* Sadness Pretzels. Shaped like little frowns. Nobody ever buys these. Thank you.`,
  };
  say('vendr', lines[id]);
  give(id);
}
function buyB4(){
  if ((G.trust.vendr || 0) < 3){ say('vendr', `Hmm. Dr. Varga said only for NICE people. Have you been nice to me? I'm not convinced yet, darling.`); p(`*(VEND-R trust: ${G.trust.vendr || 0}/5. It wants 3.)*`); return; }
  const c = b4Price();
  if (G.tok < c){ say('vendr', `B4 is ${c} tokens, darling. You have ${G.tok}. Keep looking! Couches are a gold mine.`); return; }
  G.tok -= c; G.stock.b4 = 0; note(`− 🪙 ${c}`);
  say('vendr', `For you? Yes. *Ka-chunk!* Take good care of it. Whoever it belongs to must be missing it terribly.`);
  give('chip');
}

function askGrate(){

  if ((G.trust.mop || 0) >= 3){
    say('mop', `The grate? It goes down to Level D-1. The Choir Engine. Nobody's supposed to go down there...`);
    say('mop', `But you've been so kind to me. Here.`);
    give('key');
  } else {
    say('mop', `That grate leads to Level D-1. The Choir Engine. I have the key! But I only lend it to people I trust. I'm very sorry. Rules are like floors: they should be kept clean.`);
    p(`*(MOP trust: ${G.trust.mop || 0}/5. Kindness might help.)*`);
  }
}

/* ---------- RADIO ROOM + DR. VARGA + THE HUM ---------- */
function tune(raw){
  let v;
  if (/[.,]/.test(raw)) v = parseFloat(raw.replace(',', '.'));
  else { const n = parseInt(raw, 10); v = n > 108 ? n / 10 : n; }
  if (isNaN(v)){ p(`That's not a frequency. The dial looks confused.`); return; }
  if (Math.abs(v - 88.1) < 0.01){
    Sound.tone(880, 0.08, 'sine', 0.03);
    if (!F.vargaMet){ goScene('varga_radio'); return; }
    p(`*Kssshh...* You tune to **88.1**.`);
    say('varga', F.towerIn ? `You're calling me from down there? Okay. Talk fast. Radios make me nervous now.` : `${N()}! You're still in one piece! Good. What do you need?`);
    goScene('varga_chat');
    return;
  }
  if (v < 87.5 || v > 108){ p(`The dial doesn't go to ${esc(String(v))}. It goes from 87.5 to 108.0. The dial has standards.`); return; }
  p(`You tune to **${v.toFixed(1)}**. Static... and then, on every station, the same thing:`);
  goScene('hum_talk');
}
function tellVargaIntercom(){
  F.toldVargaHum = 1;
  if (F.hidFromHum && !F.answeredHum && !F.askedVoice && !F.liedHum){
    F.vargaHidPraise = 1;
    say('varga', `It talked to you, and you stayed SILENT? Oh, that's smart. That's *very* smart. Okay. I like you.`);
    tr('varga', 1);
  } else {
    say('varga', `You TALKED to it?! What did it say?`);
    p(`You tell her. She's quiet for a long time.`);
    say('varga', `It sounded... curious? Lonely? No. No, it's a machine. Machines aren't lonely. ...Are they?`);
    F.vargaDoubts = 1;
  }
}

function goScene(id){
  const sc = SC[id];
  if (!sc){ console.error('Missing scene', id); return; }
  G.scene = id;
  if (sc.enter) sc.enter();
}
function gateOK(a, b){
  if (a === 'pod' && !F.out) return false;
  if (a === 'maint' && b === 'jars') return !!(F.grateOpen || F.ventDown);
  if (a === 'vault' && b === 'square') return !!F.vaultOpen;
  return true;
}
function exitsOf(l){ return ADJ[l].filter(to => gateOK(l, to)); }
function exitChoice(to){
  const from = G.loc;
  let t = EXIT_LABEL[from + '>' + to] || `🚶 Go to ${LOCS[to].name}`;
  if (from === 'maint' && to === 'jars' && F.ventDown && !F.grateOpen) t = '🤸 Slide down the steam vent to Level D-1';
  return { t, exit:to, do(){ goLoc(to); } };
}
function goLoc(to){
  const from = G.loc;
  if (from === 'maint' && to === 'jars' && !G.vis.jars) descend();
  G.loc = to;
  G.vis[to] = (G.vis[to] || 0) + 1;
  goScene(to);
}
function computeChoices(){
  const sc = SC[G.scene];
  let list = (sc.choices ? sc.choices() : []).filter(Boolean);
  let full = list.slice();
  if (sc.hub){
    const ex = exitsOf(G.loc).map(exitChoice);
    full = list.concat(ex);
    if (list.length + ex.length <= 5) list = list.concat(ex);
    else if (ex.length <= 2) list = list.slice(0, 5 - ex.length).concat(ex);
    else list = list.slice(0, 4).concat([{ t:'🚶 Go somewhere else…', go:'_travel' }]);
  } else if (list.length > 5){
    list = list.slice(0, 4).concat([list[list.length - 1]]);
  }
  current = list;
  fullList = full.concat(list.filter(c => !full.includes(c)));
}
function runChoice(c){
  if (c.do) c.do();
  if (c.go && !G.ended) goScene(c.go);
}
function choose(c){
  if (!c || !G || G.ended) return;
  Sound.click();
  beginTurn(c.t);
  runChoice(c);
  endTurn();
}
function beginTurn(echo){
  logEl.querySelectorAll('.turn:not(.old)').forEach(el => el.classList.add('old'));
  curTurn = document.createElement('section');
  curTurn.className = 'turn';
  if (echo){ const e = document.createElement('div'); e.className = 'echo'; e.textContent = '› ' + echo; curTurn.appendChild(e); }
  logEl.appendChild(curTurn);
}
function endTurn(meta){
  if (G && !meta && !G.ended){
    G.turns++;
    if (G.hp <= 0) ending('nap');
  }
  if (G && !meta && !G.ended) add('', statusHTML());
  render();
  scrollToTurn(curTurn);
  trimLog();
  if (finePointer && G) inEl.focus({ preventScroll:true });
}
function metaTurn(echo, fn){
  beginTurn(echo);
  fn();
  endTurn(true);
}
function scrollToTurn(el){
  if (!el) return;
  requestAnimationFrame(() => {
    const top = el.offsetTop - 6;
    const fits = el.offsetHeight < logEl.clientHeight;
    logEl.scrollTo({ top: fits ? Math.max(top, el.offsetTop + el.offsetHeight - logEl.clientHeight) : top, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
}
function trimLog(){
  const turns = logEl.querySelectorAll('.turn');
  for (let i = 0; i < turns.length - 70; i++) turns[i].remove();
}
function statusHTML(){
  const hp = '♥'.repeat(G.hp) + `<span class="off">${'♥'.repeat(5 - G.hp)}</span>`;
  const items = ITEM_IDS.filter(has).map(id => `<span title="${esc(itemName(id))}">${ITEMS[id].e}${G.inv[id] > 1 ? `<sub>${G.inv[id]}</sub>` : ''}</span>`).join(' ') || '<span class="none">empty</span>';

  return `<div class="status" role="group" aria-label="Status">
    <span class="st-loc">${LOCS[G.loc].e} ${esc(LOCS[G.loc].name.toUpperCase())}</span>
    <span class="st-hp" aria-label="Health ${G.hp} of 5">${hp}</span>
    <span class="st-items">🎒 ${items}</span>

}
function render(){
  if (!G) return;
  if (G.ended){
    current = []; fullList = [];
    askEl.textContent = 'THE END';
    choicesEl.innerHTML = '';
    const opts = [
      { t:'▶ Play again (new character)', fn: showTitle },
      { t:`↻ Try again as ${G.name}`, fn: () => start(G.name, G.skill, G.skillLabel) },
    ];
    opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice';
      b.innerHTML = `<span class="k">${i + 1}</span><span class="t"></span>`;
      b.querySelector('.t').textContent = o.t;
      b.addEventListener('click', o.fn);
      choicesEl.appendChild(b);
    });
  } else {
    computeChoices();
    askEl.textContent = 'WHAT DO YOU DO?';
    choicesEl.innerHTML = '';
    current.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice';
      b.innerHTML = `<span class="k">${i + 1}</span><span class="t"></span>${c.sk ? '<span class="sk">SKILL</span>' : ''}`;
      b.querySelector('.t').textContent = c.t;
      b.addEventListener('click', () => choose(c));
      choicesEl.appendChild(b);
    });
  }
  document.querySelectorAll('[data-cmd="save"]').forEach(b => b.disabled = !!G.ended);
  const z = zoneNow();
  Sound.zone(G.ended === 'chorus' ? 'bunker' : z);
  scope.setZone(G.ended === 'chorus' ? 'chorus' : z);
  const db = z === 'booth' ? 30 : LOCS[G.loc].db;
  dblEl.textContent = G.ended === 'chorus' ? 'AMBIENT 64 dB · SOUND RESTORED' : (db === 0 ? 'AMBIENT 0 dB · SILENT' : `AMBIENT ${db} dB`);
}

const STOP = new Set('the a an to at my your with and on in of i me it is go walk head into onto for this that some please then just around again now'.split(' '));
const SYN = {
  grab:'take', get:'take', snatch:'take', pick:'take', collect:'take', pickup:'take',
  speak:'talk', chat:'talk', converse:'talk', examine:'look', inspect:'look', check:'look', study:'look', view:'look', read:'look',
  explore:'search', rummage:'search', feed:'offer', give:'offer',
  vending:'vendr', machine:'vendr', 'vend-r':'vendr', vender:'vendr', robot:'mop', janitor:'mop',
  bird:'goose', bertrand:'goose', geese:'goose', mushrooms:'mushroom', shroom:'mushroom', glowcap:'mushroom', glowcaps:'mushroom',
  scientist:'varga', doctor:'varga', ines:'varga', kid:'pip', child:'pip', leave:'step', back:'step', exit:'step', bye:'goodbye',
};
function words(s){
  return s.toLowerCase().replace(/[^a-z0-9\s'-]/g, ' ').replace(/'/g, '').split(/\s+/).filter(w => w && !STOP.has(w)).map(w => SYN[w] || w);
}
function matchChoice(t, list){
  const iw = words(t);
  if (!iw.length) return null;
  let best = null, bestScore = 0, second = null;
  for (const c of list){
    const cw = words(c.t);
    let s = 0;
    for (const w of iw){
      if (cw.some(x => x === w || (w.length >= 4 && x.length >= 4 && (x.includes(w) || w.includes(x))))) s++;
    }
    if (!s) continue;
    const score = s / iw.length + s * 0.001;
    if (score > bestScore){ second = best && bestScore === score ? best : null; best = c; bestScore = score; }
    else if (score === bestScore) second = c;
  }
  if (!best || bestScore < 0.5) return null;
  if (second && second !== best) return { ambiguous:true, a:best, b:second };
  return best;
}
function findItem(s){
  const map = [['shatter',/shatter|black key|glass key/],['badge',/badge|\bid\b/],['flash',/flashlight|torch/],['bat',/batter/],['glow',/glowcap|mushroom/],
    ['soup',/soup/],['pretz',/pretzel/],['chip',/chip/],['tape',/tape|cassette/],['crowbar',/crowbar/],['chalk',/chalk/],['book',/book/],
    ['jar',/jar|burp/],['beep',/beep|cartridge/],['music',/music|lullaby/],['key',/\bkey\b/]];
  for (const [id, re] of map) if (re.test(s)) return id;
  return null;
}

function lookAround(){
  const sc = SC[G.scene];

  const ex = exitsOf(G.loc);

}
function goByName(t){
  const moving = /^(go|walk|head|run|travel|enter|visit|return|climb|move|leave|back to|go back to|take me to)\b/.test(t);
  for (const l of LOC_IDS){
    for (const w of LOC_WORDS[l]){
      const re = new RegExp('\\b' + w.replace(/[-]/g, '\\-') + '\\b');
      if ((moving && re.test(t)) || t === w){
        if (l === G.loc){ p(`You're already in the ${LOCS[l].name}.`); return true; }
        if (!SC[G.scene].hub){ p(`You're in the middle of something. Finish up or step back first.`); return true; }
        if (exitsOf(G.loc).includes(l)){ note('→ ' + esc(exitChoice(l).t), 'interp'); goLoc(l); return true; }
        const ex = exitsOf(G.loc);
        p(`You can't get to ${G.vis[l] ? 'the ' + LOCS[l].name : 'there'} from here. Exits: ${ex.map(x => LOCS[x].name).join(', ') || 'none yet'}.`);
        return true;
      }
    }
  }
  if (moving){ const ex = exitsOf(G.loc); p(`Go where? From here you can reach: ${ex.map(x => LOCS[x].name).join(', ') || 'nowhere yet'}.`); return true; }
  return false;
}
function fallback(){
  const surf = zoneNow() === 'surface';
  const lines = surf ? [
    `You try that. Nothing happens, and it's extra awkward with no sound.`,
    `Hmm. That doesn't work. A passing mail carrier shrugs at you. (Try a numbered choice, or type **hint**.)`,
    `Nope. The silent world doesn't react. Type **help** for commands.`,
  ] : [
    `You try that. The universe shrugs. (Try a numbered choice, or type **hint**.)`,
    `Hmm. Nothing happens. Somewhere far below, the hum sounds faintly amused.`,
    `That doesn't seem to work here. Type **help** for the list of commands.`,
    `Bold move. Nothing happens, though.`,
  ];
  p(lines[G.c.huh++ % lines.length]);
}
function resolve(t){
  const sc = SC[G.scene];
  if (sc.parse && sc.parse(t)) return true;
  const hub = SC[G.loc];
  if (hub !== sc && hub.parse && hub.parse(t)) return true;
  if (/^(l|look|look around|where am i|describe|surroundings)$/.test(t)){ lookAround(); return true; }
  if (globalVerbs(t)) return true;
  const c = matchChoice(t, fullList);
  if (c){
    if (c.ambiguous){ p(`Did you mean **${esc(c.a.t)}** or **${esc(c.b.t)}**? Try clicking one, or type its number.`); return true; }
    note('→ ' + esc(c.t), 'interp');
    runChoice(c);
    return true;
  }
  if (goByName(t)) return true;
  if (/^(hello|hi|hey|yo|sup)\b/.test(t)){ p(zoneNow() === 'surface' ? `You say hi. No sound comes out. Someone waves back anyway.` : `"Hello?" you say. Far below, the hum hums back. Two notes. Like a hello.`); return true; }
  return false;
}
function handleInput(raw){
  const t0 = raw.trim().slice(0, 80);
  if (!t0 || !G) return;
  const t = t0.toLowerCase().replace(/[.!?]+$/, '').replace(/\s+/g, ' ').trim();
  if (G.ended){
    if (/^(restart|play again|again|new game|yes)$/.test(t)) return showTitle();
    if (/^load\b/.test(t)) return cmdLoad(t0.replace(/^load\s*/i, ''));
    metaTurn(t0, () => p(`This story is over! Pick **Play again** below. There ${8 - getEndings().length === 1 ? 'is 1 ending' : 'are ' + (8 - getEndings().length) + ' endings'} you haven't found yet.`));
    return;
  }
  if (/^[1-9]$/.test(t)){ const c = current[+t - 1]; if (c) return choose(c); }
  if (/^(i|inv|inventory|bag|backpack|items|pockets)$/.test(t)) return cmdInventory();
  if (/^(m|map)$/.test(t)) return cmdMap();
  if (/^(h|hint|hints|clue|help me|stuck|im stuck|i'm stuck)$/.test(t)) return cmdHint();
  if (/^(save|save game)$/.test(t)) return cmdSave();
  if (/^load\b/.test(t)) return cmdLoad(t0.replace(/^load\s*/i, ''));
  if (/^(help|commands|\?|how do i play)$/.test(t)) return cmdHelp();
  if (/^(status|stats|health|hp|trust)$/.test(t)) return cmdStatus();
  if (/^(restart|start over|new game)$/.test(t)) return choose({ t:t0, go:'restart_confirm' });
  beginTurn(t0);
  if (!resolve(t)) fallback();
  endTurn();
}

/* =====================================================================
   SAVE / LOAD
   ===================================================================== */
const B32 = '0123456789abcdefghijklmnopqrstuv';
function bitsEnc(arr){ let s = ''; for (let i = 0; i < arr.length; i += 5){ let v = 0; for (let j = 0; j < 5; j++) if (arr[i + j]) v |= 1 << j; s += B32[v]; } return s; }
function bitsDec(str, n){ const out = []; for (let i = 0; i < n; i++){ const v = B32.indexOf(str[Math.floor(i / 5)] || '0'); out.push(((v >> (i % 5)) & 1) === 1); } return out; }
function b64e(str){ const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function cks(s){ let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1296; return h.toString(36).padStart(2, '0'); }
function makeCode(){
  const parts = [
    'v1', G.name, G.skill, G.skillLabel, LOC_IDS.indexOf(G.loc), G.hp, G.tok,
    ITEM_IDS.map(i => Math.min(9, G.inv[i] || 0)).join(''),
    bitsEnc(FLAGS.map(f => !!F[f])),
    bitsEnc(LOC_IDS.map(l => !!G.vis[l])),
    TRUST_ORDER.map(w => G.trust[w] === undefined ? 'x' : G.trust[w]).join(''),
    [G.stock.soup, G.stock.bat, G.stock.pretz, G.stock.b4, G.c.glowPicked, Math.min(9, G.c.wrong)].join(''),
    G.hints.toString(36), G.turns.toString(36),
  ];
  const payload = b64e(parts.join('|'));
  return 'B9-' + payload + '.' + cks(payload);
}
function decodeCode(code){
  code = code.replace(/\s+/g, '');
  if (!/^B9-/i.test(code)) return null;
  const body = code.slice(3), dot = body.lastIndexOf('.');
  if (dot < 0) return null;
  const payload = body.slice(0, dot), sum = body.slice(dot + 1).toLowerCase();
  if (cks(payload) !== sum) return null;
  let parts;
  try { parts = b64d(payload).split('|'); } catch (e) { return null; }
  if (parts.length !== 14 || parts[0] !== 'v1' || !SKILLS[parts[2]]) return null;
  const g = freshState(parts[1].slice(0, 16), parts[2], parts[3].slice(0, 24));
  g.loc = LOC_IDS[+parts[4]] || 'pod';
  g.hp = Math.max(1, Math.min(5, +parts[5] || 1));
  g.tok = Math.max(0, Math.min(9, +parts[6] || 0));
  ITEM_IDS.forEach((id, i) => { const n = +(parts[7][i] || 0); if (n) g.inv[id] = n; });
  bitsDec(parts[8], FLAGS.length).forEach((on, i) => { if (on) g.F[FLAGS[i]] = 1; });
  bitsDec(parts[9], LOC_IDS.length).forEach((on, i) => { if (on) g.vis[LOC_IDS[i]] = 2; });
  TRUST_ORDER.forEach((w, i) => { const ch = parts[10][i]; if (ch && ch !== 'x') g.trust[w] = Math.max(0, Math.min(5, +ch)); });
  const s = parts[11];
  g.stock = { soup:+s[0] || 0, bat:+s[1] || 0, pretz:+s[2] || 0, b4:+s[3] || 0 };
  g.c.glowPicked = +s[4] || 0; g.c.wrong = +s[5] || 0;
  g.hints = parseInt(parts[12], 36) || 0; g.turns = parseInt(parts[13], 36) || 0;
  g.vis[g.loc] = 2;
  return g;
}
function tryLoad(code){
  const g = decodeCode(code);
  if (!g) return false;
  G = g; F = G.F;
  logEl.innerHTML = '';
  dockEl.hidden = false; setTools(true); Sound.start();
  beginTurn(null);
  add('intro', `<span class="intro-name">${N()}</span><span class="intro-skill">${SKILLS[G.skill].e} ${esc(G.skillLabel)}</span>`);
  note(`💾 Save loaded. Welcome back, ${N()}.`, 'meet');
  if (G.loc === 'pod' && !F.out) goScene('pod_wake');
  else goScene(G.loc);
  add('', statusHTML());
  endTurn(true);
  return true;
}

/* =====================================================================
   SOUND (starts after the first click; the surface is silent on purpose)
   ===================================================================== */
const Sound = {
  ctx:null, on:true, humGain:null, started:false,
  start(){
    if (this.started) { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const g = this.ctx.createGain(); g.gain.value = 0; g.connect(this.ctx.destination);
      const o1 = this.ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
      const o2 = this.ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 110.7;
      const g2 = this.ctx.createGain(); g2.gain.value = 0.3;
      o1.connect(g); o2.connect(g2); g2.connect(g); o1.start(); o2.start();
      this.humGain = g; this.started = true;
    } catch (e) { this.ctx = null; }
  },
  zone(z){
    if (!this.humGain) return;
    const target = !this.on ? 0 : z === 'deep' ? (G && G.loc === 'engine' ? 0.09 : 0.065) : z === 'bunker' ? 0.035 : 0;
    try { this.humGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.5); } catch (e) {}
  },
  tone(freq, dur, type, vol, slideTo){
    if (!this.ctx || !this.on) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  click(){ if (zoneNow() !== 'surface') this.tone(620, 0.035, 'square', 0.018); },
  honk(){ this.tone(330, 0.24, 'sawtooth', 0.07, 230); setTimeout(() => this.tone(300, 0.2, 'sawtooth', 0.06, 210), 130); },
  beep(){ this.tone(1320, 0.14, 'sine', 0.05); },
  lullaby(){ [659, 587, 523, 587, 659, 659, 659].forEach((f, i) => setTimeout(() => this.tone(f * 2, 0.32, 'triangle', 0.035), i * 260)); },
  ending(id){
    const up = { chorus:[523,659,784,1047,1319], half:[523,659,784], loud:[200,180,160,140,120] }[id] || [392,330,262];
    up.forEach((f, i) => setTimeout(() => this.tone(f, 0.5, id === 'loud' ? 'sawtooth' : 'triangle', 0.04), i * 180));
  },
};
sndBtn.addEventListener('click', () => {
  Sound.on = !Sound.on;
  sndBtn.setAttribute('aria-pressed', String(Sound.on));
  sndBtn.querySelector('.ic').textContent = Sound.on ? '🔊' : '🔇';
  if (Sound.on) Sound.start();
  Sound.zone(zoneNow());
});

/* =====================================================================
   SOUND METER (oscilloscope strip): wiggles in the bunker, flat on the surface
   ===================================================================== */
const scope = {
  cv: document.getElementById('scope'), amp:6, target:6, t:0, mode:'bunker', colors:null, frame:0,
  setZone(z){ this.mode = z; this.target = z === 'surface' ? 0 : z === 'booth' ? 3 : z === 'deep' ? (G && G.loc === 'engine' ? 15 : 10) : z === 'chorus' ? 13 : 6; if (reduceMotion){ this.amp = this.target; this.draw(); } },
  readColors(){ const cs = getComputedStyle(document.documentElement); this.colors = { line:cs.getPropertyValue('--line').trim(), hum:cs.getPropertyValue('--hum').trim(), amber:cs.getPropertyValue('--amber').trim(), faint:cs.getPropertyValue('--faint').trim() }; },
  draw(){
    const cv = this.cv, w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    if (!this.colors || this.frame % 90 === 0) this.readColors();
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.strokeStyle = this.colors.line; c.lineWidth = 1; c.beginPath();
    for (let x = 0; x < w; x += 22){ c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, h); }
    c.moveTo(0, h / 2 + 0.5); c.lineTo(w, h / 2 + 0.5);
    c.stroke();
    this.amp += (this.target - this.amp) * 0.04;
    const a = Math.min(this.amp, h / 2 - 3), t = this.t;
    c.strokeStyle = this.mode === 'surface' && this.amp < 0.4 ? this.colors.faint : this.mode === 'chorus' ? this.colors.amber : this.colors.hum;
    c.lineWidth = 1.6; c.beginPath();
    for (let x = 0; x <= w; x += 2){
      const k = x / w;
      let y = Math.sin(k * 19 + t * 2) * 0.55 + Math.sin(k * 43 - t * 3.1) * 0.25 + Math.sin(k * 7 + t * 0.7) * 0.3;
      if (this.amp > 9) y *= 1 + 0.35 * Math.sin(k * 95 + t * 7);
      const yy = h / 2 + a * y;
      if (x === 0) c.moveTo(x, yy); else c.lineTo(x, yy);
    }
    c.stroke();
    this.t += 0.016; this.frame++;
  },
};
function loop(){
  if (!document.hidden) scope.draw();
  if (G && G.ended === 'chorus' && clockStart){
    const mins = 18 + Math.floor((Date.now() - clockStart) / 60000);
    clkEl.textContent = `03:${String(mins % 60).padStart(2, '0')}`;
  } else clkEl.textContent = '03:17';
  requestAnimationFrame(loop);
}

/* =====================================================================
   TITLE SCREEN + START
   ===================================================================== */
function setTools(on){ document.querySelectorAll('[data-cmd]').forEach(b => { b.disabled = !on; }); }
function guessSkill(text){
  const s = text.toLowerCase();
  for (const id of SKILL_IDS) if (SKILL_WORDS[id].some(w => s.includes(w))) return id;
  return null;
}
function showTitle(){
  G = null; F = {}; clockStart = 0;
  logEl.innerHTML = ''; choicesEl.innerHTML = ''; dockEl.hidden = true; setTools(false);
  scope.setZone('bunker'); Sound.zone('surface');
  dblEl.textContent = 'AMBIENT 38 dB';
  const found = getEndings();
  const card = document.createElement('section');
  card.className = 'title';
  card.innerHTML = `
    <div class="t-kicker">HUSHWELL ACOUSTICS · FACILITY 9 · DAY 23 OF THE QUIET</div>
    <h1 class="big">BUNKER 9<span>THE QUIET</span></h1>
    <p class="t-lede">You wake up in an abandoned bunker. Every clock is stuck on the same minute. Up on the surface, the whole world has gone silent. And something deep underground is humming... in a voice that sounds a lot like yours.</p>
    <ul class="t-rules"><li><b>No dice. No luck.</b> Only your choices.</li><li><b>People remember</b> what you do.</li><li><b>8 endings.</b> One is secret.</li></ul>
    <form id="newgame" class="t-form" autocomplete="off" novalidate>
      <label class="fl" for="nm">1 · Your name</label>
      <input id="nm" maxlength="16" placeholder="Type your name">
      <div class="fl">2 · One special skill</div>
      <div class="skills" role="group" aria-label="Special skill">${SKILL_IDS.map(id => `<button type="button" class="skill" data-skill="${id}" aria-pressed="false"><span class="se">${SKILLS[id].e}</span><span><b>${esc(SKILLS[id].label)}</b><small>${esc(SKILLS[id].blurb)}</small></span></button>`).join('')}</div>
      <label class="fl" for="cs">…or make up your own skill</label>
      <input id="cs" maxlength="24" placeholder="e.g. super-loud whistling">
      <div id="cmap" class="cmap" hidden></div>
      <button class="start" id="startbtn" type="submit">WAKE UP ▸</button>
      <p class="t-err" id="terr" role="status"></p>
    </form>
    <details class="t-load"><summary>Have a save code? Continue your game</summary>
      <form id="loadform" class="t-loadrow" autocomplete="off"><input id="lc" placeholder="Paste your save code (starts with B9-)" aria-label="Save code"><button class="go" type="submit">LOAD</button></form>
      <p class="t-err" id="lerr" role="status"></p>
    </details>
    <div class="t-ends"><div class="fl">Endings found · ${found.length}/8</div>${endGrid(found)}</div>`;
  logEl.appendChild(card);
  logEl.scrollTop = 0;

  let picked = null;
  const nm = card.querySelector('#nm'), cs = card.querySelector('#cs'), terr = card.querySelector('#terr'), cmap = card.querySelector('#cmap');
  const skillBtns = card.querySelectorAll('.skill');
  skillBtns.forEach(b => b.addEventListener('click', () => {
    picked = b.dataset.skill; cs.value = ''; cmap.hidden = true;
    skillBtns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    terr.textContent = '';
  }));
  cs.addEventListener('input', () => { if (cs.value.trim()){ picked = null; skillBtns.forEach(x => x.setAttribute('aria-pressed', 'false')); } cmap.hidden = true; });
  card.querySelector('#newgame').addEventListener('submit', e => {
    e.preventDefault();
    const name = nm.value.replace(/\|/g, '').trim();
    const custom = cs.value.replace(/\|/g, '').trim();
    if (!name){ terr.textContent = 'Type a name first!'; nm.focus(); return; }
    if (custom){
      const guess = guessSkill(custom);
      if (guess) return start(name, guess, custom);
      cmap.hidden = false;
      cmap.innerHTML = `<p><b>"${esc(custom)}"</b> is a great skill! In Bunker 9, what kind of problems does it help you solve?</p>${SKILL_IDS.map(id => `<button type="button" class="cat" data-cat="${id}"><span class="se">${SKILLS[id].e}</span><span><b>${esc(SKILLS[id].cat)}</b><small>Works like ${esc(SKILLS[id].label.toLowerCase())}</small></span></button>`).join('')}`;
      cmap.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => start(name, b.dataset.cat, custom)));
      return;
    }
    if (!picked){ terr.textContent = 'Pick a special skill (or make one up)!'; return; }
    start(name, picked, SKILLS[picked].label);
  });
  card.querySelector('#loadform').addEventListener('submit', e => {
    e.preventDefault();
    const v = card.querySelector('#lc').value.trim();
    if (!v || !tryLoad(v)) card.querySelector('#lerr').textContent = "That code didn't work. Make sure you copied all of it (it starts with B9-).";
  });
  if (finePointer) nm.focus({ preventScroll:true });
}
function start(name, skill, label){
  G = freshState(name.slice(0, 16), skill, (label || SKILLS[skill].label).slice(0, 24));
  F = G.F; clockStart = 0;
  logEl.innerHTML = '';
  dockEl.hidden = false; setTools(true); Sound.start();
  beginTurn(null);
  const custom = label && label !== SKILLS[skill].label;
  add('intro', `<span class="intro-name">${N()}</span><span class="intro-skill">${SKILLS[skill].e} ${esc(G.skillLabel)}${custom ? ` <small>(works like ${esc(SKILLS[skill].label.toLowerCase())})</small>` : ''}</span>`);
  note('Tip: click a choice, type its number, or type anything you want to try. Commands: inventory · map · hint · save · help');
  G.vis.pod = 1;
  goScene('pod_wake');
  endTurn();
}

   ===================================================================== */
formEl.addEventListener('submit', e => {
  e.preventDefault();
  const v = inEl.value;
  inEl.value = '';
  Sound.start();
  handleInput(v);
});
document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
  if (!G) return;
  Sound.start();
  ({ inventory:cmdInventory, map:cmdMap, hint:cmdHint, save:cmdSave })[b.dataset.cmd]();
}));
logEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !G) return;
  const act = b.dataset.act;
  if (act === 'copy'){
    const code = b.dataset.code;
    const done = () => { b.textContent = 'COPIED ✓'; };
    const fallbackSelect = () => { const ta = b.closest('.card').querySelector('textarea'); if (ta){ ta.focus(); ta.select(); } b.textContent = 'SELECTED: PRESS CTRL+C'; };
    try { navigator.clipboard.writeText(code).then(done, fallbackSelect); } catch (err) { fallbackSelect(); }
    return;
  }
  if (act.startsWith('use:') && !G.ended){
    const id = act.slice(4);
    if (!has(id)) return;
    Sound.click();
    beginTurn(`use ${itemName(id)}`);
    useItem(id);
    endTurn();
  }
});

// Test/debug hook (harmless): lets automated checks drive the game.
window.__b9 = { get G(){ return G; }, input: handleInput, choices: () => current.map(c => c.t), pick: i => choose(current[i]), start, load: tryLoad, code: () => makeCode() };

function boot(data){
  if (data && data.G && data.log){
    G = data.G; F = G.F; logEl.innerHTML = data.log; dockEl.hidden = false; setTools(true);
    curTurn = logEl.querySelector('.turn:last-of-type');
    render();
  } else showTitle();
  requestAnimationFrame(loop);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (G ? { G, log: logEl.innerHTML } : {}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
