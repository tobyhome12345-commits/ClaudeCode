<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Hub</title>
  <meta name="description" content="A friendly study site for Year 7 — lessons, worked examples and practice questions.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
  <!-- Optional nice font. If you're offline the site falls back to a system font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/"><span aria-hidden="true">🎓</span> Study Hub</a>
  </header>

  <main id="app" class="page" tabindex="-1"></main>

  <div id="toasts" class="toast-wrap" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <!-- 1. Core engine (order matters) -->
  <script src="js/registry.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/answers.js"></script>
  <script src="js/visuals.js"></script>

  <!-- 2. Subjects. To add one, add a line to data/subjects.js (see README). -->
  <script src="data/subjects.js"></script>

  <!-- 3. Maths topics. One file per topic — add a new file + a line here. -->
  <script src="data/maths/fractions.js"></script>
  <script src="data/maths/decimals-percentages.js"></script>
  <script src="data/maths/algebra.js"></script>
  <script src="data/maths/order-of-operations.js"></script>
  <script src="data/maths/negative-numbers.js"></script>
  <script src="data/maths/area-perimeter.js"></script>
  <script src="data/maths/ratios.js"></script>

  <!-- 4. The app itself (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
